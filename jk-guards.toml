# G130. A request's values reach other threads only as ScopedValues the propagator carries. An
# InheritableThreadLocal copies whichever request happened to create a pool's thread into every task
# that thread runs later, for the engine's life; there is no reason left to hold one.
[guards.no-inheritable-thread-local]
kind       = "forbid"
signatures = ["java.lang.InheritableThreadLocal"]
scope      = ["plugins/graph", "server/*", "shared/*"]
source-set = "main"
fixture    = "server/guard/fixtures/no-inheritable-thread-local"
instead    = "a ScopedValue registered with ContextPropagator.carry, or a Request.Slot for a type above core"
why        = "an inheritable thread-local hands a pool thread's first request to every task it runs after"

# G131. A plain ThreadLocal in the resident engine outlives the request that set it on a pool thread
# and is invisible to the next hop. The few that hold genuinely per-thread state are allow entries.
[guards.thread-local-owner]
kind       = "forbid"
signatures = ["java.lang.ThreadLocal#<init>(**)", "java.lang.ThreadLocal#withInitial(**)"]
scope      = ["plugins/graph", "server/*", "shared/*"]
source-set = "main"
fixture    = "server/guard/fixtures/thread-local-owner"
instead    = "pass the state, bind a ScopedValue for the operation, or carry it with ContextPropagator.carry"
why        = "a thread-local is left on a pool thread by one request and missing on the next thread the work hops to"

[[guards.thread-local-owner.allow]]
in     = "cc.jumpkick.mvn.ReactorModelResolver"
reason = "the cycle check's stack of POMs being built on this thread: a recursion on one thread, empty again when it unwinds"

[[guards.thread-local-owner.allow]]
in     = "cc.jumpkick.guard.api.runtime.GuardExtension"
reason = "the id of the guard method running on this test thread, set and cleared around it by asGuard"

# G132. Every carried value is registered by the class that owns it, once, in its static
# initializer. A registration anywhere else is a value carried by someone who does not own its
# lifetime, and the snapshot every pool task takes grows by one more binding.
[guards.carried-value-owners]
kind       = "text"
files      = ["server/*/src/main/java/**/*.java", "shared/*/src/main/java/**/*.java", "plugins/graph/src/main/java/**/*.java"]
pattern    = 'ContextPropagator\.carry\('
hit        = 'static { ContextPropagator.carry(LABEL); }'
miss       = 'String label = ContextPropagator.get(LABEL);'
fixture    = "server/guard/fixtures/carried-value-owners"
instead    = "register the value in its owner's static initializer and add the owner's file here with what it carries"
why        = "a carried value registered by a class that does not own it outlives the reason it was carried"

[[guards.carried-value-owners.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/config/SessionContext.java"
reason = "the bound session and request, pinned from the invocation's fallback on the submitting thread"

