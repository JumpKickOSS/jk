# G133. A ScopedValue that work reads after a pool hop must be carried, or the hop reads it unbound.
# Every one is registered with ContextPropagator.carry in its own file, or is an allow entry saying
# why it never needs to leave the thread that bound it: one operation's binding, or a test seam.
[guards.scoped-value-carried]
kind     = "text"
files    = ["server/*/src/main/java/**/*.java", "shared/*/src/main/java/**/*.java", "plugins/graph/src/main/java/**/*.java"]
pattern  = '\b(\w+)=ScopedValue\.(?:<[^()]*>)?newInstance\(\)(?![\s\S]*ContextPropagator\.carry\(\1[,)])'
hit      = 'private static final ScopedValue<String> LABEL = ScopedValue.newInstance();'
miss     = 'private static final ScopedValue<String> LABEL = ScopedValue.newInstance(); static { ContextPropagator.carry(LABEL); }'
fixture  = "server/guard/fixtures/scoped-value-carried"
instead  = "ContextPropagator.carry(VALUE) in the owner's static initializer, read through ContextPropagator.get; a binding that never leaves its thread is an allow entry"
why      = "a scoped value nobody carries reads as unbound on the first pool thread the work reaches"

[[guards.scoped-value-carried.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/config/SessionContext.java"
reason = "INVOCATION is the CLI invocation's own thread; what a pool task needs of it, the session, rides the carried binding pinned on the submitter"

[[guards.scoped-value-carried.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/changes/ChangeJournal.java"
reason = "test seam: the journal directory a test's writes on its own thread go to"

[[guards.scoped-value-carried.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/engine/plugin/WorkerEnv.java"
reason = "test seam: the environment a test's fork on its own thread filters instead of the engine's"

[[guards.scoped-value-carried.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/git/JGitProxyRoute.java"
reason = "one JGit operation's proxy route, read by the connection factory on the thread running that operation"

# G134. A parallel stream, the common pool or a fork-join task of jk's own runs its work on threads
# no request's carried values reach, and competes with the engine's pools for the cores. Work fans
# out through JkThreads, ParallelMap included, which carries the submitter's values to every helper.
[guards.no-parallel-streams]
kind       = "forbid"
signatures = [
  "java.util.Collection#parallelStream(**)",
  "java.util.stream.BaseStream#parallel(**)",
  "java.util.concurrent.ForkJoinPool#commonPool(**)",
  "java.util.concurrent.RecursiveAction",
  "java.util.concurrent.RecursiveTask",
  "java.util.concurrent.CountedCompleter",
  "java.util.Arrays#parallelSort(**)",
  "java.util.Arrays#parallelSetAll(**)",
  "java.util.Arrays#parallelPrefix(**)",
]
scope      = ["plugins/graph", "server/*", "shared/*"]
source-set = "main"
fixture    = "server/guard/fixtures/no-parallel-streams"
instead    = "cc.jumpkick.run.ParallelMap.map / forEach, or a task on a JkThreads pool"
why        = "a parallel stream's helpers run on the common pool, where none of the request's carried values reach"

[[guards.no-parallel-streams.allow]]
in     = "cc.jumpkick.host.PathUtil$Wipe*"
reason = "a tree delete forks a task per directory on DeleteParallelism's pool, sized to the filesystem; the tasks unlink files and read no carried value"

# G135. An async stage without an executor runs on the common pool: off every JkThreads pool, with
# none of the request's carried values, and sized by the core count whatever it waits on.
[guards.async-names-its-executor]
kind       = "forbid"
signatures = [
  "java.util.concurrent.CompletableFuture#supplyAsync(java.util.function.Supplier)",
  "java.util.concurrent.CompletableFuture#runAsync(java.lang.Runnable)",
  "java.util.concurrent.CompletableFuture#thenApplyAsync(java.util.function.Function)",
  "java.util.concurrent.CompletableFuture#thenAcceptAsync(java.util.function.Consumer)",
  "java.util.concurrent.CompletableFuture#thenRunAsync(java.lang.Runnable)",
  "java.util.concurrent.CompletableFuture#thenComposeAsync(java.util.function.Function)",
  "java.util.concurrent.CompletableFuture#handleAsync(java.util.function.BiFunction)",
  "java.util.concurrent.CompletableFuture#whenCompleteAsync(java.util.function.BiConsumer)",
]
scope      = ["plugins/graph", "server/*", "shared/*"]
source-set = "main"
fixture    = "server/guard/fixtures/async-names-its-executor"
instead    = "the overload that takes an executor: JkThreads.cpu() to compute, io() to wait on the network, platform() for a body that waits on other work"
why        = "an async stage without an executor runs on the common pool, where none of the request's carried values reach"

# G136. Threads come from JkThreads, whose pools carry every registered value onto each task. A pool
# of one's own carries nothing unless every task is wrapped by hand; each one here is an allow entry
# saying why its tasks need nothing of a request.
[guards.executors-through-jkthreads]
kind       = "forbid"
signatures = [
  "java.util.concurrent.Executors#newFixedThreadPool(**)",
  "java.util.concurrent.Executors#newCachedThreadPool(**)",
  "java.util.concurrent.Executors#newSingleThreadExecutor(**)",
  "java.util.concurrent.Executors#newScheduledThreadPool(**)",
  "java.util.concurrent.Executors#newSingleThreadScheduledExecutor(**)",
  "java.util.concurrent.Executors#newWorkStealingPool(**)",
  "java.util.concurrent.Executors#newThreadPerTaskExecutor(**)",
  "java.util.concurrent.Executors#newVirtualThreadPerTaskExecutor(**)",
  "java.util.concurrent.ForkJoinPool#<init>(**)",
  "java.util.concurrent.ThreadPoolExecutor#<init>(**)",
]
scope      = ["plugins/graph", "server/*", "shared/*"]
source-set = "main"
owner      = "cc.jumpkick.run.JkThreads"
fixture    = "server/guard/fixtures/executors-through-jkthreads"
instead    = "JkThreads.cpu() / io() / platform(); a pool that must stay private wraps each task with ContextPropagator.wrapCallable and is an allow entry"
why        = "a pool of one's own carries no request onto its tasks unless each is wrapped by hand"

[[guards.executors-through-jkthreads.allow]]
in     = "cc.jumpkick.resolver.MemberSolves"
reason = "the member solves of one lock, bounded by the heap each needs; every task is wrapped by ContextPropagator on the submitting thread"

[[guards.executors-through-jkthreads.allow]]
