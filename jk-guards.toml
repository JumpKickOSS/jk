# G108. A module's manifest is named through ManifestPaths.manifestIn, which answers the shadow of a
# directory built from its pom.xml; a raw dir.resolve(ManifestPaths.MANIFEST) reads a file that is
# not there. The sites that write a jk.toml, refuse to edit a shadowed one, or probe a written one
# as a tree boundary are allow entries, each carrying why it wants the written file.
[guards.manifest-reader-owner]
kind     = "text"
files    = ["**/src/main/java/**/*.java"]
patterns = ['\.resolve\(ManifestPaths\.MANIFEST\)', '\.resolve\(MANIFEST\)']
hit      = 'JkBuild build = JkBuildParser.parse(dir.resolve(ManifestPaths.MANIFEST));'
miss     = 'JkBuild build = JkBuildParser.parse(ManifestPaths.manifestIn(dir));'
instead  = "ManifestPaths.manifestIn(dir); a writer or a boundary probe is an allow entry"
why      = "a directory built from its pom.xml has no jk.toml; manifestIn is what answers its shadow"

[[guards.manifest-reader-owner.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/cli/CommandDispatch.java"
reason = "a plugin-declared command is offered only where a written jk.toml declares plugins; the probe is the cwd's file"

[[guards.manifest-reader-owner.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/command/interop/ImportCommand.java"
reason = "names the jk.toml the import writes"

[[guards.manifest-reader-owner.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/command/JkEnv.java"
reason = "the toolchain env walks up to the nearest written jk.toml and scans its jdk keys; a shadow carries none"

[[guards.manifest-reader-owner.allow]]
