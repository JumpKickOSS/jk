# jk's house rules — the declarative tier. Each letter of docs/contributors/code-as-art.md's
# registry that has moved here names its rule in Guards.kt (ruleId); G51 keeps the two in step.
# Exemptions go in `allow` with a reason; never a comment in code, never a hand edit of
# jk-guards-baseline.toml. `jk guard explain <id>` prints a rule; `--schema <kind>` prints a kind.

# G3. jk parses XML in one place, with one hardening posture. A second factory is a second XXE
# posture to get wrong; DomXml hands out documents, never a factory or a builder.
[guards.xml-parser-owner]
kind       = "forbid"
signatures = [
  "javax.xml.parsers.DocumentBuilderFactory",
  "javax.xml.parsers.SAXParserFactory",
  "javax.xml.stream.XMLInputFactory",
  "org.xml.sax.helpers.XMLReaderFactory",
]
owner      = "cc.jumpkick.host.DomXml"
instead    = "cc.jumpkick.host.DomXml.parse(byte[] | String | Path | InputStream), or newDocument()"
why        = "a second XML parser is a second XXE posture to get wrong"

# G68. The six flags DomXml.hardened sets are the only XXE posture jk has; each is checked by name.
[guards.xml-parser-hardening]
kind     = "text"
files    = ["shared/host/src/main/java/cc/jumpkick/host/DomXml.java"]
patterns = [
  "setFeature\\(XMLConstants\\.FEATURE_SECURE_PROCESSING,\\s*true\\)",
  "setFeature\\(\"http://apache\\.org/xml/features/disallow-doctype-decl\",\\s*true\\)",
  "setFeature\\(\"http://xml\\.org/sax/features/external-general-entities\",\\s*false\\)",
  "setFeature\\(\"http://xml\\.org/sax/features/external-parameter-entities\",\\s*false\\)",
  "setFeature\\(\"http://apache\\.org/xml/features/nonvalidating/load-external-dtd\",\\s*false\\)",
  "setExpandEntityReferences\\(false\\)",
]
count    = { exactly = 6, per = "tree" }
hit      = "f.setExpandEntityReferences(false);"
instead  = "restore the flag in DomXml.hardened, or change this rule in the same commit and say what jk now accepts from a hostile document"
why      = "DomXml is the only parser jk builds, so its flags are the only XXE posture jk has"

# G6. jk hashes in one place: a second digest site re-decides the buffer size, the exception
# policy and the hex spelling — one of them once substituted String.hashCode() for a cache key.
[guards.one-digest-surface]
kind       = "forbid"
signatures = ["java.security.MessageDigest#getInstance(**)"]
owner      = "cc.jumpkick.host.Hashing"
instead    = "Hashing.sha256Hex(bytes | String | Path) or Hashing.newSha256()"
why        = "one digest surface: buffer size, exception policy and hex spelling decided once"

# G69. Hashing's algorithm doors take a name only when a foreign format dictates it (a .sha1
# sidecar, an SDK feed); jk's own algorithm goes through newSha256 / sha256Hex.
[guards.own-algorithm-by-name]
kind       = "forbid"
signatures = [
  "cc.jumpkick.host.Hashing#newDigest(**)",
  "cc.jumpkick.host.Hashing#fileHex(**)",
  "cc.jumpkick.host.Hashing#hashHex(**)",
]
args       = ["SHA-256"]
owner      = "cc.jumpkick.host.Hashing"
instead    = "Hashing.newSha256() / Hashing.sha256Hex(..)"
why        = "spelling jk's own algorithm at a call site is a second place it can change"

# G8. An archive entry is stamped in one place. setTime converts to DOS time through the default
# timezone, so an archive written with it is a function of the build host's $TZ.
[guards.archive-instant-owner]
kind       = "forbid"
signatures = [
  "java.util.zip.ZipEntry#setTime(**)",
  "java.util.zip.ZipEntry#setTimeLocal(**)",
  "java.util.zip.ZipEntry#setLastModifiedTime(**)",
  "java.util.zip.ZipEntry#setCreationTime(**)",
  "java.util.zip.ZipEntry#setLastAccessTime(**)",
]
owner      = "cc.jumpkick.host.DeterministicZip"
instead    = "cc.jumpkick.host.DeterministicZip.entry(name)"
why        = "an archive stamped through the default timezone is a function of the build host's TZ"

# G9. Bytes become hex in one place. HexFormat.of().formatHex(digest) is fine Java and is banned
# because it is a second answer to "how does jk spell bytes"; sixteen sites had each answered it.
[guards.one-hex-spelling]
kind       = "forbid"
signatures = ["java.util.HexFormat", "java.lang.Character#forDigit(**)"]
owner      = "cc.jumpkick.host.Hashing"
instead    = "Hashing.hex(byte[]) — or sha256Hex, which digests too"
why        = "bytes become hex in one place; a second spelling is a second answer"

[[guards.one-hex-spelling.allow]]
in     = "cc.jumpkick.repo.s3.SigV4Signer"
reason = "uppercase percent-encoding of a URI, not a digest: Character.toUpperCase(Character.forDigit(..)) is a different function"

# G20. The host is read in one place (Os) and the path separator has two owners, one per
# vocabulary: Classpaths for -cp, SearchPath for PATH. They disagree about blank entries on purpose.
[guards.one-host-surface]
kind       = "forbid"
signatures = ["java.lang.System#getProperty(**)", "java.io.File#pathSeparator", "java.io.File#pathSeparatorChar"]
args       = ["os.name", "path.separator"]
owner      = ["cc.jumpkick.host.Os", "cc.jumpkick.host.Classpaths", "cc.jumpkick.host.SearchPath"]
instead    = "Os.isWindows() / isDarwin() / isLinux() / name(); Classpaths.join / split for -cp; SearchPath.prepend / entries for PATH"
why        = "a copy of the host predicate that tests contains(\"win\") calls Darwin a Windows box"

# G26. A plugin forks through the SDK's one fork owner; a hand-rolled fork is where the wrong JDK
# and the missing .exe get in.
[guards.plugin-fork-owner]
kind       = "forbid"
signatures = ["java.lang.ProcessBuilder#<init>(**)", "java.lang.Runtime#exec(**)"]
scope      = ["plugins/*", "shared/plugin-sdk"]
owner      = "cc.jumpkick.plugin.build.TaskExec"
instead    = "exec.tool(name | path), then run() / stream(sink) / start()"
why        = "a hand-rolled fork is where the wrong JDK and the missing .exe get in"

[[guards.plugin-fork-owner.allow]]
in     = "cc.jumpkick.plugin.image.AotCacheTrainer"
reason = "three container-runtime forks (docker/podman info, run, stop): the runtime is a PATH name the user may configure, and ToolRun absolutises its executable head"

# G40. Files.isExecutable is 33.4 µs on Windows against 0.52 on Linux — a security-descriptor read
# plus an AccessCheck — for a question Windows answers by extension.
[guards.runnable-owner]
kind       = "forbid"
signatures = ["java.nio.file.Files#isExecutable(**)"]
owner      = "cc.jumpkick.host.PathUtil"
instead    = "cc.jumpkick.host.PathUtil.isRunnable(path)"
why        = "an access check off Windows, an extension test on it: 64x cheaper where it matters"

[[guards.runnable-owner.allow]]
in     = "cc.jumpkick.task.ActionCache"
reason = "executableBit wants the POSIX bit itself and is already skipped on Windows"

[[guards.runnable-owner.allow]]
in     = "cc.jumpkick.engine.plugin.WorkerSession"
reason = "probes /usr/bin/setsid once at class load, behind Os.isWindows(); the text guard exempted the same line by that shape"

# G45. A blind walk discards the attributes it already read and re-resolves each path to ask again;
# a ratchet, because two hundred sites each need their own read (directories, depth, ordering).
[guards.blind-tree-walks]
kind       = "forbid"
signatures = [
  "java.nio.file.Files#walk(**)",
  "java.nio.file.Files#walkFileTree(**)",
  "java.nio.file.Files#newDirectoryStream(**)",
  "java.nio.file.Files#list(**)",
]
owner      = "cc.jumpkick.host.PathUtil"
baseline   = true
instead    = "cc.jumpkick.host.PathUtil.forEachRegularFile(root, (file, attrs) -> …)"
why        = "re-resolving each path to ask again is the dominant cost of walking a large tree"

# G46. Removing a JDK is minutes of download and may be pinned by an IDE, a shell or another
# project's lockfile: it happens only when the user asked for it, in an explicit jk jdk verb.
[guards.jdk-removal-confined]
kind       = "forbid"
signatures = ["cc.jumpkick.jdk.JdkGarbage"]
owner      = "cc.jumpkick.command.JdkUpdateCommand"
instead    = "provisioning installs; only `jk jdk update` queues a superseded install and drains it, after asking"
why        = "an ordinary build once deleted the JDK it was running on, twice in one afternoon"

# G12. A step name typed as a literal is a producer/consumer contract with no compiler behind it:
# a typo becomes a missing dependency edge, not a build error. Hyphenated names only — the
# single-word values (train, install, select) are ordinary English in paths and help text.
[guards.task-names]
kind    = "vocabulary"
owner   = "cc.jumpkick.run.TaskNames"
shape   = "hyphenated"
instead = "TaskNames.<CONSTANT>"
why     = "a step name typed by hand is an edge that quietly does not exist"

[[guards.task-names.allow]]
in     = "shared/host/src/main/java/cc/jumpkick/host/GraalLauncher.java"
reason = "GraalVM's native-image launcher file name is not a step name; it has its own owner and must not borrow the constant"

# G13. A file jk owns is named once. A third-party tool's own config.toml must not borrow the
# constant either: give that vocabulary its own owner.
[guards.manifest-names]
kind    = "vocabulary"
owner   = "cc.jumpkick.lock.ManifestPaths"
instead = "ManifestPaths.<CONSTANT>"
why     = "a file jk owns is named once, in ManifestPaths"

# G15. A cache tier is named once, in the CacheTree enum. A directory that is not a cache tier —
# a module's own build/generated, say — must not borrow the constant.
[guards.cache-tiers]
kind     = "vocabulary"
owner    = "cc.jumpkick.host.CacheTree"
homonyms = ["sha256", "generated", "projects"]
instead  = "CacheTree.<TIER>.under(cacheRoot)"
why      = "a cache tier is named once; the homonyms each have their own owner"

# G17. A wire message type typed as a literal is a producer/consumer contract with no compiler
# behind it: a typo becomes an event nobody handles. A dashboard-only SSE frame or a CLI transcript
# envelope keeps its own literal.
[guards.wire-types]
kind    = "vocabulary"
owner   = "cc.jumpkick.wire.protocol.EngineProtocol"
shape   = "hyphenated"
instead = "EngineProtocol.<CONSTANT>"
why     = "a wire type typed by hand is an event nobody handles"

# G18. jk's build output directory is named once, in BuildLayout.TARGET. A `target` that is not
# this directory — a CLI parameter, javac's -target, a BSP field — is an allow entry with its reason.
[guards.target-dir]
kind    = "vocabulary"
owner   = "cc.jumpkick.layout.BuildLayout"
shape   = "regex:target"
instead = "BuildLayout.TARGET, or BuildLayout.moduleTargetDir(ws, mod)"
why     = "the output directory is named once; renaming it must not miss a spelling"

[[guards.target-dir.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/command/ToolInstallCommand.java"
reason = "a CLI parameter named target (a coordinate, a file, a directory or a git URL)"

[[guards.target-dir.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/command/ToolRunCommand.java"
reason = "a CLI parameter named target (a coordinate, a file, a directory or a git URL)"

[[guards.target-dir.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/cli/bsp/BspServer.java"
reason = "the target field of a BSP request, in someone else's protocol"

[[guards.target-dir.allow]]
in     = "plugins/groovy-compiler/src/main/java/cc/jumpkick/groovy/compiler/GroovyCompiler.java"
reason = "groovyc's target option (a bytecode level)"

[[guards.target-dir.allow]]
in     = "server/toolchain/src/main/java/cc/jumpkick/mvn/PomImporter.java"
reason = "Maven's <target> compiler configuration key, in someone else's file"

[[guards.target-dir.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/config/TestEnvValues.java"
reason = "the ${target} interpolation variable name: it expands to the output directory, but the token is a variable name in jk.toml and renaming the directory must not rename it"

# G16. A repository name is spelled once, in RepositorySpec: `central` is the store directory, the
# lockfile source prefix and the repo-group entry at once, so a store written under one spelling and
# read under another is a cache that silently never hits.
[guards.repository-names]
kind    = "vocabulary"
owner   = "cc.jumpkick.model.RepositorySpec"
instead = "RepositorySpec.<CONSTANT>"
why     = "a repository name spelled twice is a store that silently never hits"

[[guards.repository-names.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/runtime/PlannerResources.java"
reason = "`jumpkick` here is a package path segment (Path.of(\"cc\", \"jumpkick\", …)), not a repository name"

[[guards.repository-names.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/runtime/TaskForecaster.java"
reason = "`jumpkick` here is a package path segment (Path.of(\"cc\", \"jumpkick\", …)), not a repository name"

[[guards.repository-names.allow]]
in     = "server/toolchain/src/main/java/cc/jumpkick/mvn/PomImporter.java"
reason = "recognises a foreign build file's declared repository: every spelling a user may have typed"

[[guards.repository-names.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/config/FormatStyles.java"
reason = "`google` here is a formatter style name (ktfmt / google-java-format), not a repository"

[[guards.repository-names.allow]]
in     = "plugins/formatter/src/main/java/cc/jumpkick/format/CodeFormatter.java"
reason = "`google` here is a formatter style name (ktfmt / google-java-format), not a repository"

# G70. Maven Central is addressed one way. repo1.maven.org is a CNAME for the canonical host, so it
# fetches the same bytes — and matches neither the mirror nor the per-host cooldown.
[guards.central-address]
kind     = "text"
files    = ["**/src/main/**/*.java"]
patterns = ["repo1\\.maven\\.org", "https://repo\\.maven\\.apache\\.org/maven2/?"]
owner    = "shared/jk-api/src/main/java/cc/jumpkick/model/RepositorySpec.java"
hit      = "URI.create(\"https://repo.maven.apache.org/maven2/\")"
miss     = "URI.create(\"https://repo.example.org/maven2/\")"
instead  = "RepositorySpec.MAVEN_CENTRAL.url(), through cc.jumpkick.http.Http"
why      = "the mirror and the cooldown key on the canonical host; an alias matches neither"

[[guards.central-address.allow]]
in     = "server/toolchain/src/main/java/cc/jumpkick/gradle/GradleImporter.java"
reason = "recognises a foreign build file's declared repository: every spelling a user may have typed"

[[guards.central-address.allow]]
in     = "server/toolchain/src/main/java/cc/jumpkick/mvn/PomImporter.java"
reason = "recognises a foreign build file's declared repository: every spelling a user may have typed"

[[guards.central-address.allow]]
in     = "shared/toolchain-jdk/src/main/java/cc/jumpkick/gradle/GradleExporter.java"
reason = "writes a foreign build file's repository block in that file's own vocabulary"

# G24. The AOT refusal marker is named once, in AotCacheFiles; tests included, because a fixture
# that spells the bare suffix follows a rename of the value and still passes.
[guards.aot-marker]
kind       = "vocabulary"
owner      = "cc.jumpkick.host.AotCacheFiles"
shape      = "regex:\\.noaot"
source-set = "all"
instead    = "AotCacheFiles.marker(cache) / isMarker(name) / cacheOf(name), or AotCacheFiles.MARKER"
why        = "the AOT refusal marker is one suffix, spelled once"

# G28. Retired wire-key spellings have no owner by definition — there is deliberately no constant
# left to read them from — so the ban list is written here and the live owners are named in `instead`.
[guards.retired-wire-keys]
kind     = "text"
files    = ["**/src/main/**/*.java", "clients/web/src/main/resources/web/**"]
blank    = "none"
patterns = ["(?<=[\"'.])tests?(?:Total|Succeeded|Failed|Skipped)(?![A-Za-z0-9_$])"]
hit      = "d.testsTotal"
miss     = "d.testsTotalLine"
instead  = "TestSummary.WIRE_KEY with countsJson/countsMap/readCounts — the nested tests:{total,succeeded,failed,skipped} object"
why      = "a retired spelling back in production source is a reader of a shape nobody writes"

# G71. `class` is banned as a field key in the SPA only: .class literals and the test-worker
# discovery protocol keep the token live in Java on purpose. The dashboard reads d.testClass.
[guards.spa-no-class-key]
kind     = "text"
files    = ["clients/web/src/main/resources/web/**"]
blank    = "none"
patterns = ["(?<=[\"'.])class(?![A-Za-z0-9_$])"]
hit      = "d.class"
miss     = "el.className"
instead  = "EngineProtocol.TEST_CLASS_FIELD (\"testClass\"): the SPA reads d.testClass"
why      = "the dashboard hand-types every key it reads, so a retired key there is silent"

# G5. Every ##JK<X>: marker is one end of a parent/child protocol: the plugin declares it and the
# engine reads it. Named once it is a dead protocol; named three times it is a lockstep waiting to
# break — and neither end fails loudly at runtime.
[guards.wire-prefix-pairs]
kind    = "text"
files   = ["**/src/main/java/**/*.java", "**/jk-plugin.toml"]
pattern = '"##JK[A-Z]+:"'
count   = { exactly = 2, per = "match" }
hit     = 'String prefix = "##JKFMT:";'
instead = "reference the declaring constant instead of re-typing the literal"
why     = "a protocol prefix has exactly two ends: one writes it, one reads it"

# G48. An inline Javadoc tag needs a space before its payload: {@code .asc}, not the glued form,
# which renders as literal garbage and can block FQCN shortening for the whole file.
[guards.no-glued-inline-tag]
kind    = "text"
files   = ["**/src/**/*.java"]
blank   = "code"
pattern = '\{@(?:code|value|linkplain|link)[^\s}a-zA-Z]'
hit     = "/** see {@code.asc} */"
miss    = "/** see {@code .asc} */"
instead = "a space before the payload: {@code .asc}"
why     = "a glued inline tag renders as garbage and blocks the shortener for the whole file"

# G49. jk lives under $HOME/.jk, on every platform. Deliberately not comment-blind: a path spelled
# in a comment, a doc or an installer misleads the same reader.
[guards.single-home-root]
kind     = "text"
blank    = "none"
files    = [
  "**/*.java", "**/*.kt", "**/*.kts", "**/*.md", "**/*.sh", "**/*.ps1", "**/*.bat",
  "**/*.html", "**/*.js", "**/*.mjs", "**/*.css",
]
patterns = [
  '\.local/share', '\.local/state', '\.local/bin', '\.cache/jk', '\.config/jk',
  'XDG_[A-Z_]+', 'LOCALAPPDATA', 'APPDATA', '<data>',
  '(?i)\bdata root\b', '(?i)\bdata/lib\b',
  '\$\{?JK_HOME\}?[/\\]data\b', '--data(?:-dir)?\b',
  '(?:homeDir\(\)|JkDirs\.home\(\))\.resolve\("data"\)',
  'JK_DATA_DIR|JK_BUILDS_DIR|JK_TMP_DIR|JK_BIN_DIR|JK_INSTALL_DIR',
  'JK_CONFIG_DIR|JK_CONFIG_FILE',
]
hit      = "the data root"
miss     = "the store root"
instead  = "resolve paths through cc.jumpkick.util.JkDirs (JK_HOME, plus JK_STORE_DIR / JK_CACHE_DIR / JK_STATE_DIR / JK_JDKS_DIR)"
why      = "jk has one home; a layout it does not have, named anywhere, misleads the reader"

[[guards.single-home-root.allow]]
in     = "build.gradle.kts"
reason = "the Gradle twin of this rule spells the banned shapes"

[[guards.single-home-root.allow]]
in     = "shared/core/src/main/java/cc/jumpkick/config/TerminalFonts.java"
reason = "reads another program's XDG_CONFIG_HOME to find the terminal's font"

[[guards.single-home-root.allow]]
in     = "shared/toolchain-jdk/src/main/java/cc/jumpkick/discovery/MiseProbe.java"
reason = "reads mise's own layout (MISE_DATA_DIR, XDG_DATA_HOME, .local/share/mise) to discover JDKs"

[[guards.single-home-root.allow]]
in     = "shared/toolchain-jdk/src/test/java/cc/jumpkick/discovery/MiseProbeTest.java"
reason = "fixtures for mise's own layout"

[[guards.single-home-root.allow]]
in     = "shared/toolchain-jdk/src/main/java/cc/jumpkick/jdk/IntellijJdkTable.java"
reason = "reads IntelliJ's own config location (APPDATA, XDG_CONFIG_HOME)"

[[guards.single-home-root.allow]]
in     = "shared/toolchain-jdk/src/test/java/cc/jumpkick/jdk/IntellijJdkTableTest.java"
reason = "fixtures for IntelliJ's own config location"

[[guards.single-home-root.allow]]
in     = "shared/core/src/test/java/cc/jumpkick/util/JkDirsTest.java"
reason = "asserts that the retired XDG / AppData variables are ignored"

[[guards.single-home-root.allow]]
in     = "clients/cli/src/main/java/cc/jumpkick/cli/engine/RetiredEngineLayouts.java"
reason = "names the retired layouts in order to migrate away from them"

[[guards.single-home-root.allow]]
in     = "clients/cli/src/test/java/cc/jumpkick/cli/engine/EngineFleetTest.java"
reason = "fixture for a retired LOCALAPPDATA layout"

[[guards.single-home-root.allow]]
in     = "clients/cli/src/test/java/cc/jumpkick/command/WrapperTemplateTest.java"
reason = "asserts the wrapper template does not contain the retired variables"

# G50. A ticket id names a tracker this repository's readers do not have. Extension-blind on
# purpose: every scope this rule was given by extension is where it was missed next.
[guards.no-ticket-ids]
kind    = "text"
files   = ["**"]
blank   = "none"
pattern = '\bJK-\d{4}\b'
hit     = "see JK-1234"
instead = "state the invariant or the defect; history belongs in the commit message, not the tree"
why     = "a ticket id names a tracker the reader does not have; a Giter8 template writes it into a user's project"

[[guards.no-ticket-ids.allow]]
in     = "AGENTS.md"
reason = "documents the board protocol an agent follows, ids included"

[[guards.no-ticket-ids.allow]]
in     = "docs/contributors/comments.md"
reason = "states the ban, using ids as its own examples"

[[guards.no-ticket-ids.allow]]
in     = "jk-guards.toml"
reason = "this rule's own hit fixture"

# G59. A comment that narrates history describes a tree that no longer exists. State the current
# invariant; history belongs in the commit body. Comments and prose only: a string literal that
# says "formerly" is data.
[guards.no-historical-narration]
kind     = "text"
files    = ["**/*.java", "**/*.kt", "**/*.kts", "**/*.md", ".github/**/*.yml"]
blank    = "code"
patterns = [
  '(?i)(?:this|it|they|javadoc) used to\b',
  '(?i)\bused to (?:be|say|live|scan)\b',
  '(?i)\bformerly\b',
  '(?i)\bback-compat',
  '(?i)\bfor future agents\b',
  '(?i)\bkept for migration\b',
  '(?i)\bdo not revert\b',
  '(?i)\bas (?:they|it) used to\b',
]
hit      = "// this used to be a list"
miss     = "// used to detect a stale entry"
instead  = "state the current invariant"
why      = "historical narration describes a tree that no longer exists"

[[guards.no-historical-narration.allow]]
in     = "AGENTS.md"
reason = "names the banned narration phrases as the policy"

[[guards.no-historical-narration.allow]]
in     = "docs/contributors/comments.md"
reason = "names the banned narration phrases as the policy"

# G60. A JSON object spliced by hand — chop the closing brace, append fields, re-close — got the
# separator wrong on an empty object every time it was written. Jsonl.append owns it.
[guards.one-json-splicer]
kind     = "text"
files    = ["**/src/main/java/**/*.java"]
patterns = [
  '\.substring\(0,\s*\w+\.length\(\)\s*-\s*1\)[^;]*"\}"',
  '"\{(?:\\"|[^"])*"[^;]*\.substring\(1\)',
]
owner    = "shared/host/src/main/java/cc/jumpkick/jsonl/Jsonl.java"
hit      = 'sb.substring(0, sb.length() - 1) + ",\"k\":1" + "}"'
miss     = 'Jsonl.append(object, fields)'
instead  = "Jsonl.append(object, fields): it validates the object and owns the separator"
why      = "every hand chop got the separator wrong on an empty object"

# G61. `[m2] install` is on by default, so a test that runs the install verb without --m2-dir
# publishes into the developer's real ~/.m2 — outside the checkout, where no assertion looks.
[guards.install-tests-redirect-m2]
kind    = "text"
files   = ["**/src/test/java/**/*.java"]
pattern = '\b(?:execute|run)\s*\(\s*(?:new\s+String\s*\[\s*]\s*\{\s*)?(?:"tool"\s*,\s*)?"install"\s*[,)}](?:(?!--m2-dir)[^;])*;'
hit     = 'Jk.execute("install", dir.toString());'
miss    = 'Jk.execute("install", "--m2-dir", m2.toString(), dir.toString());'
instead = "pass --m2-dir into the test's own temp dir"
why     = "an install test without --m2-dir publishes into the developer's real ~/.m2"

# G65. A tree walk in build logic that follows symbolic links can reach the JDK install behind a
# stable pointer in a test home and delete it. Trees.deleteNoFollow / exceedsNoFollow never enter a
# link.
[guards.no-link-following-delete]
kind     = "text"
files    = ["**/*.gradle.kts", "buildSrc/src/**/*.kt", ".jk/**/*.kts"]
blank    = "comments+strings"
patterns = [
  '\.deleteRecursively\(', '\.walkTopDown\(', '\.walkBottomUp\(',
  '(?<!Files)\.walk\(\)', '(?<!NO)FOLLOW_LINKS',
]
hit      = "dir.toFile().deleteRecursively()"
miss     = "Trees.deleteNoFollow(dir)"
instead  = "Trees.deleteNoFollow or Trees.exceedsNoFollow: a link is one entry there, never a directory to enter"
why      = "a walk that follows links can delete the install behind a stable JDK pointer"

# G10. Unenforced caps regrow: a class finished its peel at 1,064 lines and was back over 1,200
# eleven days later. Code lines, per language; a listed file may only shrink.
[guards.file-size]
kind     = "metric"
measure  = "lines"
files    = [
  "*/*/src/main/java/**/*.java", "*/*/src/main/kotlin/**/*.kt",
  "*/*/src/main/resources/**/*.js", "*/*/src/main/resources/**/*.mjs",
  "*/*/src/test/java/**/*.java", "*/*/src/test/kotlin/**/*.kt", "*/*/src/fixtures/java/**/*.java",
  "*/*/src/test/js/**/*.js", "*/*/src/test/js/**/*.mjs",
]
cap      = { java = 800, kt = 800, js = 1200, mjs = 1200 }
baseline = true
why      = "a file that no longer fits a context window no longer fits a reviewer"

# G11. A fully-qualified class name in a method body is banned — import the type. A genuine
# collision keeps its FQCN as a baseline entry that names what it collides with.
[guards.no-fqcn]
kind     = "metric"
measure  = "fqcn"
files    = ["*/*/src/main/java/**/*.java", "*/*/src/test/java/**/*.java"]
cap      = 0
baseline = true
why      = "a package-qualified reference in a body is a name the formatter could not shorten, or a collision that must say so"

# G66. One module owns each production package. A split package is latent rather than active harm:
# package-private reach works across a jar boundary on a flat classpath and stops working under JPMS,
# which is why nine of the rows below grew to 30, 25, 27 and 20 files without anything breaking. Each
# allow states why its split is legal; a row that is no longer split is stale and fails the rule.
[guards.one-module-per-package]
kind = "split-package"
why  = "package-private reach across a jar boundary stops working under JPMS; a split package is breakage that grows quietly"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.compat"
reason = "The tool-import model the client renders (BuildTool, ImportReport, InstalledTool, ToolRegistry) is client-safe; the installer and provisioner that fetch and unpack a distribution must run engine-side. (server/toolchain,shared/toolchain-jdk)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.compile"
reason = "Classpath composition (ClasspathResolver, ModuleRuntimeClasspath) is what the thin client needs to launch and to answer `jk tree`; the compilers, packagers and SBOM writer are engine-only and would drag the whole compile stack onto the client. (server/engine,shared/client-io)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.config"
reason = "EnvValues kept its original package when it moved down into the host leaf, which cost zero import churn across ~50 call sites — a move that touches nothing cannot break anything, and it left no delegating shim. Stated in code-as-art.md under \"Primitives live in the host leaf\". (shared/core,shared/host)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.gradle"
reason = "GradleExporter writes files from the client; the importer, resolver and version-catalog reader shell out to Gradle and belong to the engine. (server/toolchain,shared/toolchain-jdk)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.jdk"
reason = "JdkFingerprint kept its original package when it moved down into the host leaf, for the same zero-churn reason as EnvValues above, and is named alongside it in code-as-art.md. (shared/host,shared/toolchain-jdk)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.mvn"
reason = "PomExporter writes a pom from the client; MavenResolver and PomImporter shell out to Maven and belong to the engine. (server/toolchain,shared/toolchain-jdk)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.repo"
reason = "The client's half is the read/link/transport slice a thin client must have (locator, transports, CAS read, m2 layout); the engine's half is POM and Gradle-module-metadata parsing, which the native client must never link. (server/io,shared/client-io)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.resolve"
reason = "ResolveProfile and its package-info are the reporting surface both sides read; ResolveProcessCacheControl clears the solver's process memos and only the engine has them. (server/resolver,shared/core)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.resolver"
reason = "The dependency and lock model the client reads to render `jk tree` / `jk why` is client-safe; the PubGrub solve, orchestrator and artifact materializer are engine-only. (server/resolver,shared/core)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.task"
reason = "Cache-tier policy the client reads and reports (prune scheduler, IO ledger, run notices) is client-safe; the action cache, its keys and its retention are the engine's. (server/engine,shared/core)"

[[guards.one-module-per-package.allow]]
in     = "cc.jumpkick.tool"
reason = "Launcher and tool-env model is resolved client-side so `jk run` can exec without the engine; ToolResolver provisions a tool and belongs to the engine. (server/toolchain,shared/toolchain-jdk)"

# G67. A module's package-cycle count may not grow. Slices are the module's own packages; the edges
# are type references, so static imports and qualified names count where the import regex dropped
# them. The band is a metric baseline: over it is a regression, under it tightens itself. The report
# names a component's packages, never its cycles — a 15-node component has thousands of elementary
# cycles and none of them says which edge to cut.
[guards.package-cycles]
kind     = "cycles"
matching = "cc.jumpkick.(**)"
baseline = true
why      = "a cyclic component has no edge anyone can name to cut, so the count is what the build defends"

# G53. Every production package in a null-marked root carries package-level @NullMarked: NullAway
# enforces nullness only where the package says so, and a package that forgets the marker is a
# package where every finding is silently off. The seven modules are NullMarking.enforcedRoots;
# a package left unmarked on purpose is an allow entry with its reason, and a stale one is red.
[guards.null-marked-packages]
kind    = "annotate"
require = "org.jspecify.annotations.NullMarked"
on      = "package"
scope   = ["shared/jk-api", "shared/wire", "shared/plugin-sdk", "shared/core", "clients/cli", "shared/guard-api", "server/guard"]
instead = "a package-info.java in the package carrying @NullMarked"
why     = "NullAway checks a package only where it says @NullMarked; an unmarked package is one where every nullness finding is off"

# G54. First-party plugins compile against the SDK and the host primitives, nothing else: a
# plugin that reaches into server/ or an unclassified shared module runs engine code inside a
# worker, and the boundary that lets plugins be published on their own is gone. Every current
# exception is an edge allow with the product invariant that owns it (docs/contributors/plugins.md,
# "Dependency boundary"); a plugin-to-plugin edge (grails composes spring-boot) is a same-layer edge.
[guards.plugin-sdk-boundary]
kind   = "layers"
scope  = ["plugins/*"]
layers = { plugins = "plugins/*", sdk = ["shared/plugin-sdk", "shared/host"] }
access = { plugins = ["sdk"] }
closed = true
why    = "a plugin that depends past the SDK runs engine code inside a worker and cannot be published on its own"

[[guards.plugin-sdk-boundary.allow]]
in     = "plugins/auditor -> shared/core"
reason = "the auditor reads the canonical lockfile and emits the shared audit report"

[[guards.plugin-sdk-boundary.allow]]
in     = "plugins/publisher -> shared/core"
reason = "publishing reads the canonical manifest, lockfile, and build layout"

[[guards.plugin-sdk-boundary.allow]]
in     = "plugins/publisher -> shared/client-io"
reason = "repository uploads use the client-safe HTTP/file/object-store transports, which live there so the worker does not depend on server I/O"

[[guards.plugin-sdk-boundary.allow]]
in     = "plugins/image-builder -> shared/jk-api"
reason = "image configuration and repository credentials are public model types"

[[guards.plugin-sdk-boundary.allow]]
in     = "plugins/minified -> shared/dynamic-surface"
reason = "R8 keep rules and native reachability share one model"

# G34. A testFixtures variant wired into a production configuration puts test code — and the
# JUnit it compiles against — on a worker's flattened POM and inside the native image, where
# nothing else notices until GraalVM fails to see a reflective JUnit lookup at runtime. This is
# the wiring arm over the Gradle scripts; the classpath arm is G73/G74 below.
[guards.test-fixtures-stay-out-of-production]
kind    = "text"
files   = ["build.gradle.kts", "**/build.gradle.kts", "buildSrc/src/main/kotlin/*.gradle.kts"]
pattern = "^\\s*(api|implementation|compileOnly|compileOnlyApi|runtimeOnly|annotationProcessor)\\s*\\(\\s*testFixtures\\s*\\("
hit     = "    implementation(testFixtures(project(\":host\")))"
miss    = "    testImplementation(testFixtures(project(\":host\")))"
instead = "testImplementation / testCompileOnly / testRuntimeOnly"
why     = "a testFixtures variant on a production configuration ships test code in a worker POM and the native image"

# G73. The native client's runtime is the native image: a test framework, an analysis library or a
# resolver-side Maven helper on its classpath is a mis-scoped dependency the image would carry and
# GraalVM would fail to see through, caught here rather than merely absent.
[guards.cli-runtime-classpath]
kind    = "depend"
scope   = ["clients/cli"]
scopes  = ["dependencies", "runtime-dependencies", "provided-dependencies"]
ban     = ["org.junit.jupiter:*", "org.junit.platform:*", "org.assertj:*", "org.opentest4j:*", "org.apiguardian:*", "com.tngtech.archunit:*", "org.apache.maven:maven-artifact", "org.codehaus.plexus:plexus-utils", "org.jline:*"]
instead = "test-dependencies; Maven helpers stay engine-side"
why     = "the CLI runtime is the native image; a test or build-time library there is a mis-scoped dependency"

# G74. The CLI links the client-side modules only: plugin-sdk, the guard engine and the resolver
# are engine-side, and a workspace edge to one of them puts engine code in the native image.
[guards.cli-runtime-modules]
kind   = "layers"
scope  = ["clients/cli"]
layers = { cli = "clients/cli", client = ["shared/jk-api", "shared/core", "shared/client-io", "shared/toolchain-jdk", "shared/wire", "shared/host", "clients/cli-terminal"] }
access = { cli = ["client"] }
closed = true
why    = "a CLI edge to an engine-side module puts engine code in the native image"

[[guards.cli-runtime-modules.allow]]
in     = "clients/cli -> plugins/*"
reason = "the CLI embeds the bundled worker plugins' jar digests: build-order inputs, never classes on its classpath"

# G44. Both builds see the same modules: a module only one build knows about is outside half the
# self-host gate (`plugins/micronaut` sat in settings.gradle.kts and in no jk.toml for a release).
[guards.both-builds-see-modules]
kind  = "parity"
left  = { workspace-modules = "jk.toml" }
right = { gradle-includes = "settings.gradle.kts" }
why   = "a module one build cannot see is built half the time"

# G56. The wrapper task and gradle-wrapper.properties pin the same Gradle; the Node pin stays in the
# gate script, where the workflow's setup-node arms live.
[guards.wrapper-version-parity]
kind  = "parity"
left  = { regex = { file = "gradle/wrapper/gradle-wrapper.properties", pattern = 'gradle-(\d+\.\d+(?:\.\d+)?)' } }
right = { regex = { file = "build.gradle.kts", pattern = 'gradleVersion\s*=\s*"([^"]+)"' } }
why   = "a wrapper task that pins one Gradle while the properties download another builds with the wrong one"

# G62. The ship layout is one directory name, spelled by the installer and by both dist writers; a
# rename in one is silent in the others and pairs a fresh client with the released engine.
[guards.ship-layout-installer-gradle]
kind  = "parity"
left  = { regex = { file = "install.sh", pattern = 'SRC_LIB=.*pwd\)/([A-Za-z0-9_-]+)"' } }
right = { regex = { file = "build.gradle.kts", pattern = 'shadowJar"\)\) \{ into\("([A-Za-z0-9_-]+)"\)' } }
why   = "install.sh reads <dir-of-binary>/<name>/; a dist that writes another name is one the installer walks past"

[guards.ship-layout-installer-jk]
kind  = "parity"
left  = { regex = { file = "install.sh", pattern = 'SRC_LIB=.*pwd\)/([A-Za-z0-9_-]+)"' } }
right = { regex = { file = ".jk/after-build-dist.kts", pattern = 'dist\.resolve\("([A-Za-z0-9_-]+)"\)' } }
why   = "install.sh reads <dir-of-binary>/<name>/; a dist that writes another name is one the installer walks past"

# The rules of this file, listed where contributors read about the house rules; the block is
# rendered, never edited.
[guards.guard-registry-doc]
kind     = "generated"
source   = { guard-ids = true }
template = { table = ["id", "kind", "why"] }
into     = "docs/contributors/code-as-art.md"
markers  = "guard-rules"
why      = "the registry drifted twice by hand; the third reconciliation is not by hand"

# G19. Every sidecar POM jk packages names a coordinate this build publishes: no `unspecified`, no
# fallback group, and no dependency on a cc.jumpkick artifact the workspace does not package.
[guards.published-poms]
kind = "output"
pom  = { no-unspecified = true, groups = ["cc.jumpkick", "cc.jumpkick.guards"] }
why  = "a POM with an unspecified coordinate is an artifact nobody can depend on"

# G80. Commits read as ordinary human contributions: a tool's co-author or generator trailer is
# noise in blame. The commit-msg hook (`jk guard hooks install`) refuses one at commit time; CI's
# history scan is the other half.
[guards.no-agent-trailers]
kind            = "commit"
forbid-trailers = ["Co-Authored-By: *noreply@*", "Generated-By: *", "Assisted-By: *"]
instead         = "author the commit as a human contributor; drop the trailer"
why             = "attribution trailers are noise in blame"

# G81/G82. The installers served to `curl | bash` users are the repo-root copies, line for line; a
# copy that drifts installs jk somewhere the CLI does not look. Regenerate with `cp install.sh
# hosting/public/install.sh` (same for install.ps1), never by editing the copy under hosting/.
[guards.published-installer-sh]
kind  = "parity"
left  = { regex = { file = "install.sh", pattern = '(?m)^(.*)$' } }
right = { regex = { file = "hosting/public/install.sh", pattern = '(?m)^(.*)$' } }
why   = "a published installer that drifts from the repo copy installs jk where the CLI does not look"

[guards.published-installer-ps1]
kind  = "parity"
left  = { regex = { file = "install.ps1", pattern = '(?m)^(.*)$' } }
right = { regex = { file = "hosting/public/install.ps1", pattern = '(?m)^(.*)$' } }
why   = "a published installer that drifts from the repo copy installs jk where the CLI does not look"
