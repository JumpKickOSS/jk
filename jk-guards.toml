in     = "server/engine/src/main/java/cc/jumpkick/engine/http/HttpEngineServer.java"
reason = "one thread per HTTP exchange; each handler binds the request's session itself"

[[guards.request-thread-carries-session.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/engine/jobs/JobEnvelope.java"
reason = "the job body binds its own session inside the verb; the detached join reads none"

[[guards.request-thread-carries-session.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/engine/jobs/JobWatchdog.java"
reason = "holds the job's cancel token explicitly"

[[guards.request-thread-carries-session.allow]]
in     = "server/engine/src/main/java/cc/jumpkick/engine/jobs/LiveJobRegistry.java"
