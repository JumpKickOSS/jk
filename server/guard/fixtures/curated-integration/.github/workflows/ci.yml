name: ci
on: [pull_request, merge_group]
jobs:
  self-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: jk test --no-ansi
      - name: Curated integration lane
        timeout-minutes: 8
        run: scripts/curated-integration.sh

  integration:
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - run: jk test -s integration --no-ansi
