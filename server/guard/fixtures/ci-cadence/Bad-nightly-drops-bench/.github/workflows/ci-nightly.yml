name: CI (nightly)

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: jk test --profile integration --continue --no-ansi

  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: jk test --profile slow --continue --no-ansi

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: jk test --profile network --continue --no-ansi

  # Coverage is measured nightly, never in the branch gate: the ratchet reads what the agent wrote.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: jk test --coverage --no-ansi
      - run: jk guard --no-ansi

  os-smoke:
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-product-smoke.sh
