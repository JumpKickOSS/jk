name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # JumpKick building JumpKick: the merge authority.
  self-host:
    name: Self-host (jk builds jk)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@v4

      # No step here runs Gradle: the ci-cadence guard fails the build on a `gradlew` in this job.
      # The version is read from the pin, never spelled here, so a release bumps one file.
      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="1.3.2" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: Self-host build
        run: jk build --skip-tests --no-ansi

      - name: The checkout's own jk takes over
        run: jk install --skip-tests --no-ansi

      - name: House-rule gate (every lane)
        run: jk guard --no-ansi

      - name: Self-host fast test tier
        run: jk test --no-ansi

  # Gradle, run for parity and nothing else: advisory by design, the one job allowed continue-on-error.
  gradle-parity:
    name: Gradle parity (advisory, not a merge requirement)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests, buildSrc tests and the Gradle-only guard
        run: ./gradlew checkFast --no-daemon

  curated-integration:
    name: Curated integration lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Curated integration tests
        run: ./gradlew curatedIntegrationTest --no-daemon
