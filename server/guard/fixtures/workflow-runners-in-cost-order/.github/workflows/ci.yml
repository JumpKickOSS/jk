# The tree every case starts from: Linux, then Windows, then macOS.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo build

  arm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo arm

  windows:
    needs: [build, arm]
    runs-on: windows-2022
    steps:
      - run: echo windows

  macos:
    needs:
      - windows
    runs-on: macos-latest
    steps:
      - run: echo macos
