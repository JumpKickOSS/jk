group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
scala = "3.10.0"

[application]
main = "$package$.Main"
$if(assembly.truthy)$
assembly = true

$else$

$endif$
$if(native.truthy)$
# `jk native`: a GraalVM native executable. No [image]: the binary runs on its own, and a container
# image would wrap it in a runtime it does not need.
[native]

$else$
# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

$endif$
[dependencies]
$if(deps_guava.truthy)$
guava = "33.8.0-jre"
$endif$
$if(deps_commons_lang.truthy)$
commons-lang3 = "3.21.0"
$endif$
$if(deps_commons_io.truthy)$
commons-io = "2.22.0"
$endif$
# `jk add <library>` adds another at its newest stable release.

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test -p integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
