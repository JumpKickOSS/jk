name = "jk-engine"
description = "Resident build engine: plan, cache, compile, and test"

[application]
main = "cc.jumpkick.engine.EngineMain"
assembly = true

[dependencies]
jk-engine-api.workspace = true
jk-core.workspace = true
jk-io.workspace = true
jk-plugin-sdk.workspace = true
jk-resolver.workspace = true
jk-toolchain.workspace = true
jk-dynamic-surface.workspace = true
jk-web.workspace = true
asm = "latest"
asm-tree = "latest"
asm-commons = "latest"
jgit = "latest"
xz = "latest"

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

[build]
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "auditor",
  "publisher",
  "image-builder",
  "compat-bridge",
  "formatter",
  "spring-boot",
  "android",
  "protobuf",
  "minified",
  "grails",
  "groovy-compiler",
  "quarkus",
]

[test]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run the excluded tags too with `jk test --exclude-tags ""` (--all only widens suites).
exclude-tags = ["integration", "slow", "bench", "network"]
