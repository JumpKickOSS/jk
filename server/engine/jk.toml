[project]
group       = "cc.jumpkick"
name        = "jk-engine"
version     = "0.10.1"
description = "jk build engine: BuildPipelines, plugin dispatch, action cache, compile/test machinery."
jdk         = 25
java        = 25

[application]
main     = "cc.jumpkick.engine.EngineMain"
# Fat ship jar (replaces Gradle shadowJar for self-host): runtime deps + web SPA assets.
assembly = true

[dependencies]
jk-engine-api = { group = "cc.jumpkick", name = "jk-engine-api", version = "0.10.1" }
jk-core       = { group = "cc.jumpkick", name = "jk-core",       version = "0.10.1" }
jk-io         = { group = "cc.jumpkick", name = "jk-io",         version = "0.10.1" }
jk-plugin-api = { group = "cc.jumpkick", name = "jk-plugin-api", version = "0.10.1" }
jk-resolver   = { group = "cc.jumpkick", name = "jk-resolver",   version = "0.10.1" }
jk-toolchain  = { group = "cc.jumpkick", name = "jk-toolchain",  version = "0.10.1" }
# Dashboard static assets (classpath /web/*) — Gradle used runtimeOnly(project(":web")).
jk-web        = { group = "cc.jumpkick", name = "jk-web",        version = "0.10.1" }
asm           = { group = "org.ow2.asm", name = "asm",            version = "9.10.1" }
asm-tree      = { group = "org.ow2.asm", name = "asm-tree",       version = "9.10.1" }
asm-commons   = { group = "org.ow2.asm", name = "asm-commons",    version = "9.10.1" }
jgit          = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version = "7.6.0.202603022253-r" }

[test-dependencies]
assertj-core            = { group = "org.assertj",        name = "assertj-core",            version = "3.27.7" }
junit-jupiter           = { group = "org.junit.jupiter",  name = "junit-jupiter",           version = "6.1.0" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.0" }

# Self-host: engine tests fork workers via -Djk.<worker>.plugin.jar from sibling assemblies
# (or install-local / CAS). Prefer short names that match plugins/<name> modules.
[build]
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "auditor",
  "publisher",
  "image-builder",
  "compat-bridge",
  "formatter",
  "spring-boot",
  "android",
  "protobuf",
  "shrink",
]
