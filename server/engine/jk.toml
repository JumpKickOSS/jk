name = "jk-engine"
description = "Resident build engine: plan, cache, compile, and test"

[application]
main = "cc.jumpkick.engine.EngineMain"
assembly = true

[dependencies]
jk-engine-api.workspace = true
jk-core.workspace = true
jk-io.workspace = true
jk-plugin-sdk.workspace = true
jk-resolver.workspace = true
jk-toolchain.workspace = true
jk-dynamic-surface.workspace = true
jk-web.workspace = true
asm = "latest"
asm-tree = "latest"
asm-commons = "latest"
jgit = "latest"
xz = "latest"

[provided-dependencies]
lombok = "latest"

[processor-dependencies]
lombok = "latest"

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

[build]
# Only the workers engine tests actually fork or verify against. Each entry is a hard
# build-order edge (the whole plugin plan runs before engine) AND a content hash in the
# run-tests stamp — a spurious entry makes an unrelated plugin edit re-run this entire
# suite. publisher/image-builder/compat-bridge/formatter/quarkus were dropped after an
# import-level audit found zero jar consumers (JK-2190); PluginJar's CAS fallback still
# covers any incidental locate().
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "auditor",
  "spring-boot",
  "android",
  "protobuf",
  "minified",
  "grails",
  "groovy-compiler",
]

[test]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run everything (all suites, tags included) with `jk build --all` / `jk test --all`.
exclude-tags = ["integration", "slow", "bench", "network"]
