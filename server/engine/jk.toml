[project]
name        = "jk-engine"
description = "jk build engine: BuildPipelines, plugin dispatch, action cache, compile/test machinery."

[application]
main     = "cc.jumpkick.engine.EngineMain"
# Fat ship jar (replaces Gradle shadowJar for self-host): runtime deps + web SPA assets.
assembly = true

[dependencies]
jk-engine-api.workspace = true
jk-core.workspace = true
jk-io.workspace = true
jk-plugin-sdk.workspace = true
jk-resolver.workspace = true
jk-toolchain.workspace = true
# Dashboard static assets (classpath /web/*) — Gradle used runtimeOnly(project(":web")).
jk-web.workspace = true
asm                     = "9.10.1"
asm-tree                = "9.10.1"
asm-commons             = "9.10.1"
jgit                    = "7.6.0.202603022253-r"

[test-dependencies]
assertj-core            = "3.27.7"
junit-jupiter           = "6.1.0"
junit-platform-launcher = "6.1.0"

# Self-host: engine tests fork workers via -Djk.<worker>.plugin.jar from sibling assemblies
# (or install-local / CAS). Prefer short names that match plugins/<name> modules.
[build]
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "auditor",
  "publisher",
  "image-builder",
  "compat-bridge",
  "formatter",
  "spring-boot",
  "android",
  "protobuf",
  "shrink",
  # Gradle gives grails and groovy their own e2e test tasks, each setting -Djk.<x>.plugin.jar;
  # omitting them here is why GrailsBuildE2eTest / GroovyBuildE2eTest could not find a worker jar
  # under self-host. Those two suites run only under jk (Gradle tags them out of :engine:test), so
  # nothing else catches the gap.
  "grails",
  "groovy-compiler",
  "quarkus",
]

# Parity with Gradle's `test` task, which is explicitly scoped to unit/fast (<5 min) and excludes
# these tags — the integration/slow/bench suites are long-running, network- and SDK-dependent, and
# Gradle gives them separate tasks. Self-host ran them unconditionally, so `jk build` was enforcing a
# stricter contract than CI ever has. Override per-run with `--exclude-tag` / `--include-tag`.
[test]
default-exclude-tags = ["integration", "slow", "bench"]
