name = "jk-engine"
description = "Resident build engine: plan, cache, compile, and test"

[application]
main = "cc.jumpkick.engine.EngineMain"
assembly = true

[dependencies]
jk-engine-api.workspace = true
jk-core.workspace = true
jk-io.workspace = true
jk-plugin-sdk.workspace = true
jk-resolver.workspace = true
jk-toolchain.workspace = true
jk-guard.workspace = true
jk-guards-junit.workspace = true
jk-dynamic-surface.workspace = true
jk-ide.workspace = true
jk-web.workspace = true
asm = "9.10.1"
asm-tree = "9.10.1"
asm-commons = "9.10.1"
jgit = "7.7.1.202607240634-r"
ST4 = { group = "org.antlr", name = "ST4", version = "4.3.4" }
xz = "1.12"

[provided-dependencies]
lombok = "1.18.48"

[processor-dependencies]
lombok = "1.18.48"
error_prone_core = { group = "com.google.errorprone", version = "2.50.0" }
nullaway = { group = "com.uber.nullaway", version = "0.14.1" }

# Nullness is enforced here: every production package is @NullMarked (JSpecify) and NullAway
# checks it at error severity, with the same flags in every enforced module so the block is one
# block. The pins are exact; `jk update` moves them and the lock follows.
[javac]
args = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW", "-Xmaxerrs", "10000"]

[javac.plugins.ErrorProne]
options = [
  "-XepDisableAllChecks",
  "-Xep:RequireExplicitNullMarking:ERROR",
  "-Xep:NullAway:ERROR",
  "-XepOpt:NullAway:OnlyNullMarked=true",
  "-XepOpt:NullAway:JSpecifyMode=true",
  # A CLI command's fields are its parsed invocation: run(Invocation) assigns them and nothing
  # reads them before it. Identical across the enforced modules so the block is one block.
  "-XepOpt:NullAway:KnownInitializers=cc.jumpkick.model.command.CliCommand.run",
]

# Installing the engine is not publishing a coordinate. Its real output is a jar materialized into
# jk's own product library, with jk-engine.toml stamped to name it by sha and a downgrade refused —
# the one place jk installs jk. Declared so both the CLI (which owns that destination) and the
# freshness check agree; before this the only record of the fact was a path-pattern match, and a
# missing engine install read as "already done".
[install]
product-lib = "jk-engine"

[test-dependencies]
jk-host = { workspace = true, fixtures = true }
assertj-core = "3.27.7"
junit-jupiter = "6.1.3"

[build]
# Each entry is a hard build-order edge AND a content hash in the run-tests stamp —
# an unused name makes an unrelated plugin edit re-run this entire suite. Keep this
# list to workers the engine test JVM actually locates (forks, or BuiltInPluginJars).
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "auditor",
  "spring-boot",
  "cc.jumpkick:jk-android",
  "protobuf",
  "generator",
  "openapi",
  "minified",
  "grails",
  "groovy-compiler",
  "cc.jumpkick:jk-quarkus",
  "micronaut",
  # Rule packs the shipped templates declare: staged into the test sandbox store, where a
  # scaffolded project's lock looks for a first-party pack.
  "cc.jumpkick.guards:spring",
  "cc.jumpkick.guards:quarkus",
  "cc.jumpkick.guards:android",
  "cc.jumpkick.guards:library",
  "cc.jumpkick.guards:monorepo",
]

[test]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run everything (all suites, tags included) with `jk build --all` / `jk test --all`.
exclude-tags = ["integration", "slow", "bench", "network"]
env = [
  # In-process engines under test share this module's sandbox JK_HOME store, and the resident
  # engine queues a cache GC on startup when idle — which races any fixture staging prune-eligible
  # files for its own explicit prune request, and eats them first. Explicit `jk cache prune`
  # requests are unaffected by this switch.
  { JK_AUTO_PRUNE = "false" },
  # The JDK probe chain is the machine's unless narrowed. A jdk verb under test would otherwise
  # list, default to, write pointers at or uninstall the developer's own sdkman/mise/OS installs.
  { JK_JDK_PROBES = "java-home,jk" },
]
