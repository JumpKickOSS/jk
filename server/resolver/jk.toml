name = "jk-resolver"
description = "PubGrub dependency resolver"

[dependencies]
jk-core.workspace = true
jk-io.workspace = true

[test-dependencies]
# `kind = "tests"` reaches jk-host's test classes — where its `[test] extra-src`
# fixtures compile. Direct edge only, and never in a main jar.
jk-host = { workspace = true, kind = "tests" }
assertj-core = "latest"
junit-jupiter = "latest"

[test]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run everything (all suites, tags included) with `jk build --all` / `jk test --all`.
exclude-tags = ["integration", "slow", "bench", "network"]
