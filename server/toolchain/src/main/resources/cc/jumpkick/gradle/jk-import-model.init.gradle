//
// jk import's model query. Gradle evaluates the build with this init script and runs the one task
// it registers on the root project, `jkImportModel`, which writes what the import maps — every
// project, the plugins it applies, the dependencies each configuration declares, its source roots,
// toolchain, repositories and script-declared tasks — as JSON to the file `-Pjk.import.out` names.
// `-Pjk.import.plugins` is the comma-separated list of plugin ids the import knows how to map;
// each project answers which of them it applies.
import groovy.json.JsonOutput
import groovy.transform.Field
import org.gradle.api.Project
import org.gradle.api.Task
import org.gradle.api.artifacts.Dependency
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.artifacts.FileCollectionDependency
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.attributes.Category

def outPath = gradle.startParameter.projectProperties['jk.import.out']
def probeIds = (gradle.startParameter.projectProperties['jk.import.plugins'] ?: '').split(',').findAll { it }

// One line per evaluated project: the import's progress counter.
gradle.afterProject { Project p -> println("jk-import: evaluated " + p.path) }

gradle.rootProject { Project root ->
    root.tasks.register('jkImportModel') { Task t ->
        if (t.metaClass.respondsTo(t, 'notCompatibleWithConfigurationCache', String)) {
            t.notCompatibleWithConfigurationCache('reads the evaluated project model')
        }
        t.doLast {
            def settingsRepos = []
            try {
                settingsRepos = gradle.settings.dependencyResolutionManagement.repositories
                        .findAll { it instanceof MavenArtifactRepository }
                        .collect { it.url.toString() }
            } catch (Throwable ignored) {
            }
            def model = [
                gradle: gradle.gradleVersion,
                rootName: root.name,
                settingsRepositories: settingsRepos,
                projects: root.allprojects.sort { it.path }.collect { describeProject(it, root, probeIds) },
            ]
            new File(outPath).text = JsonOutput.toJson(model)
        }
    }
}

// Names Gradle and its core plugins give the tasks they register with an ad-hoc type, so a
// task of that type not named here is one the build's own scripts registered.
@Field final Set<String> PLUGIN_TASK_NAMES = [
    'assemble', 'build', 'check', 'classes', 'testClasses', 'clean', 'buildDependents', 'buildNeeded',
    'jar', 'javadoc', 'test', 'processResources', 'processTestResources', 'compileJava', 'compileTestJava',
    'distZip', 'distTar', 'installDist', 'assembleDist', 'startScripts', 'run',
    'bootDistZip', 'bootDistTar', 'bootStartScripts', 'bootRun', 'bootJar', 'bootBuildInfo',
    'publish', 'publishToMavenLocal', 'generatePomFileForMavenPublication', 'sourcesJar', 'javadocJar',
    'kotlinSourcesJar', 'allTests', 'apiCheck', 'apiBuild', 'apiDump', 'jkImportModel', 'prepareKotlinBuildScriptModel',
] as Set
@Field final Set<String> PLUGIN_TASK_PREFIXES = ['spotless', 'publish', 'generateMetadataFileFor', 'generatePomFileFor',
    'sign', 'dokka', 'kotlin', 'compileKotlin', 'kapt', 'ksp', 'checkstyle', 'pmd', 'jacoco', 'japicmp',
    'ktlint', 'detekt', 'sonar', 'shadow', 'boot', 'quarkus', 'errorprone', 'nativeCompile', 'nativeRun',
    'nativeTest', 'metadataCopy', 'collectReachabilityMetadata', 'processAot', 'processTestAot',
    'generateSarif', 'resolve', 'animalsniffer', 'cleanEclipse', 'cleanIdea', 'eclipse', 'idea', 'openIdea'] as Set
// Types a build script reaches for when it declares a task of its own.
@Field final Set<String> AD_HOC_TASK_TYPES = [
    'org.gradle.api.DefaultTask', 'org.gradle.api.tasks.Copy', 'org.gradle.api.tasks.Sync',
    'org.gradle.api.tasks.Exec', 'org.gradle.api.tasks.JavaExec', 'org.gradle.api.tasks.bundling.Zip',
    'org.gradle.api.tasks.bundling.Tar', 'org.gradle.api.tasks.Delete', 'org.gradle.api.tasks.WriteProperties',
] as Set

def describeProject(Project p, Project root, List<String> probeIds) {
    def m = [:]
    m.path = p.path
    m.projectName = p.name
    m.dir = root.projectDir.toPath().relativize(p.projectDir.toPath()).toString().replace('\\', '/')
    m.group = p.group.toString()
    m.version = p.version.toString()
    if (p.description) m.description = p.description
    m.plugins = probeIds.findAll { p.pluginManager.hasPlugin(it) }
    m.pluginClasses = p.plugins.collect { taskType(it) }.findAll { !it.startsWith('org.gradle.') }
    def versions = [:]
    for (String id : m.plugins) {
        try {
            def plugin = p.plugins.findPlugin(id)
            if (plugin == null || plugin.class.name.startsWith('org.gradle.')) continue
            def v = plugin.class.package?.implementationVersion
            if (v) versions[id] = v
        } catch (Throwable ignored) {
        }
    }
    m.pluginVersions = versions
    def javaExt = p.extensions.findByName('java')
    if (javaExt != null) {
        def j = [:]
        try { def lv = javaExt.toolchain.languageVersion.orNull; if (lv != null) j.toolchain = lv.asInt() } catch (Throwable ignored) { }
        try { j.sourceCompatibility = javaExt.sourceCompatibility.majorVersion } catch (Throwable ignored) { }
        try { j.targetCompatibility = javaExt.targetCompatibility.majorVersion } catch (Throwable ignored) { }
        try { def r = p.tasks.findByName('compileJava')?.options?.release?.orNull; if (r != null) j.release = r } catch (Throwable ignored) { }
        m.java = j
    }
    def kotlinExt = p.extensions.findByName('kotlin')
    if (kotlinExt != null) {
        try { m.kotlinVersion = kotlinExt.coreLibrariesVersion } catch (Throwable ignored) { }
        try { def jt = kotlinExt.jvmToolchain; } catch (Throwable ignored) { }
    }
    try { m.mainClass = p.extensions.findByName('application')?.mainClass?.orNull } catch (Throwable ignored) { }
    if (!m.mainClass) {
        try { m.mainClass = p.extensions.findByName('springBoot')?.mainClass?.orNull } catch (Throwable ignored) { }
    }
    if (!m.mainClass) m.remove('mainClass')
    m.bootBuildInfo = p.tasks.findByName('bootBuildInfo') != null
    try {
        // Shadow's relocators: pattern, shadedPattern, includes, excludes, rawString — the same
        // properties on the Groovy and the Kotlin SimpleRelocator.
        def shadow = p.tasks.findByName('shadowJar')
        if (shadow != null) {
            m.relocations = shadow.relocators.collect { r -> [
                pattern: r.pattern?.toString(),
                shadedPattern: r.shadedPattern?.toString(),
                rawString: (r.rawString ?: false) as boolean,
                includes: (r.includes ?: []).collect { it.toString() },
                excludes: (r.excludes ?: []).collect { it.toString() },
            ] }
        }
    } catch (Throwable ignored) {
    }
    try {
        def jar = p.tasks.findByName('jar')
        if (jar != null) m.manifest = jar.manifest.attributes.collectEntries { k, v -> [k.toString(), v.toString()] }
    } catch (Throwable ignored) {
    }
    m.repositories = p.repositories.findAll { it instanceof MavenArtifactRepository }.collect { it.url.toString() }
    def sourceSets = p.extensions.findByName('sourceSets')
    if (sourceSets != null) {
        m.sourceSets = sourceSets.collect { s ->
            def kotlinDirs = []
            try { kotlinDirs = s.extensions.findByName('kotlin')?.srcDirs ?: [] } catch (Throwable ignored) { }
            [name: s.name, java: relDirs(p, s.java.srcDirs), resources: relDirs(p, s.resources.srcDirs), kotlin: relDirs(p, kotlinDirs)]
        }
    }
    m.configurations = p.configurations
            .findAll { !it.dependencies.isEmpty() || !it.dependencyConstraints.isEmpty() }
            .collect { c ->
                [name: c.name,
                 dependencies: c.dependencies.collect { describeDependency(it, root) },
                 constraints: c.dependencyConstraints.collect { [module: it.group + ':' + it.name, version: constraintVersion(it)] }]
            }
    def dm = p.extensions.findByName('dependencyManagement')
    if (dm != null) {
        try {
            // Only the versions the plugin supplies to this project's own version-less dependencies.
            def versionless = [] as Set
            m.configurations.each { c -> c.dependencies.each { d -> if (d.kind == 'module' && !d.version) versionless << (d.group + ':' + d.artifact) } }
            m.managedVersions = dm.managedVersions.findAll { k, v -> versionless.contains(k.toString()) }.collectEntries { k, v -> [k.toString(), v.toString()] }
        } catch (Throwable ignored) {
        }
        try {
            m.springBootBom = p.buildscript.classLoader.loadClass('org.springframework.boot.gradle.plugin.SpringBootPlugin')
                    .getField('BOM_COORDINATES').get(null).toString()
        } catch (Throwable ignored) {
        }
        m.importedBoms = importedBoms(p)
    }
    m.tasks = p.tasks.findAll { isScriptTask(it) }.collect { [name: it.name, type: taskType(it), group: it.group ?: ''] }
    return m
}

// The BOMs a `dependencyManagement { imports { mavenBom … } }` block names for this project. The
// plugin's API exposes the versions it manages, not the BOM they came from, so the script text is
// read — the project's own build script and every ancestor's — and a `mavenBom` line counts for
// the project when the block holding it reaches it: a script's top-level block is that script's
// own project's alone, a `subprojects { }` block reaches every project below the script's, an
// `allprojects { }` block every project at or below it, a `project(':path') { }` block the project
// it names, and a `configure(subprojects…) { }` block every project below. A `$property` in a
// coordinate is the project's property; `SpringBootPlugin.BOM_COORDINATES` is Boot's BOM; a
// placeholder nothing defines is left for the import to report.
def importedBoms(Project p) {
    def boms = []
    for (Project owner = p; owner != null; owner = owner.parent) {
        def script = owner.buildFile
        if (script == null || !script.isFile()) continue
        def text = script.text
        if (!text.contains('mavenBom')) continue
        for (def hit : mavenBomHits(text)) {
            if (!reaches(hit.scope, owner, p)) continue
            if (hit.literal != null) {
                boms << interpolate(p, hit.literal)
            } else {
                try {
                    boms << p.buildscript.classLoader.loadClass('org.springframework.boot.gradle.plugin.SpringBootPlugin')
                            .getField('BOM_COORDINATES').get(null).toString()
                } catch (Throwable ignored) {
                }
            }
        }
    }
    return boms
}

// Every `mavenBom` of a script with the scope of the block holding it — `self`, `subprojects`,
// `allprojects` or a project path — and the coordinate as written, null for a BOM_COORDINATES constant.
def mavenBomHits(String text) {
    def hits = []
    def matcher = text =~ /mavenBom\s*\(?\s*(?:"([^"\n]*)"|'([^'\n]*)'|([A-Za-z_][\w.]*BOM_COORDINATES))/
    while (matcher.find()) {
        hits << [scope: blockScope(text, matcher.start()), literal: matcher.group(1) ?: matcher.group(2)]
    }
    return hits
}

// Whether a block of `owner`'s script with `scope` configures `p`.
def reaches(String scope, Project owner, Project p) {
    switch (scope) {
        case 'self': return owner.path == p.path
        case 'allprojects': return true
        case 'subprojects': return owner.path != p.path
        default:
            def path = scope.startsWith(':') ? scope : (owner.path == ':' ? ':' + scope : owner.path + ':' + scope)
            return path == p.path
    }
}

// The scope of the blocks open at `offset`: the outermost block whose head names a set of projects decides.
def blockScope(String text, int offset) {
    for (String head : openBlockHeads(text, offset)) {
        if (head ==~ /(?s)subprojects\b.*/) return 'subprojects'
        if (head ==~ /(?s)allprojects\b.*/) return 'allprojects'
        def named = head =~ /^project\s*\(\s*["']([^"']+)["']\s*\)/
        if (named.find()) return named.group(1)
        if (head ==~ /(?s)configure\s*\(.*/) {
            if (head.contains('allprojects')) return 'allprojects'
            if (head.contains('subprojects')) return 'subprojects'
        }
    }
    return 'self'
}

// The heads of the `{ }` blocks open at `offset`, outermost first: the text before each brace since
// the previous brace, semicolon or line start (`subprojects`, `project(':core')`, `dependencyManagement`),
// or the whole line before it when that holds no word; string literals and comments are skipped.
def openBlockHeads(String text, int offset) {
    def heads = []
    int i = 0
    int lineStart = 0
    int headStart = 0
    while (i < offset) {
        String c = text.substring(i, i + 1)
        if (c == '/' && text.startsWith('//', i)) {
            int eol = text.indexOf('\n', i)
            i = eol < 0 ? text.length() : eol
            continue
        }
        if (c == '/' && text.startsWith('/*', i)) {
            int end = text.indexOf('*/', i + 2)
            i = end < 0 ? text.length() : end + 2
            continue
        }
        if (c == '"' || c == "'") {
            i = endOfString(text, i)
            continue
        }
        if (c == '{') {
            String head = text.substring(headStart, i).trim()
            if (!(head =~ /[A-Za-z]/)) head = text.substring(lineStart, i).trim()
            heads << head
            headStart = i + 1
        } else if (c == '}') {
            if (!heads.isEmpty()) heads.remove(heads.size() - 1)
            headStart = i + 1
        } else if (c == ';') {
            headStart = i + 1
        } else if (c == '\n') {
            lineStart = i + 1
            headStart = i + 1
        }
        i++
    }
    return heads
}

// The index just past the string literal opening at `start`: a triple-quoted block, or a quoted run with backslash escapes.
def endOfString(String text, int start) {
    String quote = text.substring(start, start + 1)
    String triple = quote * 3
    if (text.startsWith(triple, start)) {
        int end = text.indexOf(triple, start + 3)
        return end < 0 ? text.length() : end + 3
    }
    int i = start + 1
    while (i < text.length()) {
        String c = text.substring(i, i + 1)
        if (c == '\\') { i += 2; continue }
        if (c == quote) return i + 1
        if (c == '\n') return i
        i++
    }
    return text.length()
}

// `$name` / `${name}` / `${property("name")}` / `${libs.versions.alias.get()}` in a script literal,
// as the project answers them.
def interpolate(Project p, String literal) {
    return literal.replaceAll('\\$\\{([^}]*)\\}|\\$([A-Za-z_][A-Za-z0-9_]*)') { List<String> groups ->
        def expression = (groups[1] ?: groups[2]).trim()
        def value = propertyValue(p, expression)
        value != null ? value : groups[0]
    }
}

def propertyValue(Project p, String expression) {
    def lookup = expression =~ /^(?:(?:project|rootProject)\.)?(?:property|findProperty|properties|extra|ext)\s*[(\[]\s*["']([^"']*)["']\s*[)\]]$/
    def catalog = expression =~ /^([A-Za-z_][A-Za-z0-9_]*)\.versions\.([A-Za-z0-9_.]+)\.get\(\)$/
    try {
        if (lookup.matches()) return p.findProperty(lookup.group(1))?.toString()
        if (catalog.matches()) {
            def found = p.extensions.findByType(VersionCatalogsExtension)
                    ?.named(catalog.group(1))
                    ?.findVersion(catalog.group(2).replace('.', '-'))
            return found?.isPresent() ? found.get().toString() : null
        }
        def name = expression
        for (String prefix : ['project.', 'rootProject.', 'ext.', 'extra.']) {
            if (name.startsWith(prefix)) name = name.substring(prefix.length())
        }
        return name ==~ /[A-Za-z_][A-Za-z0-9_]*/ ? p.findProperty(name)?.toString() : null
    } catch (Throwable ignored) {
        return null
    }
}

def relDirs(Project p, Collection dirs) {
    dirs.collect { p.projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
}

def constraintVersion(constraint) {
    try {
        def vc = constraint.versionConstraint
        if (vc.strictVersion) return vc.strictVersion
        if (vc.requiredVersion) return vc.requiredVersion
        if (vc.preferredVersion) return vc.preferredVersion
    } catch (Throwable ignored) {
    }
    return constraint.version ?: ''
}

def describeDependency(Dependency d, Project root) {
    if (d instanceof ProjectDependency) {
        def path
        try { path = d.path } catch (Throwable ignored) { path = d.dependencyProject.path }
        return [kind: 'project', projectPath: path]
    }
    if (d instanceof ExternalModuleDependency) {
        def r = [kind: 'module', group: d.group ?: '', artifact: d.name, version: d.version ?: '']
        try {
            def vc = d.versionConstraint
            if (vc.strictVersion) r.strict = vc.strictVersion
            if (vc.requiredVersion) r.required = vc.requiredVersion
            if (vc.preferredVersion) r.prefer = vc.preferredVersion
        } catch (Throwable ignored) {
        }
        try {
            def category = d.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
            if (category != null) r.category = category.name
        } catch (Throwable ignored) {
        }
        if (!d.transitive) r.intransitive = true
        r.excludes = d.excludeRules.collect { (it.group ?: '*') + ':' + (it.module ?: '*') }
        if (!d.artifacts.isEmpty()) {
            def a = d.artifacts.first()
            if (a.classifier) r.classifier = a.classifier
            if (a.type && a.type != 'jar') r.type = a.type
        }
        return r
    }
    if (d instanceof FileCollectionDependency) {
        return [kind: 'files', files: d.files.collect { root.projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }]
    }
    return [kind: 'other', text: d.toString()]
}

// The declared class of a task or plugin, under the subclass Gradle decorates it with.
def taskType(Object t) {
    def type = t.class
    if (type.name.endsWith('_Decorated') && type.superclass != null) type = type.superclass
    return type.name
}

def isScriptTask(Task t) {
    if (PLUGIN_TASK_NAMES.contains(t.name)) return false
    if (PLUGIN_TASK_PREFIXES.any { t.name.startsWith(it) }) return false
    if (t.name.endsWith('Classes')) return false
    def type = taskType(t)
    if (!type.contains('.')) return true
    if (type.contains('_gradle')) return true
    return AD_HOC_TASK_TYPES.contains(type)
}
