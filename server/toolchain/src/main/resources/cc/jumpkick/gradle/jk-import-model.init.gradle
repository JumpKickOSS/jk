//
// jk import's model query. Gradle evaluates the build with this init script and runs the task it
// registers on the root project, `jkImportModel`, which writes what the import maps — every
// project, the plugins it applies, the dependencies each configuration declares, its source roots,
// toolchain, repositories, script-declared tasks and the versions its classpaths resolve to — as
// JSON to the file `-Pjk.import.out` names. Each project's own `jkImportProject` task describes it
// first, beside that file: Gradle resolves a project's configurations only in its own context, and
// the declared dependencies are read before resolving, which adds the ones plugins add lazily.
// `-Pjk.import.plugins` is the comma-separated list of plugin ids the import knows how to map;
// each project answers which of them it applies. `-Pjk.import.rules` names a JSON file of the
// extension and task properties installed import rules read, per plugin id.
import groovy.json.JsonOutput
import java.util.Locale
import groovy.json.JsonSlurper
import groovy.transform.Field
import org.gradle.api.Project
import org.gradle.api.Task
import org.gradle.api.artifacts.Dependency
import org.gradle.api.artifacts.ExternalModuleDependency
import org.gradle.api.artifacts.FileCollectionDependency
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.VersionCatalogsExtension
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.repositories.MavenArtifactRepository
import org.gradle.api.attributes.Category

def outPath = gradle.startParameter.projectProperties['jk.import.out']
def probeIds = (gradle.startParameter.projectProperties['jk.import.plugins'] ?: '').split(',').findAll { it }
def rulesPath = gradle.startParameter.projectProperties['jk.import.rules']
@Field List RULE_READS = []
if (rulesPath) RULE_READS = new JsonSlurper().parse(new File(rulesPath)) as List

// The import's progress: how many projects there are, then one line per project configured and
// one per project whose classpaths are resolved and described.
gradle.projectsLoaded { g -> println("jk-import: projects " + g.rootProject.allprojects.size()) }
gradle.afterProject { Project p -> println("jk-import: evaluated " + p.path) }

// The classpaths whose resolved versions the import compares declared versions against.
@Field final List<String> RESOLVED_CLASSPATHS = ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']

gradle.allprojects { Project p ->
    p.tasks.register('jkImportProject') { Task t ->
        if (t.metaClass.respondsTo(t, 'notCompatibleWithConfigurationCache', String)) {
            t.notCompatibleWithConfigurationCache('reads the evaluated project model')
        }
        t.doLast {
            def m = describeProject(p, p.rootProject, probeIds)
            m.resolved = resolvedVersions(p)
            projectFile(p).text = JsonOutput.toJson(m)
            println("jk-import: described " + p.path)
        }
    }
}

gradle.rootProject { Project root ->
    root.tasks.register('jkImportModel') { Task t ->
        if (t.metaClass.respondsTo(t, 'notCompatibleWithConfigurationCache', String)) {
            t.notCompatibleWithConfigurationCache('reads the evaluated project model')
        }
        t.dependsOn(root.allprojects.collect { it.tasks.named('jkImportProject') })
        t.doLast {
            def settingsRepos = []
            try {
                settingsRepos = gradle.settings.dependencyResolutionManagement.repositories
                        .findAll { it instanceof MavenArtifactRepository }
                        .collect { repositoryModel(it) }
            } catch (Throwable ignored) {
            }
            def model = [
                gradle: gradle.gradleVersion,
                rootName: root.name,
                settingsRepositories: settingsRepos,
                projects: root.allprojects.sort { it.path }.collect { new JsonSlurper().parse(projectFile(it)) },
            ]
            new File(outPath).text = JsonOutput.toJson(model)
        }
    }
}

// Names Gradle and its core plugins give the tasks they register with an ad-hoc type, so a
// task of that type not named here is one the build's own scripts registered.
@Field final Set<String> PLUGIN_TASK_NAMES = [
    'assemble', 'build', 'check', 'classes', 'testClasses', 'clean', 'buildDependents', 'buildNeeded',
    'jar', 'javadoc', 'test', 'processResources', 'processTestResources', 'compileJava', 'compileTestJava',
    'distZip', 'distTar', 'installDist', 'assembleDist', 'startScripts', 'run',
    'bootDistZip', 'bootDistTar', 'bootStartScripts', 'bootRun', 'bootJar', 'bootBuildInfo',
    'publish', 'publishToMavenLocal', 'generatePomFileForMavenPublication', 'sourcesJar', 'javadocJar',
    'kotlinSourcesJar', 'allTests', 'apiCheck', 'apiBuild', 'apiDump', 'jkImportModel', 'jkImportProject',
    'prepareKotlinBuildScriptModel',
] as Set
@Field final Set<String> PLUGIN_TASK_PREFIXES = ['spotless', 'publish', 'generateMetadataFileFor', 'generatePomFileFor',
    'sign', 'dokka', 'kotlin', 'compileKotlin', 'kapt', 'ksp', 'checkstyle', 'pmd', 'jacoco', 'japicmp',
    'ktlint', 'detekt', 'sonar', 'shadow', 'boot', 'quarkus', 'errorprone', 'nativeCompile', 'nativeRun',
    'nativeTest', 'metadataCopy', 'collectReachabilityMetadata', 'processAot', 'processTestAot',
    'generateSarif', 'resolve', 'animalsniffer', 'cleanEclipse', 'cleanIdea', 'eclipse', 'idea', 'openIdea'] as Set
// Types a build script reaches for when it declares a task of its own.
@Field final Set<String> AD_HOC_TASK_TYPES = [
    'org.gradle.api.DefaultTask', 'org.gradle.api.tasks.Copy', 'org.gradle.api.tasks.Sync',
    'org.gradle.api.tasks.Exec', 'org.gradle.api.tasks.JavaExec', 'org.gradle.api.tasks.bundling.Zip',
    'org.gradle.api.tasks.bundling.Tar', 'org.gradle.api.tasks.Delete', 'org.gradle.api.tasks.WriteProperties',
] as Set

// Where a project's `jkImportProject` writes: beside the model file, named by the project path.
def projectFile(Project p) {
    def out = new File(gradle.startParameter.projectProperties['jk.import.out'])
    return new File(out.parentFile, 'project' + p.path.replace(':', '_') + '.json')
}

// A Maven repository: its URL and name, the groups its `content { }` filter includes, and for a
// credential the environment variables whose value it is. Never the credential itself: only the
// names of the variables that hold it.
def repositoryModel(MavenArtifactRepository repo) {
    def r = [url: repo.url.toString(), name: repo.name]
    try {
        def descriptor = privateField(repo, 'repositoryContentDescriptor')
        def groups = []
        def unmapped = []
        for (def spec : (privateField(descriptor, 'includeSpecs') ?: [])) {
            def kind = privateField(spec, 'matcherKind')?.toString()
            def group = privateField(spec, 'group')
            if (group != null && privateField(spec, 'module') == null && privateField(spec, 'version') == null
                    && kind == 'SIMPLE') {
                groups << group
            } else if (group != null && kind == 'GROUP_AND_SUBGROUPS') {
                groups << group
                groups << group + '.*'
            } else {
                unmapped << [group, privateField(spec, 'module'), privateField(spec, 'version')].findAll { it != null }.join(':')
            }
        }
        if (groups) r.groups = groups.unique()
        // mavenContent { releasesOnly() } / snapshotsOnly(): the kinds of version the repository is asked for.
        if (privateField(descriptor, 'releases') == false) r.releases = false
        if (privateField(descriptor, 'snapshots') == false) r.snapshots = false
        if (unmapped) r.unmappedContent = unmapped
    } catch (Throwable ignored) {
    }
    try {
        def credentials = repo.configuredCredentials.orNull
        if (credentials instanceof org.gradle.api.credentials.HttpHeaderCredentials) {
            r.credential = [kind: 'header', secretEnv: envHolding(credentials.value)]
        } else if (credentials instanceof org.gradle.api.credentials.PasswordCredentials) {
            def userEnv = envHolding(credentials.username)
            r.credential = [kind: 'password', secretEnv: envHolding(credentials.password), usernameEnv: userEnv]
            if (userEnv == null && credentials.username) r.credential.username = credentials.username
        } else if (credentials != null) {
            r.credential = [kind: credentials.class.simpleName.replace('_Decorated', '')]
        }
    } catch (Throwable ignored) {
    }
    return r
}

// The first environment variable, by name, whose value is `value`; null when none is, or when the
// value is too short to tell one variable from another.
def envHolding(String value) {
    if (value == null || value.length() < 8) return null
    return System.getenv().findAll { k, v -> v == value }.keySet().sort().find { true }
}

def privateField(Object target, String name) {
    if (target == null) return null
    for (def c = target.class; c != null; c = c.superclass) {
        def f = c.declaredFields.find { it.name == name }
        if (f != null) {
            f.accessible = true
            return f.get(target)
        }
    }
    return null
}

// Every module version the project's classpaths resolve, as `group:artifact@version`.
def resolvedVersions(Project p) {
    def resolved = [] as Set
    for (String name : RESOLVED_CLASSPATHS) {
        def c = p.configurations.findByName(name)
        if (c == null || !c.canBeResolved) continue
        try {
            c.incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) resolved << (id.group + ':' + id.module + '@' + id.version)
            }
        } catch (Throwable ignored) {
        }
    }
    return resolved.sort()
}

def describeProject(Project p, Project root, List<String> probeIds) {
    def m = [:]
    m.path = p.path
    m.projectName = p.name
    m.dir = root.projectDir.toPath().relativize(p.projectDir.toPath()).toString().replace('\\', '/')
    m.group = p.group.toString()
    m.version = p.version.toString()
    if (p.description) m.description = p.description
    m.plugins = probeIds.findAll { p.pluginManager.hasPlugin(it) }
    // The other plugins by class: a probed id's plugin is the import's to report or map.
    def probedClasses = m.plugins.collect { id -> try { taskType(p.plugins.findPlugin(id)) } catch (Throwable ignored) { null } } as Set
    m.pluginClasses = p.plugins.collect { taskType(it) }.findAll { !it.startsWith('org.gradle.') && !probedClasses.contains(it) }
    def versions = [:]
    for (String id : m.plugins) {
        try {
            def plugin = p.plugins.findPlugin(id)
            if (plugin == null || plugin.class.name.startsWith('org.gradle.')) continue
            def v = plugin.class.package?.implementationVersion
            if (v) versions[id] = v
        } catch (Throwable ignored) {
        }
    }
    m.pluginVersions = versions
    def javaExt = p.extensions.findByName('java')
    if (javaExt != null) {
        def j = [:]
        try { def lv = javaExt.toolchain.languageVersion.orNull; if (lv != null) j.toolchain = lv.asInt() } catch (Throwable ignored) { }
        try {
            def vendor = javaExt.toolchain.vendor.orNull?.toString()
            // The convention when the build names none prints `any vendor` (`any` on older Gradle).
            if (vendor && !vendor.toLowerCase(Locale.ROOT).startsWith('any')) j.vendor = vendor
        } catch (Throwable ignored) { }
        try { j.sourceCompatibility = javaExt.sourceCompatibility.majorVersion } catch (Throwable ignored) { }
        try { j.targetCompatibility = javaExt.targetCompatibility.majorVersion } catch (Throwable ignored) { }
        try { def r = p.tasks.findByName('compileJava')?.options?.release?.orNull; if (r != null) j.release = r } catch (Throwable ignored) { }
        m.java = j
    }
    def kotlinExt = p.extensions.findByName('kotlin')
    if (kotlinExt != null) {
        try { m.kotlinVersion = kotlinExt.coreLibrariesVersion } catch (Throwable ignored) { }
        try {
            def target = p.tasks.findByName('compileKotlin')?.compilerOptions?.jvmTarget?.orNull?.target
            if (target) m.kotlinJvmTarget = target
        } catch (Throwable ignored) { }
    }
    try {
        // The xjc plugin (com.github.bjornvester.xjc): the schemas it compiles and how.
        def xjc = p.extensions.findByName('xjc')
        if (xjc != null) {
            def x = [:]
            def xsd = xjc.xsdDir.orNull
            if (xsd != null) x.xsdDir = relDirs(p, [xsd.asFile])[0]
            def pkg = xjc.defaultPackage.orNull
            if (pkg) x.defaultPackage = pkg.toString()
            x.bindingFiles = relDirs(p, xjc.bindingFiles.files)
            x.options = (xjc.options.orNull ?: []).collect { it.toString() }
            m.xjc = x
        }
    } catch (Throwable ignored) { }

    try {
        // The Avro plugin (com.github.davidmc24.gradle.plugin.avro): the schema directories
        // generateAvroJava reads, and the build directory to tell generated ones apart.
        def avro = p.extensions.findByName('avro')
        def gen = p.tasks.findByName('generateAvroJava')
        if (avro != null && gen != null) {
            def a = [:]
            def roots = [] as LinkedHashSet
            // The tree's roots, read off its structure so an empty or not yet downloaded directory counts.
            try {
                def loader = gen.source.class.classLoader
                def visitorType = loader.loadClass('org.gradle.api.internal.file.FileCollectionStructureVisitor')
                def visit = loader.loadClass('org.gradle.api.internal.file.FileCollectionStructureVisitor$VisitType').Visit
                gen.source.visitStructure([
                        startVisit: { s, fc -> true },
                        prepareForVisit: { s -> visit },
                        visitCollection: { s, contents -> contents.each { roots << it } },
                        visitFileTree: { treeRoot, patterns, tree -> roots << treeRoot },
                        visitFileTreeBackedByFile: { file, tree, st -> roots << file.parentFile },
                ].asType(visitorType))
            } catch (Throwable ignored) {
                gen.source.visit { d ->
                    if (!d.directory) {
                        String path = d.file.path
                        roots << new File(path.substring(0, path.length() - d.relativePath.pathString.length() - 1))
                    }
                }
            }
            a.sources = relDirs(p, roots)
            a.buildDir = relDirs(p, [p.layout.buildDirectory.get().asFile])[0]
            m.avro = a
        }
    } catch (Throwable ignored) { }

    // Each import rule's properties, read off the extension or task it names, per plugin id.
    // The Confluent schema-registry plugin (com.github.imflog.kafka-schema-registry-gradle-plugin):
    // the registry URL, the subjects its download block names, the variables holding the basic-auth
    // key and secret (2.x clientConfig, 1.x credentials), and whether it registers or checks.
    try {
        def sr = p.extensions.findByName('schemaRegistry')
        if (sr != null && p.plugins.hasPlugin('com.github.imflog.kafka-schema-registry-gradle-plugin')) {
            def r = [url: sr.url.orNull, auth: false, usernameEnv: null, passwordEnv: null, registers: false]
            def info = null
            try { info = (sr.clientConfig.orNull ?: [:])['basic.auth.user.info'] } catch (Throwable ignored) { }
            if (info instanceof String && info.contains(':')) {
                r.auth = true
                def colon = info.indexOf(':')
                r.usernameEnv = envHolding(info.substring(0, colon))
                r.passwordEnv = envHolding(info.substring(colon + 1))
            }
            try {
                def c = sr.credentials
                if (c.username.orNull) r.auth = true
                if (!r.usernameEnv) r.usernameEnv = envHolding(c.username.orNull)
                if (!r.passwordEnv) r.passwordEnv = envHolding(c.password.orNull)
            } catch (Throwable ignored) { }
            def download = sr.extensions.findByName('download')
            r.subjects = (download?.subjects?.orNull ?: []).collect { s ->
                def d = [subject: s.subject, regex: s.regex, output: relDirs(p, [p.file(s.outputPath)])[0]]
                if (s.version != null) d.version = s.version
                d
            }
            r.registers = ['register', 'compatibility'].any { name ->
                try { !(sr.extensions.findByName(name)?.subjects?.orNull ?: []).isEmpty() } catch (Throwable ignored) { false }
            }
            m.schemaRegistry = r
        }
    } catch (Throwable ignored) { }

    def ruled = [:]
    for (def r : RULE_READS) {
        try {
            if (!p.plugins.hasPlugin(r.id as String)) continue
            def target = r.extension ? p.extensions.findByName(r.extension as String) : p.tasks.findByName(r.task as String)
            if (target == null) continue
            def values = [:]
            for (def k : r.properties) {
                def v = ruleValue(p, target, k as String)
                if (v != null) values[k] = v
            }
            // A secret is reported as the variable holding it, never as its value.
            for (def k : (r.secrets ?: [])) {
                def v = ruleValue(p, target, k as String)
                values[k] = [env: v instanceof String ? envHolding(v) : null]
            }
            ruled[r.id] = values
        } catch (Throwable ignored) { }
    }
    if (ruled) m.ruled = ruled

    try { m.mainClass = p.extensions.findByName('application')?.mainClass?.orNull } catch (Throwable ignored) { }
    if (!m.mainClass) {
        try { m.mainClass = p.extensions.findByName('springBoot')?.mainClass?.orNull } catch (Throwable ignored) { }
    }
    if (!m.mainClass) m.remove('mainClass')
    m.bootBuildInfo = p.tasks.findByName('bootBuildInfo') != null
    try {
        // Shadow's relocators: pattern, shadedPattern, includes, excludes, rawString — the same
        // properties on the Groovy and the Kotlin SimpleRelocator.
        def shadow = p.tasks.findByName('shadowJar')
        if (shadow != null) {
            m.relocations = shadow.relocators.collect { r -> [
                pattern: r.pattern?.toString(),
                shadedPattern: r.shadedPattern?.toString(),
                rawString: (r.rawString ?: false) as boolean,
                includes: (r.includes ?: []).collect { it.toString() },
                excludes: (r.excludes ?: []).collect { it.toString() },
            ] }
        }
    } catch (Throwable ignored) {
    }
    try {
        def jar = p.tasks.findByName('jar')
        if (jar != null) m.manifest = jar.manifest.attributes.collectEntries { k, v -> [k.toString(), v.toString()] }
    } catch (Throwable ignored) {
    }
    // The arguments each compile hands javac, argument providers (the errorprone plugin's) included.
    def compilerArgs = [:]
    for (String task : ['compileJava', 'compileTestJava']) {
        try {
            def t = p.tasks.findByName(task)
            if (t != null) compilerArgs[task] = t.options.allCompilerArgs.collect { it.toString() }
        } catch (Throwable ignored) {
        }
    }
    if (compilerArgs) m.compilerArgs = compilerArgs
    // The test task's own system properties (string values) and JVM arguments.
    try {
        def test = p.tasks.findByName('test')
        if (test != null && test.hasProperty('systemProperties')) {
            m.test = [
                systemProperties: test.systemProperties.findAll { k, v -> v instanceof CharSequence || v instanceof Number || v instanceof Boolean }
                        .collectEntries { k, v -> [(k.toString()): v.toString()] },
                jvmArgs: (test.jvmArgs ?: []).collect { it.toString() },
            ]
        }
    } catch (Throwable ignored) {
    }
    try {
        def base = p.extensions.findByName('base')
        if (base != null) m.archivesName = base.archivesName.orNull
    } catch (Throwable ignored) {
    }
    try {
        def publishing = p.extensions.findByName('publishing')
        if (publishing != null) {
            m.publications = publishing.publications.findAll { it.hasProperty('artifactId') }.collect { pub ->
                def r = [name: pub.name, groupId: pub.groupId, artifactId: pub.artifactId]
                try { if (pub.pom.name.orNull) r.pomName = pub.pom.name.orNull } catch (Throwable ignored) { }
                try { if (pub.pom.description.orNull) r.pomDescription = pub.pom.description.orNull } catch (Throwable ignored) { }
                try { if (pub.pom.url.orNull) r.pomUrl = pub.pom.url.orNull } catch (Throwable ignored) { }
                r
            }
        }
    } catch (Throwable ignored) {
    }
    m.repositories = p.repositories.findAll { it instanceof MavenArtifactRepository }.collect { repositoryModel(it) }
    def sourceSets = p.extensions.findByName('sourceSets')
    if (sourceSets != null) {
        m.sourceSets = sourceSets.collect { s ->
            def kotlinDirs = []
            try { kotlinDirs = s.extensions.findByName('kotlin')?.srcDirs ?: [] } catch (Throwable ignored) { }
            [name: s.name, java: relDirs(p, s.java.srcDirs), resources: relDirs(p, s.resources.srcDirs), kotlin: relDirs(p, kotlinDirs)]
        }
    }
    m.configurations = p.configurations
            .findAll { !it.dependencies.isEmpty() || !it.dependencyConstraints.isEmpty() }
            .collect { c ->
                [name: c.name,
                 dependencies: c.dependencies.collect { describeDependency(it, root) },
                 constraints: c.dependencyConstraints.collect { [module: it.group + ':' + it.name, version: constraintVersion(it)] }]
            }
    def dm = p.extensions.findByName('dependencyManagement')
    if (dm != null) {
        try {
            // Only the versions the plugin manages for this project's own declared dependencies.
            def declared = [] as Set
            m.configurations.each { c -> c.dependencies.each { d -> if (d.kind == 'module') declared << (d.group + ':' + d.artifact) } }
            m.managedVersions = dm.managedVersions.findAll { k, v -> declared.contains(k.toString()) }.collectEntries { k, v -> [k.toString(), v.toString()] }
        } catch (Throwable ignored) {
        }
        try {
            m.springBootBom = p.buildscript.classLoader.loadClass('org.springframework.boot.gradle.plugin.SpringBootPlugin')
                    .getField('BOM_COORDINATES').get(null).toString()
        } catch (Throwable ignored) {
        }
        m.importedBoms = importedBoms(p)
    }
    m.tasks = p.tasks.findAll { isScriptTask(it) }.collect { [name: it.name, type: taskType(it), group: it.group ?: ''] }
    try {
        def producers = producers(p, m)
        if (producers) m.producers = producers
    } catch (Throwable ignored) { }
    return m
}

// For each source or schema directory under the build directory, the tasks whose outputs hold it or
// write into it: [dir: [[task, type, plugin?]]]. A generated directory names who fills it.
def producers(Project p, Map m) {
    def build = p.layout.buildDirectory.get().asFile.toPath()
    def dirs = [] as LinkedHashSet
    (m.avro?.sources ?: []).each { dirs << it }
    (m.sourceSets ?: []).each { s -> (s.java + s.resources + s.kotlin).each { dirs << it } }
    def wanted = dirs.findAll { p.projectDir.toPath().resolve(it).normalize().startsWith(build) }
    if (!wanted) return [:]
    // A task writing the directory or inside it; one writing a parent of it only when none does.
    def inside = [:]
    def above = [:]
    p.tasks.each { task ->
        def outputs
        try { outputs = task.outputs.files.files.collect { it.toPath().normalize() } } catch (Throwable ignored) { return }
        for (def dir : wanted) {
            def at = p.projectDir.toPath().resolve(dir).normalize()
            def row = null
            if (outputs.any { it.startsWith(at) }) row = inside
            else if (outputs.any { at.startsWith(it) }) row = above
            if (row == null) continue
            def r = [task: task.name, type: taskType(task)]
            def plugin = pluginIdOf(p, task)
            if (plugin) r.plugin = plugin
            row.computeIfAbsent(dir) { [] } << r
        }
    }
    def out = [:]
    for (def dir : wanted) {
        def rows = inside[dir] ?: above[dir]
        if (rows) out[dir] = rows
    }
    return out
}

// The id of the applied plugin loaded from the same jar as the task's class, or null.
def pluginIdOf(Project p, Object task) {
    try {
        def type = task.class
        if (type.name.endsWith('_Decorated') && type.superclass != null) type = type.superclass
        def jar = type.protectionDomain?.codeSource?.location
        if (jar == null) return null
        for (def plugin : p.plugins) {
            if (plugin.class.protectionDomain?.codeSource?.location != jar) continue
            def id = p.pluginManager.findPluginIdForClass(plugin.class)
            if (id != null && id.isPresent()) return id.get().id
        }
    } catch (Throwable ignored) { }
    return null
}

// The BOMs a `dependencyManagement { imports { mavenBom … } }` block names for this project. The
// plugin's API exposes the versions it manages, not the BOM they came from, so the script text is
// read — the project's own build script and every ancestor's — and a `mavenBom` line counts for
// the project when the block holding it reaches it: a script's top-level block is that script's
// own project's alone, a `subprojects { }` block reaches every project below the script's, an
// `allprojects { }` block every project at or below it, a `project(':path') { }` block the project
// it names, and a `configure(subprojects…) { }` block every project below. A `$property` in a
// coordinate is the project's property; `SpringBootPlugin.BOM_COORDINATES` is Boot's BOM; a
// placeholder nothing defines is left for the import to report.
def importedBoms(Project p) {
    def boms = []
    for (Project owner = p; owner != null; owner = owner.parent) {
        def script = owner.buildFile
        if (script == null || !script.isFile()) continue
        def text = script.text
        if (!text.contains('mavenBom')) continue
        for (def hit : mavenBomHits(text)) {
            if (!reaches(hit.scope, owner, p)) continue
            if (hit.literal != null) {
                boms << interpolate(p, hit.literal)
            } else {
                try {
                    boms << p.buildscript.classLoader.loadClass('org.springframework.boot.gradle.plugin.SpringBootPlugin')
                            .getField('BOM_COORDINATES').get(null).toString()
                } catch (Throwable ignored) {
                }
            }
        }
    }
    return boms
}

// Every `mavenBom` of a script with the scope of the block holding it — `self`, `subprojects`,
// `allprojects` or a project path — and the coordinate as written, null for a BOM_COORDINATES constant.
def mavenBomHits(String text) {
    def hits = []
    def matcher = text =~ /mavenBom\s*\(?\s*(?:"([^"\n]*)"|'([^'\n]*)'|([A-Za-z_][\w.]*BOM_COORDINATES))/
    while (matcher.find()) {
        hits << [scope: blockScope(text, matcher.start()), literal: matcher.group(1) ?: matcher.group(2)]
    }
    return hits
}

// Whether a block of `owner`'s script with `scope` configures `p`.
def reaches(String scope, Project owner, Project p) {
    switch (scope) {
        case 'self': return owner.path == p.path
        case 'allprojects': return true
        case 'subprojects': return owner.path != p.path
        default:
            def path = scope.startsWith(':') ? scope : (owner.path == ':' ? ':' + scope : owner.path + ':' + scope)
            return path == p.path
    }
}

// The scope of the blocks open at `offset`: the outermost block whose head names a set of projects decides.
def blockScope(String text, int offset) {
    for (String head : openBlockHeads(text, offset)) {
        if (head ==~ /(?s)subprojects\b.*/) return 'subprojects'
        if (head ==~ /(?s)allprojects\b.*/) return 'allprojects'
        def named = head =~ /^project\s*\(\s*["']([^"']+)["']\s*\)/
        if (named.find()) return named.group(1)
        if (head ==~ /(?s)configure\s*\(.*/) {
            if (head.contains('allprojects')) return 'allprojects'
            if (head.contains('subprojects')) return 'subprojects'
        }
    }
    return 'self'
}

// The heads of the `{ }` blocks open at `offset`, outermost first: the text before each brace since
// the previous brace, semicolon or line start (`subprojects`, `project(':core')`, `dependencyManagement`),
// or the whole line before it when that holds no word; string literals and comments are skipped.
def openBlockHeads(String text, int offset) {
    def heads = []
    int i = 0
    int lineStart = 0
    int headStart = 0
    while (i < offset) {
        String c = text.substring(i, i + 1)
        if (c == '/' && text.startsWith('//', i)) {
            int eol = text.indexOf('\n', i)
            i = eol < 0 ? text.length() : eol
            continue
        }
        if (c == '/' && text.startsWith('/*', i)) {
            int end = text.indexOf('*/', i + 2)
            i = end < 0 ? text.length() : end + 2
            continue
        }
        if (c == '"' || c == "'") {
            i = endOfString(text, i)
            continue
        }
        if (c == '{') {
            String head = text.substring(headStart, i).trim()
            if (!(head =~ /[A-Za-z]/)) head = text.substring(lineStart, i).trim()
            heads << head
            headStart = i + 1
        } else if (c == '}') {
            if (!heads.isEmpty()) heads.remove(heads.size() - 1)
            headStart = i + 1
        } else if (c == ';') {
            headStart = i + 1
        } else if (c == '\n') {
            lineStart = i + 1
            headStart = i + 1
        }
        i++
    }
    return heads
}

// The index just past the string literal opening at `start`: a triple-quoted block, or a quoted run with backslash escapes.
def endOfString(String text, int start) {
    String quote = text.substring(start, start + 1)
    String triple = quote * 3
    if (text.startsWith(triple, start)) {
        int end = text.indexOf(triple, start + 3)
        return end < 0 ? text.length() : end + 3
    }
    int i = start + 1
    while (i < text.length()) {
        String c = text.substring(i, i + 1)
        if (c == '\\') { i += 2; continue }
        if (c == quote) return i + 1
        if (c == '\n') return i
        i++
    }
    return text.length()
}

// `$name` / `${name}` / `${property("name")}` / `${libs.versions.alias.get()}` in a script literal,
// as the project answers them.
def interpolate(Project p, String literal) {
    return literal.replaceAll('\\$\\{([^}]*)\\}|\\$([A-Za-z_][A-Za-z0-9_]*)') { List<String> groups ->
        def expression = (groups[1] ?: groups[2]).trim()
        def value = propertyValue(p, expression)
        value != null ? value : groups[0]
    }
}

def propertyValue(Project p, String expression) {
    def lookup = expression =~ /^(?:(?:project|rootProject)\.)?(?:property|findProperty|properties|extra|ext)\s*[(\[]\s*["']([^"']*)["']\s*[)\]]$/
    def catalog = expression =~ /^([A-Za-z_][A-Za-z0-9_]*)\.versions\.([A-Za-z0-9_.]+)\.get\(\)$/
    try {
        if (lookup.matches()) return p.findProperty(lookup.group(1))?.toString()
        if (catalog.matches()) {
            def found = p.extensions.findByType(VersionCatalogsExtension)
                    ?.named(catalog.group(1))
                    ?.findVersion(catalog.group(2).replace('.', '-'))
            return found?.isPresent() ? found.get().toString() : null
        }
        def name = expression
        for (String prefix : ['project.', 'rootProject.', 'ext.', 'extra.']) {
            if (name.startsWith(prefix)) name = name.substring(prefix.length())
        }
        return name ==~ /[A-Za-z_][A-Za-z0-9_]*/ ? p.findProperty(name)?.toString() : null
    } catch (Throwable ignored) {
        return null
    }
}

// One property of an extension or task as JSON can carry it: a Provider's value, a file as a
// project-relative path, a collection or map of strings. A Property<Boolean> behind an isX()
// getter is read through the getter, which Groovy property syntax cannot reach.
def ruleValue(Project p, Object target, String k) {
    def v
    try {
        v = target."$k"
    } catch (Throwable missing) {
        try { v = target."is${k.capitalize()}"() } catch (Throwable ignored) { return null }
    }
    return plainValue(p, v)
}

def plainValue(Project p, Object v) {
    if (v == null) return null
    if (v instanceof org.gradle.api.provider.Provider) return plainValue(p, v.orNull)
    if (v instanceof org.gradle.api.file.FileSystemLocation) v = v.asFile
    if (v instanceof File) return relDirs(p, [v])[0]
    if (v instanceof org.gradle.api.file.FileCollection) return relDirs(p, v.files)
    if (v instanceof Boolean || v instanceof Number) return v
    if (v instanceof Map) return v.collectEntries { a, b -> [a.toString(), b?.toString()] }
    if (v instanceof Iterable) return v.collect { it instanceof File ? relDirs(p, [it])[0] : it?.toString() }
    return v.toString()
}

def relDirs(Project p, Collection dirs) {
    dirs.collect { p.projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
}

def constraintVersion(constraint) {
    try {
        def vc = constraint.versionConstraint
        if (vc.strictVersion) return vc.strictVersion
        if (vc.requiredVersion) return vc.requiredVersion
        if (vc.preferredVersion) return vc.preferredVersion
    } catch (Throwable ignored) {
    }
    return constraint.version ?: ''
}

def describeDependency(Dependency d, Project root) {
    if (d instanceof ProjectDependency) {
        def path
        try { path = d.path } catch (Throwable ignored) { path = d.dependencyProject.path }
        def r = [kind: 'project', projectPath: path]
        if (requestsTestFixtures(d)) r.fixtures = true
        return r
    }
    if (d instanceof ExternalModuleDependency) {
        def r = [kind: 'module', group: d.group ?: '', artifact: d.name, version: d.version ?: '']
        try {
            def vc = d.versionConstraint
            if (vc.strictVersion) r.strict = vc.strictVersion
            if (vc.requiredVersion) r.required = vc.requiredVersion
            if (vc.preferredVersion) r.prefer = vc.preferredVersion
        } catch (Throwable ignored) {
        }
        try {
            def category = d.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
            if (category != null) r.category = category.name
        } catch (Throwable ignored) {
        }
        if (!d.transitive) r.intransitive = true
        r.excludes = d.excludeRules.collect { (it.group ?: '*') + ':' + (it.module ?: '*') }
        if (!d.artifacts.isEmpty()) {
            def a = d.artifacts.first()
            if (a.classifier) r.classifier = a.classifier
            if (a.type && a.type != 'jar') r.type = a.type
        }
        return r
    }
    if (d instanceof FileCollectionDependency) {
        return [kind: 'files', files: d.files.collect { root.projectDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }]
    }
    return [kind: 'other', text: d.toString()]
}

// Whether `testFixtures(project(...))` wrote this edge: it requires the `test-fixtures` feature
// (capability selectors, Gradle 8.11+) or the `<name>-test-fixtures` capability (older Gradle).
def requestsTestFixtures(Dependency d) {
    try {
        if (d.metaClass.respondsTo(d, 'getCapabilitySelectors')) {
            for (def s : d.capabilitySelectors) {
                if (s.hasProperty('featureName') && s.featureName == 'test-fixtures') return true
                if (s.hasProperty('name') && s.name?.toString()?.endsWith('-test-fixtures')) return true
            }
        }
    } catch (Throwable ignored) {
    }
    try {
        return d.requestedCapabilities.any { it.name?.endsWith('-test-fixtures') }
    } catch (Throwable ignored) {
        return false
    }
}

// The declared class of a task or plugin, under the subclass Gradle decorates it with.
def taskType(Object t) {
    def type = t.class
    if (type.name.endsWith('_Decorated') && type.superclass != null) type = type.superclass
    return type.name
}

def isScriptTask(Task t) {
    if (PLUGIN_TASK_NAMES.contains(t.name)) return false
    if (PLUGIN_TASK_PREFIXES.any { t.name.startsWith(it) }) return false
    if (t.name.endsWith('Classes')) return false
    def type = taskType(t)
    if (!type.contains('.')) return true
    if (type.contains('_gradle')) return true
    return AD_HOC_TASK_TYPES.contains(type)
}
