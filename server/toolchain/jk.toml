name = "jk-toolchain"
description = "Engine toolchain: tool installs and Maven/Gradle import"

[dependencies]
jk-core.workspace = true
jk-io.workspace = true
jk-resolver.workspace = true
jk-toolchain-jdk.workspace = true
# Maven's own model builder computes the effective POM `jk import` maps: parents, BOM imports,
# dependencyManagement and property interpolation exactly as Maven would.
maven-model-builder = { group = "org.apache.maven", version = "3.9.16" }
# The workspace pins plexus-utils 4, which no longer ships Xpp3Dom; Maven 3.9 plugin configuration
# is Xpp3Dom, and plexus-xml is where it lives now.
plexus-xml = { group = "org.codehaus.plexus", version = "4.2.0" }

[processor-dependencies]
error_prone_core = { group = "com.google.errorprone", version = "2.50.0" }
nullaway = { group = "com.uber.nullaway", version = "0.14.1" }

# Nullness is enforced here: every production package is @NullMarked (JSpecify) and NullAway
# checks it at error severity, with the same flags in every enforced module so the block is one
# block. The pins are exact; `jk update` moves them and the lock follows.
[javac]
args = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW", "-Xmaxerrs", "10000"]

[javac.plugins.ErrorProne]
options = [
  "-XepDisableAllChecks",
  "-Xep:RequireExplicitNullMarking:ERROR",
  "-Xep:NullAway:ERROR",
  "-XepOpt:NullAway:OnlyNullMarked=true",
  "-XepOpt:NullAway:JSpecifyMode=true",
  # A CLI command's fields are its parsed invocation: run(Invocation) assigns them and nothing
  # reads them before it. Identical across the enforced modules so the block is one block.
  "-XepOpt:NullAway:KnownInitializers=cc.jumpkick.model.command.CliCommand.run",
]

[test-dependencies]
jk-host = { workspace = true, fixtures = true }
assertj-core = "3.27.7"
junit-jupiter = "6.1.3"
