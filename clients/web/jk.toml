name = "jk-web"
description = "Web dashboard static assets for the engine UI"

[test-dependencies]
jk-host = { workspace = true, fixtures = true }
jk-engine-api.workspace = true
assertj-core = "latest"
junit-jupiter = "latest"

[test]
# The JS tier's opt-out, forwarded from the shell that ran `jk`. A bare name means "if the caller
# has it, the test JVM gets it" — unset stays unset, which is what makes it usable as an escape
# hatch rather than something every build has to set. Declaring it is also what carries it across
# the client -> engine -> worker hop at all for names outside BuildEnv.MACHINE (PATH/HOME/… already
# seed every test JVM from the request). The engine is a daemon with its own environment, and only
# declared names beyond that machine seed ride the request into the action key.
env = ["JK_WEB_JS_SKIP"]
