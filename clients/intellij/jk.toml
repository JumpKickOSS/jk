name = "jumpkick-intellij"
description = "JumpKick for IntelliJ: an external system over the jk CLI and the engine's ide-model; never loads an engine jar"
javadoc = false   # an IDE plugin has no API to document

# The plugin compiles and tests against IntelliJ IDEA Community with the bundled Java plugin, and
# packages as the zip an IDE installs from disk. It is wire-only: no edge to any workspace module.
[intellij]
version = "262.10968.63"
plugins = ["java"]
requires = [
  "java-aetherDependencyResolver-plugin",
  "java-coverage",
  "libraries-misc-plugin",
  "platform-structuralSearch-plugin",
  "platform-structureView-plugin",
  "platform-testRunner-plugin",
  "platform-todo-plugin",
]

[repositories.jetbrains]
url = "https://www.jetbrains.com/intellij-repository/releases"
groups = ["com.jetbrains.intellij.*"]

[provided-dependencies]
jspecify = "1.0.1"

[processor-dependencies]
error_prone_core = { group = "com.google.errorprone", version = "2.50.0" }
nullaway = { group = "com.uber.nullaway", version = "0.14.2" }

# Nullness is enforced here: every production package is @NullMarked (JSpecify) and NullAway
# checks it at error severity, with the same flags in every enforced module so the block is one
# block. The pins are exact; `jk update` moves them and the lock follows.
[javac]
args = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW", "-Xmaxerrs", "10000"]

[javac.plugins.ErrorProne]
options = [
  "-XepDisableAllChecks",
  "-Xep:RequireExplicitNullMarking:ERROR",
  "-Xep:NullAway:ERROR",
  "-XepOpt:NullAway:OnlyNullMarked=true",
  "-XepOpt:NullAway:JSpecifyMode=true",
  # A CLI command's fields are its parsed invocation: run(Invocation) assigns them and nothing
  # reads them before it. Identical across the enforced modules so the block is one block.
  "-XepOpt:NullAway:KnownInitializers=cc.jumpkick.model.command.CliCommand.run",
]

[test-dependencies]
assertj-core = "3.27.7"
junit-jupiter = "6.1.3"

# The IDE-hosted tests run the jk on PATH against this checkout.
[test]
tools = ["jk"]
