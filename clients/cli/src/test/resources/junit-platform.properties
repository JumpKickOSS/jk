# ticket-1055 — JUnit 6 TempDir cleanup: retry after engine stop when hardlinks pin the tree
junit.jupiter.tempdir.deletion.strategy.default=cc.jumpkick.cli.engine.JkTempDirDeletionStrategy
# Optional factory still used for short /tmp paths on macOS
junit.jupiter.tempdir.factory.default=cc.jumpkick.cli.engine.JkTempDirFactory
# Nested-engine CAS hardlinks pin @TempDir trees under pure-jk; never fail the suite on cleanup.
junit.jupiter.tempdir.cleanup.mode.default=never
