# JUnit 6 TempDir: retry after engine stop when hardlinks pin the tree. The
# strategy already reports success if leftovers remain, so cleanup stays ALWAYS
# (the default). NEVER leaked tens of thousands of dirs on tmpfs /tmp until
# createTempDirectory failed with no inodes.
junit.jupiter.tempdir.deletion.strategy.default=cc.jumpkick.cli.engine.JkTempDirDeletionStrategy
junit.jupiter.tempdir.factory.default=cc.jumpkick.testing.ShortTempDirFactory
junit.jupiter.tempdir.cleanup.mode.default=always
