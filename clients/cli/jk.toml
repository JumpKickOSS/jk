name = "jk-cli"
description = "The CLI (and primary) client for interacting with the JumpKick build system"

[application]
main = "cc.jumpkick.cli.Jk"

[dependencies]
jk-core.workspace = true
jk-client-io.workspace = true
jk-toolchain-jdk.workspace = true
jk-engine-api.workspace = true
jk-jsonl.workspace = true
jline-terminal-ffm = "latest"

[provided-dependencies]
graalvm-nativeimage = "latest"
lombok = "latest"

[processor-dependencies]
lombok = "latest"

[test-dependencies]
jk-engine.workspace = true
assertj-core = "latest"
junit-jupiter = "latest"
bcpg-jdk18on = "latest"

[image]
main-class = "cc.jumpkick.cli.Jk"

[native]
enabled = "always"
# Installable client binary (PATH entry is `jk` / `jk.exe`), not the Maven artifact name.
name = "jk"
args = [
  "-Os",
  "--gc=serial",
  "-R:MaxHeapSize=134217728",
  "-R:MinHeapSize=25165824",
  "-H:+SharedArenaSupport",
  "--enable-native-access=ALL-UNNAMED",
  "--initialize-at-run-time=org.jline",
  "-H:ExcludeResources=org/jline/nativ/.*",
]

[test]
# Nested engines / shared sockets: integration classes materialize the resident engine and
# share its JK_HOME store, so they stay on one serial trailing worker (serial-tags) while
# the hermetic unit tier shards across workers (auto). History: the old blanket
# `workers = 1` predated per-worker JK_STATE_DIR isolation (JK-2183/JK-2184).
workers = 0
serial-tags = ["integration"]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run everything (all suites, tags included) with `jk build --all` / `jk test --all`.
exclude-tags = ["integration", "slow", "bench", "network"]
