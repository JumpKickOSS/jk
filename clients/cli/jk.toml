name = "jk-cli"
description = "The CLI (and primary) client for interacting with the JumpKick build system"

[application]
main = "cc.jumpkick.cli.Jk"
# The fat jar is the client for every host without a native binary: shipped as jk-<version>.jar
# beside the engine jar, run by the launcher `jk self write-launcher` writes (JvmClientInstall).
assembly = true

# jk installing jk: this module's native binary is the PATH client. `jk install` on the product
# tree replaces <home>/bin/jk (parking the previous one, re-linking jkx), the way a release
# update does; the engine module declares the matching `product-lib`.
[install]
product-bin = "jk"

[dependencies]
jk-model.workspace = true
jk-core.workspace = true
jk-client-io.workspace = true
jk-toolchain-jdk.workspace = true
jk-engine-api.workspace = true
jk-ide.workspace = true
jk-host.workspace = true
jk-cli-terminal.workspace = true

[provided-dependencies]
graalvm-nativeimage = "25.4.4.1.1"
lombok = "1.18.48"

[processor-dependencies]
lombok = "1.18.48"
error_prone_core = { group = "com.google.errorprone", version = "2.50.0" }
nullaway = { group = "com.uber.nullaway", version = "0.14.2" }

# Nullness is enforced here: every production package is @NullMarked (JSpecify) and NullAway
# checks it at error severity, with the same flags in every enforced module so the block is one
# block. The pins are exact; `jk update` moves them and the lock follows.
[javac]
args = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW", "-Xmaxerrs", "10000"]

[javac.plugins.ErrorProne]
options = [
  "-XepDisableAllChecks",
  "-Xep:RequireExplicitNullMarking:ERROR",
  "-Xep:NullAway:ERROR",
  "-XepOpt:NullAway:OnlyNullMarked=true",
  "-XepOpt:NullAway:JSpecifyMode=true",
  # A CLI command's fields are its parsed invocation: run(Invocation) assigns them and nothing
  # reads them before it. Identical across the enforced modules so the block is one block.
  "-XepOpt:NullAway:KnownInitializers=cc.jumpkick.model.command.CliCommand.run",
]

[test-dependencies]
jk-engine-api = { workspace = true, fixtures = true }
jk-host = { workspace = true, fixtures = true }
jk-core = { workspace = true, fixtures = true }
jk-client-io = { workspace = true, fixtures = true }
jk-resolver = { workspace = true, fixtures = true }
assertj-core = "3.27.7"
junit-jupiter = "6.1.3"
bcpg-jdk18on = "1.86"
# JkWireModel (see [test] extra-src below) imports org.jetbrains.annotations because the
# IntelliJ platform API does. jk has no test-provided scope, and an annotations-only jar on the
# test runtime classpath costs nothing.
annotations = { group = "org.jetbrains", name = "annotations", version = "26.1.0" }

[native]
enabled = "always"
# Installable client binary (PATH entry is `jk` / `jk.exe`), not the Maven artifact name.
name = "jk"
args = [
  "-Os",
  # The image launcher would otherwise swallow every -Dkey=value and -XX: token in argv before
  # main runs; jk mvn -Drevision=… and jk run -- -Dfoo=bar must reach their child intact.
  "-H:-ParseRuntimeOptions",
  "--gc=serial",
  "-R:MaxHeapSize=134217728",
  "-R:MinHeapSize=25165824",
  "--enable-native-access=ALL-UNNAMED",
  "--initialize-at-run-time=cc.jumpkick.terminal.windows.WindowsUtf8",
  # Holds the commit the build links in as -Djk.build.commit (jk --version -v, jk doctor).
  "--initialize-at-build-time=cc.jumpkick.model.BuildStamp",
]

[test]
# The harness this suite and e2e/cli share (src/fixtures/java): output capture, the isolated roots,
# a mock Maven server, the @TempDir deletion strategy, and the extension e2e/cli registers to
# materialize the engine under test into its sandbox JK_HOME. This suite runs no engine: its tests
# talk to the wire module and to stubs.
fixtures = true
# Two files out of the IntelliJ plugin's package, single-sourced from the plugin's own tree: the
# wire model and its JSON reader need no platform SDK (java.util + org.jetbrains.annotations),
# while their neighbours do — so this names the files, not the directory. Their package-info.java
# keeps the package @NullMarked in every suite; a named file brings it along, and it is named too
# because the bootstrap release that builds this tree in CI does not. Compiling them here puts the
# parallel-array alignment and null-vs-empty rules in-gate, which G22 arm 4 can only approximate
# textually.
extra-src = [
  "../intellij/src/main/java/cc/jumpkick/idea/JkWireModel.java",
  "../intellij/src/main/java/cc/jumpkick/idea/JkJson.java",
  "../intellij/src/main/java/cc/jumpkick/idea/package-info.java",
]
env = [
  # Rendered-output assertions must not depend on the terminal the developer happens to be in.
  # Unpinned, `auto` nerd-font detection inspects TERM_PROGRAM and the terminal's own config, so
  # PUA glyphs appear under Ghostty and not under Terminal.app; CI runners force TERM=dumb and
  # NO_COLOR from the other side. Tests that exercise the glyphs pass caps explicitly, so pinning
  # the ambient default off costs no coverage.
  { TERM = "xterm-256color", CI = "false", NO_COLOR = "", JK_NERD_FONT = "false" },
  # The JDK probe chain is the machine's unless narrowed. A jdk verb under test would otherwise
  # list, default to, write pointers at or uninstall the developer's own sdkman/mise/OS installs.
  { JK_JDK_PROBES = "java-home,jk" },
  # The transport e2e/cli runs its engines on, so the client's engine paths resolve here as there.
  { JK_ENGINE_TRANSPORT = "tcp" },
]
