[project]
group    = "cc.jumpkick"
name     = "jk-cli"
version  = "0.10.1"
description = "jk command-line client: verb dispatch, rendering, the thin kernel slice (Stage 5)."
jdk      = 25
java     = 25

[application]
main = "cc.jumpkick.cli.Jk"

# The slim client's whole kernel surface — NO jk-io, jk-resolver, jk-toolchain, or jk-engine
# (slim-client Stage 5 / ticket-1020): heavy verbs reach the engine over the wire.
# Integration tests under src/test spawn the real :engine shadow jar.
[dependencies]
jk-core            = { group = "cc.jumpkick", name = "jk-core",            version = "0.10.1" }
jk-client-io       = { group = "cc.jumpkick", name = "jk-client-io",       version = "0.10.1" }
jk-toolchain-jdk   = { group = "cc.jumpkick", name = "jk-toolchain-jdk",   version = "0.10.1" }
jk-engine-api      = { group = "cc.jumpkick", name = "jk-engine-api",      version = "0.10.1" }
jk-plugin-sdk      = { group = "cc.jumpkick", name = "jk-plugin-sdk",      version = "0.10.1" }
jline-terminal-ffm = { group = "org.jline",   name = "jline-terminal-ffm", version = "4.1.2" }

# ProcessProperties for argv[0] `jkx` dispatch (Argv0) — compile-time only; the
# native-image builder provides the implementation and JVM mode never loads it.
[provided-dependencies]
graalvm-nativeimage = { group = "org.graalvm.sdk", name = "nativeimage", version = "25.0.0" }

[test-dependencies]
# Mirrors Gradle testImplementation(project(":engine")) — unit tests that touch TestSupport /
# pipeline bridges need engine types; production classpath stays engine-free (ticket-1020).
jk-engine               = { group = "cc.jumpkick", name = "jk-engine", version = "0.10.1" }
assertj-core            = { group = "org.assertj",        name = "assertj-core",            version = "3.27.7" }
junit-jupiter           = { group = "org.junit.jupiter",  name = "junit-jupiter",           version = "6.1.0" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.0" }
bcpg-jdk18on            = { group = "org.bouncycastle",   name = "bcpg-jdk18on",            version = "1.84" }

[image]
main-class = "cc.jumpkick.cli.Jk"

# Opt-in so `jk native` / workspace cascade actually run native-image (not just compile).
[native]
always = true

# Nested engines / shared sockets: keep within-module tests serial (Mill testParallelism=false).
[test]
workers = 1
# Parity with Gradle's `test` task, which is explicitly scoped to unit/fast (<5 min) and excludes
# these tags — the integration/slow/bench suites are long-running, network- and SDK-dependent, and
# Gradle gives them separate tasks. Self-host ran them unconditionally, so `jk build` was enforcing a
# stricter contract than CI ever has. Override per-run with `--exclude-tag` / `--include-tag`.
default-exclude-tags = ["integration", "slow", "bench"]
