name = "jk-cli"
description = "The CLI (and primary) client for interacting with the JumpKick build system"

[application]
main = "cc.jumpkick.cli.Jk"

[dependencies]
jk-model.workspace = true
jk-core.workspace = true
jk-client-io.workspace = true
jk-toolchain-jdk.workspace = true
jk-engine-api.workspace = true
jk-ide.workspace = true
jk-host.workspace = true
jk-cli-terminal.workspace = true

[provided-dependencies]
graalvm-nativeimage = "latest"
lombok = "latest"

[processor-dependencies]
lombok = "latest"
error_prone_core = { group = "com.google.errorprone", version = "latest" }
nullaway = { group = "com.uber.nullaway", version = "latest" }

# Nullness is enforced here: every production package is @NullMarked (JSpecify) and NullAway
# checks it at error severity, the same flags the Gradle convention `jk.nullmarked-conventions`
# passes, so a regression is red under both builds. The pins are `latest`; the catalog-lock
# check keeps them equal to gradle/libs.versions.toml.
[javac]
args = ["-XDcompilePolicy=simple", "--should-stop=ifError=FLOW", "-Xmaxerrs", "10000"]

[javac.plugins.ErrorProne]
options = [
  "-XepDisableAllChecks",
  "-Xep:RequireExplicitNullMarking:ERROR",
  "-Xep:NullAway:ERROR",
  "-XepOpt:NullAway:OnlyNullMarked=true",
  "-XepOpt:NullAway:JSpecifyMode=true",
  # A CLI command's fields are its parsed invocation: run(Invocation) assigns them and nothing
  # reads them before it. Identical across the enforced modules so the block is one block.
  "-XepOpt:NullAway:KnownInitializers=cc.jumpkick.model.command.CliCommand.run",
]

[test-dependencies]
jk-host = { workspace = true, fixtures = true }
jk-core = { workspace = true, fixtures = true }
jk-engine.workspace = true
assertj-core = "latest"
junit-jupiter = "latest"
bcpg-jdk18on = "latest"
# JkWireModel (see [test] extra-src below) imports org.jetbrains.annotations because the
# IntelliJ platform API does. Gradle spells this testCompileOnly; jk has no test-provided
# scope, and an annotations-only jar on the test runtime classpath costs nothing.
annotations = { group = "org.jetbrains", name = "annotations", version = "latest" }

[image]
main-class = "cc.jumpkick.cli.Jk"

[native]
enabled = "always"
# Installable client binary (PATH entry is `jk` / `jk.exe`), not the Maven artifact name.
name = "jk"
args = [
  "-Os",
  "--gc=serial",
  "-R:MaxHeapSize=134217728",
  "-R:MinHeapSize=25165824",
  "--enable-native-access=ALL-UNNAMED",
  "--initialize-at-run-time=cc.jumpkick.terminal.windows.WindowsUtf8",
]

[build]
# Each entry is a hard build-order edge AND a -D<worker>.plugin.jar handed to the test JVM, so an
# integration class that builds a fixture runs the workers THIS build produced rather than
# whatever a store happens to hold. Gradle's integrationTest does the same thing by hand
# (`systemProperty("jk.<x>.plugin.jar", ...)` plus a worker-repo copy into the sandbox store);
# this is that list, declared once, on the jk side.
#
# Without it the sandbox JK_HOME has no store and no override, so a fixture whose lock pins a
# freshly built first-party plugin cannot resolve it at all — green under Gradle, red under jk,
# and only for the one test that declares a `[spring-boot]` table.
#
# Keep this to workers the CLI's own test JVM actually locates: an unused name is a build-order
# edge and a stamp input for nothing, and re-runs this suite on an unrelated plugin edit.
test-plugin-jars = [
  "test-runner",
  "java-compiler",
  "kotlin-compiler",
  "groovy-compiler",
  "spring-boot",
]

[test]
# One file out of the IntelliJ plugin's package, single-sourced from the plugin's own tree: the
# wire parser needs no platform SDK (java.util + regex + org.jetbrains.annotations), while its
# five neighbours do — so this names the file, not the directory. Compiling it here puts the
# parallel-array alignment and null-vs-empty rules in-gate, which G22 arm 4 can only approximate
# textually. Gradle does the same thing by Sync-ing the file into a generated source dir.
extra-src = ["../intellij/src/main/java/cc/jumpkick/idea/JkWireModel.java"]
# Nested engines / shared sockets: integration classes materialize the resident engine and
# share its JK_HOME store, so they stay on one serial trailing worker (serial-tags) while
# the hermetic unit tier shards across this build's auto share of workers.
serial-tags = ["integration"]
# Exclude the long-running tests for our day-to-day usage.
# Normal `jk test` should finish in 5 min or less.
# Run everything (all suites, tags included) with `jk build --all` / `jk test --all`.
exclude-tags = ["integration", "slow", "bench", "network"]
env = [
  # Rendered-output assertions must not depend on the terminal the developer happens to be in.
  # Unpinned, `auto` nerd-font detection inspects TERM_PROGRAM and the terminal's own config, so
  # PUA glyphs appear under Ghostty and not under Terminal.app; CI runners force TERM=dumb and
  # NO_COLOR from the other side. Tests that exercise the glyphs pass caps explicitly, so pinning
  # the ambient default off costs no coverage.
  { TERM = "xterm-256color", CI = "false", NO_COLOR = "", JK_NERD_FONT = "false" },
  # An in-process engine under test shares the module's sandbox JK_HOME store, and the resident
  # engine queues a cache GC on startup when idle — which races any fixture staging prune-eligible
  # files for its own explicit prune request. Explicit `jk cache prune` is unaffected.
  { JK_AUTO_PRUNE = "false" },
  # The JDK probe chain is the machine's unless narrowed. A jdk verb under test would otherwise
  # list, default to, write pointers at or uninstall the developer's own sdkman/mise/OS installs.
  { JK_JDK_PROBES = "java-home,jk" },
  # Loopback TCP for the tier that spawns real engines — the same switch Gradle's integrationTest
  # sets, for the same two reasons: a TCP port has no `sun_path` budget, so no sandbox path can be
  # too long to bind; and Windows stops being the only platform that exercises this lane.
  { JK_ENGINE_TRANSPORT = "tcp" },
]
