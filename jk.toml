group = "cc.jumpkick"
name = "jk"
version = "0.50.4"
description = "JumpKick: the JVM build system built for coding agents"
java = 25

# `jk guard` formats every source that changed before it builds, so no commit carries unformatted code.
[format]
enforce = true

# The installers refuse a pointer older than their floor, so the floor is the version being released:
# `jk release` moves these with jk.toml.
[release]
files = [
    { path = "install.sh", pattern = 'RELEASE_FLOOR="([^"]+)"' },
    { path = "hosting/public/install.sh", pattern = 'RELEASE_FLOOR="([^"]+)"' },
    { path = "install.ps1", pattern = '\$ReleaseFloor = "([^"]+)"' },
    { path = "hosting/public/install.ps1", pattern = '\$ReleaseFloor = "([^"]+)"' },
]

# jk's own modules install to jk's private repository: the engine launches its workers from there.
[install]
destination = "jk"

# The POM metadata every published member carries; Maven Central refuses a POM without it.
[publish]
url = "https://jumpkick.build"
licenses = [{ name = "Apache-2.0", url = "https://www.apache.org/licenses/LICENSE-2.0" }]
developers = [{ id = "bsant", name = "Bryan Sant" }]
scm = { url = "https://github.com/JumpKickOSS/jk", connection = "scm:git:https://github.com/JumpKickOSS/jk.git", developer-connection = "scm:git:ssh://git@github.com/JumpKickOSS/jk.git" }

# Versions a dependency's own graph pins below an advisory fix. Nothing here declares these
# directly; every edge onto them takes the version below. `jk audit --severity HIGH` is clean.
[managed-dependencies]
jackson-core = { group = "com.fasterxml.jackson.core", version = "2.22.4" }
jackson-databind = { group = "com.fasterxml.jackson.core", version = "2.22.4" }
jackson-datatype-jsr310 = { group = "com.fasterxml.jackson.datatype", version = "2.22.4" }
httpcore5 = { group = "org.apache.httpcomponents.core5", version = "5.4.4" }
httpcore5-h2 = { group = "org.apache.httpcomponents.core5", version = "5.4.4" }
httpclient5 = { group = "org.apache.httpcomponents.client5", version = "5.6.5" }
plexus-utils = { group = "org.codehaus.plexus", version = "4.1.0" }
guava = { group = "com.google.guava", version = "33.8.0-jre" }

[workspace]
modules = [
  # Shared Libraries
  "shared/host",
  "shared/plugin-sdk",
  "shared/jk-api",
  "shared/core",
  "shared/client-io",
  "shared/dynamic-surface",
  "shared/guard-api",
  "shared/code-graph",
  # Server/Engine
  "server/io",
  "server/resolver",
  "shared/toolchain-jdk",
  "server/toolchain",
  "shared/wire",
  "shared/ide",
  "server/guard",
  "server/engine",
  # Rule packs (cc.jumpkick.guards:*) — live under server/guard/packs/
  "server/guard/packs/spring",
  "server/guard/packs/quarkus",
  "server/guard/packs/helidon",
  "server/guard/packs/android",
  "server/guard/packs/library",
  "server/guard/packs/monorepo",
  # Clients
  "clients/cli",
  "clients/cli-terminal",
  "clients/web",
  # The IntelliJ plugin, built by the [intellij] battery; wire-only, never sees a jk jar
  "clients/intellij",
  # A Maven core extension jk mvn attaches to the user's Maven; not a jk plugin
  "clients/maven-spy",
  # Plugins/Workers
  "plugins/test-runner",
  "plugins/java-compiler",
  "plugins/kotlin-compiler",
  "plugins/groovy-compiler",
  "plugins/auditor",
  "plugins/publisher",
  "plugins/image-builder",
  "plugins/minified",
  "plugins/formatter",
  "plugins/spring-boot",
  "plugins/quarkus",
  "plugins/grails",
  "plugins/protobuf",
  "plugins/generator",
  "plugins/openapi",
  "plugins/localizer",
  "plugins/antlr",
  "plugins/taglib",
  "plugins/jenkins-test",
  "plugins/avro",
  "plugins/schema-registry",
  "plugins/json-schema",
  "plugins/jaxb",
  "plugins/jooq",
  "plugins/lint",
  "plugins/android",
  "plugins/micronaut",
  "plugins/hibernate",
  "plugins/intellij",
  "plugins/javafx",
  "plugins/helidon",
  "plugins/graph",
]

# ---------------------------------------------------------------------------
# Test tiers: one tier per tag, and this table is what says which.
#
# A `@Tag` is a routing decision — it moves a test out of the fast tier and into some
# other run. The routing has to live in exactly one place or a tag ends up excluded by
# the baseline and included by nothing, which is a test that never executes and never
# goes red.
#
# This is that place. `[test] exclude-tags` is the fast tier; each profile below is one
# slow tier. The engine's `tiers` validation (G23) re-derives the partition from this
# table and proves, over every subset of the vocabulary, that each is run by exactly one
# tier — so the routing and the check cannot drift.
#
# Suites are scope, tags are cost: every slow tier sets `all-suites = true`, so its tag runs in
# every suite a module has (src/test, and src/e2e where there is one). The fast tier runs src/test
# alone, so a test outside it carries a tier's tag or runs only under `-s <suite>` / `--all`.
#
#   jk test                        fast tier, untagged only. The merge gate.
#   jk test -p integration         engine / e2e / worker suites. The push gate.
#   jk test -p slow                framework and language e2e. Nightly, never gating.
#   jk test -p network             talks to a real remote. Nightly, never gating.
#   jk test -p release             a real browser or other cost worth paying once per release. CI on the tag.
#   jk test -p live                talks to this machine's own services (the OS keychain). On demand.
#   jk test -p bench               microbenchmarks. On demand, gates nothing.
#   jk test --all                  everything, every suite, no tag filter.
# ---------------------------------------------------------------------------
[test]
exclude-tags = ["integration", "slow", "network", "release", "live", "bench"]
# Every member's fast tier: a method slower than this is a warning naming it. The slowest fast
# methods take under 2.5s alone; a method that needs more belongs in a slower tier.
fast-method-budget = "5s"

# The documented push gate, run before pushing main. Walled off from the release site:
# a test that needs a published jk release is a `network` test, since the version under test is not
# published until it ships.
#
# A hung test fails instead of stalling the gate: every test and lifecycle method stops at 5m, five
# times the slowest integration method on a loaded host (about 1m), and well inside the worker's
# 10m idle watchdog. The method runs on a separate thread, so the failure is reported even when the
# hang ignores interrupts (a blocking read); the thread dump printed first names where it hung.
# An explicit @Timeout keeps its own value.
[profiles.integration]
include-tags = ["integration"]
exclude-tags = ["slow", "network", "release", "live", "bench"]
all-suites = true
env = { JK_HTTP_DENY_HOSTS = "jumpkick.build" }
jvm-args = [
  "-Djunit.jupiter.execution.timeout.default=5m",
  "-Djunit.jupiter.execution.timeout.thread.mode.default=SEPARATE_THREAD",
  "-Djunit.jupiter.execution.timeout.threaddump.enabled=true",
]

# Framework / language end-to-end: does an Android / Grails / Scala / KSP / Protobuf
# project still build all the way through. Off the gate — what it asserts breaks when a
# plugin or a toolchain moves, not when the change under review does.
[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["network", "release", "live", "bench"]
all-suites = true

# Talks to a real remote. Off the gate: Maven Central enforces a per-IP quota, so a gate
# that needs the network fails for reasons the change did not cause.
[profiles.network]
include-tags = ["network"]
exclude-tags = ["release", "live", "bench"]
all-suites = true

# Once per release: CI's self-host job runs it on the release tag, after the fast tier and the
# curated lane, so a red run stops the release. For a test too slow or too heavy for every push
# that a release must still pass, such as the dashboard driven in a real browser. It may fetch.
[profiles.release]
include-tags = ["release"]
exclude-tags = ["live", "bench"]
all-suites = true

# Talks to a service of the machine it runs on and writes to it: the user's OS keychain, or a
# private gpg-agent it starts in a scratch GNUPGHOME and stops. Off every gate and every CI run,
# which have no desktop session; on demand on a desktop. The env entries are each live test's own
# opt-in, so `jk test --all` leaves the user's keychain alone.
[profiles.live]
include-tags = ["live"]
exclude-tags = ["bench"]
all-suites = true
env = { JK_TEST_SECRET_SERVICE = "1", JK_TEST_GPG_AGENT = "1" }

# Microbenchmarks print medians and assert nothing about deltas, so gating on them would
# gate on CI noise. They still need a tier, or nothing runs them at all.
[profiles.bench]
include-tags = ["bench"]
exclude-tags = []
all-suites = true

# Auto-selected when CI is set. CI runs the fast tier with the same filters as a
# developer's `jk test`; the slow tiers are separate scheduled runs, by profile name.
[profiles.ci]
exclude-tags = ["integration", "slow", "network", "release", "live", "bench"]
