catalog = "bundled"

[project]
group    = "cc.jumpkick"
name     = "jk"
version  = "0.11.0"
description = "JumpKick - the best damn build tool for the JVM"
java     = 25

[workspace]
modules = [
  # Shared Libraries
  "shared/plugin-sdk",
  "shared/jk-api",
  "shared/core",
  "shared/client-io",
  "shared/dynamic-surface",
  # Server/Engine
  "server/io",
  "server/resolver",
  "shared/toolchain-jdk",
  "server/toolchain",
  "shared/wire",
  "server/engine",
  # Clients
  "clients/cli",
  "clients/web",
  # Plugins/Workers
  "plugins/test-runner",
  "plugins/java-compiler",
  "plugins/kotlin-compiler",
  "plugins/groovy-compiler",
  "plugins/auditor",
  "plugins/publisher",
  "plugins/image-builder",
  "plugins/compat-bridge",
  "plugins/minified",
  "plugins/formatter",
  "plugins/spring-boot",
  "plugins/quarkus",
  "plugins/grails",
  "plugins/protobuf",
  "plugins/android",
]
