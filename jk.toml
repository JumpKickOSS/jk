# Self-host guard (JK-1443): short names resolve from the bundled catalog only,
# immune to ~/.jk/libs.toml and the downloaded registry mirror.
catalog = "bundled"

[project]
group    = "cc.jumpkick"
name     = "jk"
version  = "0.11.0"
description = "JumpKick - the modern build tool for the JVM"
jdk      = 25
java     = 25

# Explicit baseline remotes (also the product default after F6). Google hosts apksig / AndroidX / R8.
[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"

# Module order is declaration preference only; build order is dependency-first.
# First-party workers are workspace modules with assembly + PluginMain.
[workspace]
modules = [
  # Shared Libraries
  "shared/plugin-sdk",
  "shared/jk-api",
  "shared/core",
  "shared/client-io",
  # Server/Engine
  "server/io",
  "server/resolver",
  "shared/toolchain-jdk",
  "server/toolchain",
  "shared/wire",
  "server/engine",
  # Clients
  "clients/cli",
  "clients/web",
  # Plugins/Workers
  "plugins/test-runner",
  "plugins/java-compiler",
  "plugins/kotlin-compiler",
  "plugins/groovy-compiler",
  "plugins/auditor",
  "plugins/publisher",
  "plugins/image-builder",
  "plugins/compat-bridge",
  "plugins/shrink",
  "plugins/formatter",
  "plugins/spring-boot",
  "plugins/quarkus",
  "plugins/grails",
  "plugins/protobuf",
  "plugins/android",
]
