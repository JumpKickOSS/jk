group = "cc.jumpkick"
name = "jk"
version = "0.60.1"
description = "JumpKick: the JVM build system built for coding agents"
java = 25

# `jk guard` formats every source that changed before it builds, so no commit carries unformatted code.
[format]
enforce = true

# The installers refuse a pointer older than their floor, so the floor is the version being released:
# `jk release` moves these with jk.toml.
[release]
files = [
    { path = "install.sh", pattern = 'RELEASE_FLOOR="([^"]+)"' },
    { path = "hosting/public/install.sh", pattern = 'RELEASE_FLOOR="([^"]+)"' },
    { path = "install.ps1", pattern = '\$ReleaseFloor = "([^"]+)"' },
    { path = "hosting/public/install.ps1", pattern = '\$ReleaseFloor = "([^"]+)"' },
]

# jk's own suites keep to the allow-list and the names each module declares, as every suite did before
# 0.53: they must not reach the developer's real shell (tokens, JK_* overrides of the real home), and the
# hermeticity guards (TestEnvRules, HermeticReads, the sandboxed homes) assume it. Written false, inherit is
# that strict switch; set here, it holds for every member.
[env]
inherit = false

# jk's own modules install to jk's private repository: the engine launches its workers from there.
[install]
destination = "jk"

# The POM metadata every published member carries; Maven Central refuses a POM without it.
[publish]
url = "https://jumpkick.build"
licenses = [{ name = "Apache-2.0", url = "https://www.apache.org/licenses/LICENSE-2.0" }]
developers = [{ id = "bsant", name = "Bryan Sant" }]
scm = { url = "https://github.com/JumpKickOSS/jk", connection = "scm:git:https://github.com/JumpKickOSS/jk.git", developer-connection = "scm:git:ssh://git@github.com/JumpKickOSS/jk.git" }

# Versions a dependency's own graph pins below an advisory fix. Nothing here declares these
# directly; every edge onto them takes the version below. `jk audit --severity HIGH` is clean.
[managed-dependencies]
jackson-core = { group = "com.fasterxml.jackson.core", version = "2.22.4" }
jackson-databind = { group = "com.fasterxml.jackson.core", version = "2.22.4" }
jackson-datatype-jsr310 = { group = "com.fasterxml.jackson.datatype", version = "2.22.4" }
tools-jackson-core = { group = "tools.jackson.core", name = "jackson-core", version = "3.1.7" }
tools-jackson-databind = { group = "tools.jackson.core", name = "jackson-databind", version = "3.1.7" }
httpcore5 = { group = "org.apache.httpcomponents.core5", version = "5.4.4" }
httpcore5-h2 = { group = "org.apache.httpcomponents.core5", version = "5.4.4" }
httpclient5 = { group = "org.apache.httpcomponents.client5", version = "5.6.5" }
plexus-utils = { group = "org.codehaus.plexus", version = "4.1.0" }
guava = { group = "com.google.guava", version = "33.8.0-jre" }

[workspace]
modules = [
  # Shared Libraries
  "shared/host",
  "shared/plugin-sdk",
  "shared/jk-api",
  "shared/core",
  "shared/client-io",
  "shared/dynamic-surface",
  "shared/guard-api",
  "shared/code-graph",
  "shared/sigstore",
  # Server/Engine
  "server/io",
  "server/resolver",
  "shared/toolchain-jdk",
  "server/toolchain",
  "shared/wire",
  "shared/ide",
  "server/guard",
  "server/test-orchestrator",
  "server/engine",
  # Rule packs (cc.jumpkick.guards:*) — live under server/guard/packs/
  "server/guard/packs/spring",
  "server/guard/packs/quarkus",
  "server/guard/packs/helidon",
  "server/guard/packs/android",
  "server/guard/packs/library",
  "server/guard/packs/monorepo",
  # Clients
  "clients/cli",
  "clients/cli-terminal",
  "clients/web",
  # The IntelliJ plugin, built by the [intellij] battery; wire-only, never sees a jk jar
  "clients/intellij",
  # A Maven core extension jk mvn attaches to the user's Maven; not a jk plugin
  "clients/maven-spy",
  # The CLI driven against a real engine; tests only
  "e2e/cli",
  # Plugins/Workers
  "plugins/test-runner",
  "plugins/java-compiler",
  "plugins/kotlin-compiler",
  "plugins/groovy-compiler",
  "plugins/auditor",
  "plugins/publisher",
  "plugins/image-builder",
  "plugins/minified",
  "plugins/formatter",
  "plugins/spring-boot",
  "plugins/quarkus",
  "plugins/grails",
  "plugins/protobuf",
  "plugins/generator",
  "plugins/openapi",
  "plugins/localizer",
  "plugins/antlr",
  "plugins/taglib",
  "plugins/jenkins-test",
  "plugins/avro",
  "plugins/schema-registry",
  "plugins/json-schema",
  "plugins/asyncapi",
  "plugins/jaxb",
  "plugins/jooq",
  "plugins/lint",
  "plugins/android",
  "plugins/micronaut",
  "plugins/hibernate",
  "plugins/intellij",
  "plugins/javafx",
  "plugins/helidon",
  "plugins/graph",
  # End-to-end tests that build through the plugins above
  "e2e/engine",
]

# ---------------------------------------------------------------------------
# Test tiers: one suite per tag, and these tables are what say which.
#
# A `@Tag` is a routing decision: it moves a test out of the fast tier (the default suite, which
# keeps what no suite claims) and into the suite that claims the tag. The routing has to live in
# exactly one place or a tag ends up claimed by two suites or left to none, which is a test that
# runs twice or never. Members inherit these tables, so this is that place.
#
# The engine's `tiers` validation (G23) re-derives the partition from these tables and proves,
# over every subset of the vocabulary, that each is run by exactly one suite; a test with two
# tier tags runs in the suite whose `exclude-tags` does not name the other.
#
# Tags are cost, not place: a suite that claims a tag takes its tests from every test source of a
# module (src/test, and src/e2e where there is one).
#
#   jk test                fast tier: the default suite, what no suite claims. `jk install` and
#                          every CI run run it.
#   jk test -g             test + integration + e2e + tree (guard-suites); `jk install -g`.
#   jk test -s docs        tests that scan the doc tree. CI runs it on its own, so what it reads
#                          is recorded apart from the other suites.
#   jk test -s tree        tests that scan every module's sources. Every CI run.
#   jk test -s slow        framework and language e2e. Nightly, never gating.
#   jk test -s network     talks to a real remote. Nightly, never gating.
#   jk test -s release     a real browser, or an end-to-end too slow for the fast tier. Every CI
#                          run.
#   jk test -s live        talks to this machine's own services (the OS keychain). On demand.
#   jk test -s bench       microbenchmarks. On demand, gates nothing.
#   jk test --all          every suite but live and bench (explicit).
# ---------------------------------------------------------------------------
[test]
guard-suites = ["test", "integration", "e2e", "tree"]
# Every member's fast tier: a method slower than this is a warning naming it. The slowest fast
# methods take under 2.5s alone; a method that needs more belongs in a slower tier.
fast-method-budget = "5s"
# A suite reruns only the classes whose cone or reads moved since they last passed; the rest replay
# their verdict (docs/contributors/per-class-tests.md). The pinned bootstrap release refuses the
# value, so CI builds the tree with the bridge .jk/ci/ci-bootstrap-reader names.
cache = "cone"

# The merge queue runs all of it before main moves; a pull request runs the curated lane
# (curated-integration.txt). Walled off from the release site: a test that
# needs a published jk release is a `network` test, since the version under test is not published
# until it ships.
#
# A hung test fails instead of stalling the run: every test and lifecycle method stops at 5m, five
# times the slowest integration method on a loaded host (about 1m), and well inside the worker's
# 10m idle watchdog. The method runs on a separate thread, so the failure is reported even when the
# hang ignores interrupts (a blocking read); the thread dump printed first names where it hung.
# An explicit @Timeout keeps its own value.
[test.suites.integration]
tags = ["integration"]
exclude-tags = ["slow", "network", "release", "live", "bench"]
timeout = "5m"
env = { JK_HTTP_DENY_HOSTS = "jumpkick.build" }

# The tests that scan the doc tree (every page under docs/, the root Markdown): what they read is
# the doc tree itself. A test that reads a few named docs stays where it is.
# Off guard-suites: a run of several suites records their reads as one, so it runs alone.
[test.suites.docs]
tags = ["docs"]
exclude-tags = ["integration", "slow", "network", "release", "live", "bench"]

# The tests that scan every module's production sources (a catalog no reader may bypass, a helper
# with one owner): what they read is the whole tree, so in a module's default suite they would key
# it on every source file, and an edit anywhere would re-run that module's whole fast tier. Here an
# edit re-runs only them. A test with the docs tag as well runs with the docs suite.
[test.suites.tree]
tags = ["tree"]
exclude-tags = ["docs", "integration", "slow", "network", "release", "live", "bench"]

# Framework / language end-to-end: does an Android / Grails / Scala / KSP / Protobuf
# project still build all the way through. Off the gate: what it asserts breaks when a
# plugin or a toolchain moves, not when the change under review does.
[test.suites.slow]
tags = ["slow"]
exclude-tags = ["network", "release", "live", "bench"]

# Talks to a real remote. Off the gate: Maven Central enforces a per-IP quota, so a gate
# that needs the network fails for reasons the change did not cause.
[test.suites.network]
tags = ["network"]
exclude-tags = ["release", "live", "bench"]

# Out of the fast tier; CI's self-host job runs it on every pull request, merge-queue group and
# release tag, after the fast tier and the curated lane. For a test too slow or too heavy for the
# fast tier that a release must still pass: the dashboard
# driven in a real browser, the Helidon scaffolds served end to end, publish and release against a
# local repository, the cross-host key proof, the forecast-against-run matrix. It may fetch.
[test.suites.release]
tags = ["release"]
exclude-tags = ["live", "bench"]

# Talks to a service of the machine it runs on and writes to it: the user's OS keychain, or a
# private gpg-agent it starts in a scratch GNUPGHOME and stops. Off every gate and every CI run,
# which have no desktop session; on demand on a desktop. The env entries are each live test's own
# opt-in, and the suite runs only when named, so `jk test --all` leaves the user's keychain alone.
# JK_KEYCHAIN_SANDBOX = "off" lifts the sandbox keychain every other test JVM gets: here alone a
# backend over the real keychain answers, and each live test touches only items it created.
[test.suites.live]
tags = ["live"]
exclude-tags = ["bench"]
explicit = true
env = { JK_TEST_SECRET_SERVICE = "1", JK_TEST_GPG_AGENT = "1", JK_KEYCHAIN_SANDBOX = "off" }

# Microbenchmarks print medians and assert nothing about deltas, so gating on them would
# gate on CI noise. They still need a tier, or nothing runs them at all.
[test.suites.bench]
tags = ["bench"]
explicit = true
