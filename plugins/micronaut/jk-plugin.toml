# Built-in Micronaut 5.x plugin.
# Declarative: BOM. Worker: micronaut-aot step. Packaging: assembly fat jar.
# Giter8 trees: src/main/resources/templates/<lang>/<framework>/<name>.g8/.

[plugin]
id        = "micronaut"
table     = "micronaut"
version   = "1.0.0"
jk-compat = ">=0.10"

[code]
worker          = "jk-micronaut"
protocol-prefix = "##JKMN:"

[schema]
version     = { type = "string", required = true, example = "5.1.0", hint = "micronaut-platform version — a release such as 5.1.0 (exact), ^5 for the newest 5.x, or latest" }
aot         = { type = "bool" }  # tri-state: absent = auto (on when [native] is declared)
aot-runtime = { type = "string", example = "native", hint = "jit or native; unset follows the project — native when [native] is declared, else jit" }
aot-package = { type = "string", example = "com.example.aot.generated", hint = "Java package for AOT-generated classes; default is project.group + .aot.generated" }
aot-config  = { type = "string", example = "aot.properties", hint = "module-relative path to an aot.properties. Leave the key out to use ./aot.properties if present, else jk's defaults; setting it to a path that does not exist is an error" }
# Tooling line for micronaut-aot-{api,cli,std-optimizers}. Tracked separately from the platform BOM.
aot-version = { type = "string", default = "3.1.0", example = "3.1.0", hint = "Micronaut AOT tooling version (cli/api/std-optimizers)" }

# Platform BOM so micronaut-* deps are versionless under [dependencies].
[[contribute.platform-dependency]]
coordinate = "io.micronaut.platform:micronaut-platform:${config.version}"

# Micronaut DI / HTTP use parameter names.
[[contribute.compiler-args]]
javac  = ["-parameters"]
kotlin = ["-java-parameters"]

# AOT tool classpath: cli + api + std-optimizers. Fetched by the micronaut-aot step, which is
# registered only when AOT is on — with AOT off no step exists, so nothing is fetched.
[[contribute.step-dependency]]
artifact   = "micronaut-aot-cli"
coordinate = "io.micronaut.aot:micronaut-aot-cli:${config.aot-version}"
with       = [
  "io.micronaut.aot:micronaut-aot-api:${config.aot-version}",
  "io.micronaut.aot:micronaut-aot-std-optimizers:${config.aot-version}",
]
transitive = true

# ---- native-image: class-initialization policy the framework needs.
# Reachability metadata cannot express which types may be initialized while the image is built,
# and the GraalVM metadata repository carries none of it (checked: zero initialize-at entries in
# the whole 1.1.4 repository). Netty and Micronaut publish some in their own jars'
# native-image.properties, which native-image reads off the classpath; what remains is what a
# framework build plugin supplies.
#
# Harvested from io.micronaut.gradle:micronaut-graalvm-plugin 5.0.2 rather than derived from
# failures. `[native] args` still overrides any of it.
[[contribute.native-args]]
when = { native-declared = true }
args = [
  # Netty: whole packages to run time. Anything eagerly initialised here captures allocators,
  # event loops and resolved addresses into the image heap.
  "--initialize-at-run-time=io.netty.bootstrap",
  "--initialize-at-run-time=io.netty.buffer",
  "--initialize-at-run-time=io.netty.channel",
  "--initialize-at-run-time=io.netty.handler",
  "--initialize-at-run-time=io.netty.resolver",
  "--initialize-at-run-time=io.netty.util",
  "--initialize-at-run-time=io.netty.channel.unix.Errors",
  "--initialize-at-run-time=io.netty.channel.unix.IovArray",
  "--initialize-at-run-time=io.netty.channel.unix.Limits",
  # Micronaut's generated service-discovery interceptors are the exception: they must exist by
  # the time the heap is written.
  "--initialize-at-build-time=io.micronaut.http.server.netty.discovery.$NettyServiceDiscovery$ApplicationEventListener$onStart1$Intercepted$Definition$Exec",
  "--initialize-at-build-time=io.micronaut.http.server.netty.discovery.$NettyServiceDiscovery$ApplicationEventListener$onStop2$Intercepted$Definition$Exec",
  # AOT's reactive-types optimizer emits a loader holding this; it has to exist by the time the
  # image heap is written.
  "--initialize-at-build-time=io.micronaut.core.async.publisher",
  # Logback ships no native-image.properties of its own; its context initialises eagerly.
  "--initialize-at-build-time=ch.qos.logback,org.slf4j",
]

