name = "jk-publisher"
description = "JumpKick's Maven publish plugin"

[dependencies]
jk-core.workspace = true
jk-io.workspace = true
jk-plugin-sdk.workspace = true
bcpg-jdk18on = "latest"
sigstore-java = "latest"

[test-dependencies]
# `kind = "tests"` reaches jk-core's test classes, where SessionBoundary lives — the
# process-static session boundary this suite is bounded by (JK-1010). Never in a main jar.
jk-core = { workspace = true, kind = "tests" }
assertj-core = "latest"
junit-jupiter = "latest"
