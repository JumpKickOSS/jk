language = "java"
framework = "helidon"
name = "declarative"
description = "Helidon Declarative: the quickstart's /greet service as an annotated endpoint wired by the service registry, on Helidon 27 and JDK 27"
layouts = ["traditional", "simple"]

# The quickstart's questions (helidon/quickstart) with the same defaults, and generate_main, the
# [helidon] key generate-main (a template property cannot hold "-"). Helidon's archetypes have no
# Declarative application type, so this template follows Helidon's inject quickstart and its
# Declarative examples. HelidonArchetypeOptionsTest diffs both templates' questions against the
# archetype's inputs.

[[ask]]
key = "media"
label = "JSON library"
help = "What /greet reads and writes JSON with"
kind = "choice"
options = [
  { id = "jsonp", label = "JSON-P", help = "Jakarta JSON Processing (helidon-http-media-jsonp), the archetype's choice for SE" },
  { id = "json", label = "Helidon JSON", help = "Helidon's own JSON (helidon-http-media-json), a preview API in 27" },
]
default = "jsonp"

[[ask]]
key = "metrics"
label = "Metrics"
help = "Serve /observe/metrics with the built-in system meters"
kind = "bool"
default = true

[[ask]]
key = "health"
label = "Health checks"
help = "Serve /observe/health with the built-in checks"
kind = "bool"
default = true

[[ask]]
key = "tracing"
label = "Tracing"
help = "OpenTelemetry tracing, with a /traced endpoint that opens its own span"
kind = "bool"
default = false

[[ask]]
key = "docker"
label = "Container image"
help = "jk image builds an OCI image of target/<name>.jar and target/libs/, in place of Helidon's Dockerfile"
kind = "bool"
default = true

[[ask]]
key = "jlink"
label = "Runtime image (jlink)"
help = "jk build also links target/<name>-jri/ with an AOT cache, in place of Helidon's jlink-image profile"
kind = "bool"
default = false

[[ask]]
key = "k8s"
label = "Kubernetes manifest"
help = "app.yaml: a Service and a Deployment of the application's image"
kind = "bool"
default = true

[[ask]]
key = "generate_main"
label = "Generate ApplicationMain"
help = "[helidon] generate-main: the binding step also writes ApplicationMain, a start with no reflection"
kind = "bool"
default = false
advanced = true
