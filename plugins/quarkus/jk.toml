# Self-host guard (JK-1443): short names resolve from the bundled catalog only,
# immune to ~/.jk/libs.toml and the downloaded registry mirror.
catalog = "bundled"

[project]
name    = "jk-quarkus"

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"

[dependencies]
jk-plugin-sdk.workspace = true

# Compile against the bootstrap APIs only; at runtime the engine supplies these on the forked
# worker CP as step-dependency jars (quarkus-bootstrap + maven-resolver + aligned smallrye-common),
# so they must not be shaded into the assembly.
# Keep in sync with cc.jumpkick.model.ToolDefaults.QUARKUS_PLATFORM_VERSION.
# Exact pin: bootstrap SPI must match the jars the engine puts on the forked worker CP.
[provided-dependencies]
quarkus-bootstrap-core           = "=3.38.0"
quarkus-bootstrap-maven-resolver = "=3.38.0"
quarkus-bootstrap-app-model      = "=3.38.0"

# Gradle's jk.java-conventions injects these into every module's test scope; jk.toml has no such
# implicit convention, so each manifest states them.
[test-dependencies]
assertj-core            = "latest"
junit-jupiter           = "latest"
junit-platform-launcher = "latest"
