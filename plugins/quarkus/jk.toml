name = "jk-quarkus"
description = "JumpKick's Quarkus packaging plugin"

[dependencies]
jk-plugin-sdk.workspace = true

[provided-dependencies]
quarkus-bootstrap-core = "=3.38.0"
quarkus-bootstrap-maven-resolver = "=3.38.0"
quarkus-bootstrap-app-model = "=3.38.0"

[test-dependencies]
# `kind = "tests"` reaches jk-plugin-sdk's test classes — where its `[test] extra-src`
# fixtures compile. Direct edge only, and never in a main jar.
jk-plugin-sdk = { workspace = true, kind = "tests" }
assertj-core = "latest"
junit-jupiter = "latest"
