group = "$organization$"
name = "$name$"
version = "0.1.0"
kotlin = "2.4.21"

[application]
main = "$package$.Application"

[quarkus]
version = "$quarkus_platform_version$"

[dependencies]
quarkus-rest = { group = "io.quarkus", name = "quarkus-rest" }
quarkus-arc = { group = "io.quarkus", name = "quarkus-arc" }
quarkus-kotlin = { group = "io.quarkus", name = "quarkus-kotlin" }

[test-dependencies]
quarkus-junit5 = { group = "io.quarkus", name = "quarkus-junit5" }
rest-assured = { group = "io.rest-assured", name = "rest-assured" }

# `jk image`: a JRE base. Quarkus's fast-jar starts quickly on its own; `jk native` is its startup path.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = false

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
