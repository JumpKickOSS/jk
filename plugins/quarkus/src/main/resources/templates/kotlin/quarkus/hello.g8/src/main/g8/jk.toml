group = "$organization$"
name = "$name$"
version = "0.1.0"
kotlin = "2.4.21"

[application]
main = "$package$.Application"

[quarkus]
version = "$quarkus_platform_version$"

[dependencies]
quarkus-rest = { group = "io.quarkus", name = "quarkus-rest" }
quarkus-arc = { group = "io.quarkus", name = "quarkus-arc" }
quarkus-kotlin = { group = "io.quarkus", name = "quarkus-kotlin" }
# quarkus-rest and quarkus-kotlin each bring a Kotlin extension as a Quarkus conditional
# dependency, which only Quarkus's own resolver follows: declared here so the lock ships them.
quarkus-rest-kotlin = { group = "io.quarkus", name = "quarkus-rest-kotlin" }
quarkus-vertx-kotlin = { group = "io.quarkus", name = "quarkus-vertx-kotlin" }

[test-dependencies]
quarkus-junit5 = { group = "io.quarkus", name = "quarkus-junit5" }
rest-assured = { group = "io.rest-assured", name = "rest-assured" }
