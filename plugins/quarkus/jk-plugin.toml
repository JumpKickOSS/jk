# Built-in Quarkus build plugin — declarative layer.
# Worker code (augment + fast-jar packager) lands in the jar; BOM + scaffold are pure data.

[plugin]
id        = "quarkus"
table     = "quarkus"
version   = "1.0.0"
jk-compat = ">=0.10"

[code]
worker          = "jk-quarkus"
protocol-prefix = "##JKQ:"

[packaging]
packager       = "quarkus-fast-jar"
# The augment writes a complete runnable tree; an image ships that rather than a classpath
# assembled from the lock. All jars, relative paths, fixed working directory — which is also the
# only shape a CDS/AOT cache can be trained against.
app-dir        = "quarkus-app"
app-jar        = "quarkus-run.jar"
# Quarkus computes its own native-image invocation — the entry point is a generated --features
# class, not [application] main. Asked for a native build without running native-image, it writes
# this directory: the runner jar, its lib/, and native-image.args. jk runs that list verbatim.
native-image-sources = "native-sources"
exec-mode      = "jar"
self-contained = true
classes-run    = false
main-scan      = true

[schema]
version = { type = "string", required = true, example = "3", hint = "major-line floor for quarkus-bom (caret; lock pins exact). Use =3.38.0 to hard-pin" }
# fast-jar (default): quarkus-run.jar + lib/ layout. uber-jar: single fat runner jar.
package = { type = "string", example = "fast-jar", hint = "fast-jar (default) or uber-jar" }

# Platform BOM so starters are versionless under [dependencies].
[[contribute.platform-dependency]]
coordinate = "io.quarkus.platform:quarkus-bom:${config.version}"

# Single augment tool classpath: bootstrap-core + maven-resolver roots, resolved as ONE graph
# under quarkus-bootstrap-bom (same idea as Maven plugin deps under a BOM). No freestyle dual
# trees, no hard-coded smallrye pins — versions track ${config.version}.
[[contribute.step-dependency]]
artifact   = "quarkus-bootstrap"
coordinate = "io.quarkus:quarkus-bootstrap-core:^${config.version}"
with       = ["io.quarkus:quarkus-bootstrap-maven-resolver:^${config.version}"]
transitive = true
managed-by = "io.quarkus:quarkus-bootstrap-bom:^${config.version}"

# Quarkus REST / CDI reflect on parameter names.
[[contribute.compiler-args]]
javac  = ["-parameters"]
kotlin = ["-java-parameters"]

# ---- Scaffold: jk new --quarkus
# Path variables: ${main-root} ${test-root} ${resources-root} ${test-resources-root} ${package-path}

[scaffold]
flag        = "quarkus"
description = "Quarkus 3 application"

[[scaffold.append]]
template = "scaffold/jk-toml-java.toml.tmpl"
when     = { lang = "java" }

[[scaffold.append]]
template = "scaffold/jk-toml-kotlin.toml.tmpl"
when     = { lang = "kotlin" }

[[scaffold.file]]
path     = "${main-root}/${package-path}/Application.java"
template = "scaffold/Application.java.tmpl"
when     = { lang = "java" }

[[scaffold.file]]
path     = "${main-root}/${package-path}/GreetingResource.java"
template = "scaffold/GreetingResource.java.tmpl"
when     = { lang = "java" }

[[scaffold.file]]
path     = "${test-root}/${package-path}/GreetingResourceTest.java"
template = "scaffold/GreetingResourceTest.java.tmpl"
when     = { lang = "java" }

[[scaffold.file]]
path     = "${main-root}/${package-path}/Application.kt"
template = "scaffold/Application.kt.tmpl"
when     = { lang = "kotlin" }

[[scaffold.file]]
path     = "${main-root}/${package-path}/GreetingResource.kt"
template = "scaffold/GreetingResource.kt.tmpl"
when     = { lang = "kotlin" }

# Kotlin gets the same example test the java scaffold ships — the [test-dependencies]
# fragment already added quarkus-junit5 + rest-assured for both languages.
[[scaffold.file]]
path     = "${test-root}/${package-path}/GreetingResourceTest.kt"
template = "scaffold/GreetingResourceTest.kt.tmpl"
when     = { lang = "kotlin" }

[[scaffold.file]]
path          = "${resources-root}/application.properties"
template      = "scaffold/application.properties.tmpl"
keep-existing = true

# Quarkus @QuarkusTest / BootstrapAppModelFactory need Maven project roots.
# JK still owns resolve via jk-lock.toml; this POM is coordinates for tooling only.
[[scaffold.file]]
path          = "pom.xml"
template      = "scaffold/pom.xml.tmpl"
keep-existing = true
