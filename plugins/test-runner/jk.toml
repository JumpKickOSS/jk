name = "jk-test-runner"
description = "JumpKick's JUnit Platform test-runner plugin"
# Workers load on user JVMs (JDK 17+); stay on release 17.
java = 17

[dependencies]
jk-plugin-sdk.workspace = true

# Compile-only: forked test JVM supplies the real engines/launcher.
[provided-dependencies]
junit-platform-engine = "latest"
junit-platform-launcher = "latest"

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

[build]
# Gradle's jk.plugin-conventions bakes the first-party manifests (+ scaffolds) into every
# worker jar; mirror that here for the one worker that rides EVERY module's forked test
# classpath. Without this, jk-built runner jars broke PluginTableRegistry discovery in
# non-engine suites (shared/core parses [spring-boot]/[android]/... tables) the moment
# `jk install` replaced the Gradle-built store copy (JK-2198).
extra-resources = [
  { from = "../*/jk-plugin.toml", into = "cc/jumpkick/plugin/manifest", rename = "{1}.jk-plugin.toml" },
  { from = "../*/scaffold/**", into = "cc/jumpkick/plugin/manifest", optional = true },
]
