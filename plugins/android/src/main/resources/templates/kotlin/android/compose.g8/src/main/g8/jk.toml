group = "$organization$"
name = "$name$"
version = "0.1.0"
# Language level 21: d8 desugars 21-bytecode today; the host JDK 25 cross-compiles it.
java = 21
kotlin = "2.4.20"

[android]
namespace   = "$package$"
compile-sdk = 36
min-sdk     = 24
compose     = true

[platform-dependencies]
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.09.00" }

[dependencies]
# activity-compose is androidx.activity's group — the Compose BOM does not manage it.
activity-compose = "androidx.activity:activity-compose:1.13.0"
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

[test-dependencies]
junit-jupiter = "6.1.3"

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"
