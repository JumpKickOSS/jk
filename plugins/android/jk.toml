[project]
name        = "jk-android"
description = "jk-android: Android packaging plugin worker."

[repositories]
central = "https://repo.maven.apache.org/maven2/"
google  = "https://dl.google.com/dl/android/maven2/"

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"
assembly = true

[dependencies]
jk-plugin-sdk.workspace = true
apksig        = { group = "com.android.tools.build", name = "apksig", version = "latest" }
asm                     = "latest"

[test-dependencies]
assertj-core            = "latest"
junit-jupiter           = "latest"
junit-platform-launcher = "latest"
