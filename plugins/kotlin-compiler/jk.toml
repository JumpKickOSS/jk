[project]
name = "jk-kotlin-compiler"
description = "JumpKick's Kotlin compiler plugin"

[application]
main = "cc.jumpkick.plugin.process.PluginMain"

[dependencies]
jk-plugin-sdk.workspace = true

[provided-dependencies]
kotlin-build-tools-api = "latest"
kotlin-stdlib = "latest"

[test-dependencies]
kotlin-build-tools-api = "latest"
kotlin-stdlib = "latest"
assertj-core = "latest"
junit-jupiter = "latest"
