name = "jk-image-builder"
description = "JumpKick's OCI image builder plugin"

[dependencies]
# jk-model owns ImageConfig — the only non-SPI first-party class this worker touches.
# jk-core/jk-io were declared but never imported and cost two scheduling levels (JK-2193).
jk-model.workspace = true
jk-plugin-sdk.workspace = true
jib-core = "latest"
commons-compress = "latest"

[test-dependencies]
jk-host = { workspace = true, fixtures = true }
assertj-core = "latest"
junit-jupiter = "latest"
