[project]
name = "jk-groovy-compiler"
description = "JumpKick's Groovy compiler plugin"

[application]
main = "cc.jumpkick.plugin.process.PluginMain"

[dependencies]
jk-plugin-sdk.workspace = true

[provided-dependencies]
groovy = "latest"

[test-dependencies]
groovy = "latest"
assertj-core = "latest"
junit-jupiter = "latest"
