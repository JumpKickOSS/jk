[project]
group       = "cc.jumpkick"
name        = "jk-groovy-compiler"
version     = "0.10.1"
description = "jk-groovy-compiler: Groovy 5 in-process compiler worker (PluginMain)."
jdk         = 25
java        = 25

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"
assembly = true

# Codec only in the assembly; the Groovy closure is resolved at runtime onto the worker CP.
[dependencies]
jk-plugin-sdk = { group = "cc.jumpkick", name = "jk-plugin-sdk", version = "0.10.1" }

[provided-dependencies]
groovy = { group = "org.apache.groovy", name = "groovy", version = "5.0.4" }

[test-dependencies]
# Groovy must be on the test CP: when jk test runs this plugin module, ServiceLoader also sees
# GroovyCompiler (Plugin SPI) and must load it without ClassNotFoundException.
groovy                  = { group = "org.apache.groovy", name = "groovy",                  version = "5.0.4" }
assertj-core            = { group = "org.assertj",        name = "assertj-core",            version = "3.27.7" }
junit-jupiter           = { group = "org.junit.jupiter",  name = "junit-jupiter",           version = "6.1.0" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.0" }
