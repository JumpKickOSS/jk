name = "jk-spring-boot"
description = "JumpKick's Spring Boot packaging plugin"

[dependencies]
jk-plugin-sdk.workspace = true

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

[build]
# Own declarative layer at the jar root — the third-party plugin shape.
extra-resources = [
  { from = "jk-plugin.toml", into = "" },
]
