name = "jk-grails"
description = "JumpKick's Grails packaging plugin"

[dependencies]
jk-plugin-sdk.workspace = true
jk-spring-boot.workspace = true

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

[build]
extra-resources = [
  { from = "jk-plugin.toml", into = "" },
  { from = "scaffold/**", into = "scaffold", optional = true },
]
