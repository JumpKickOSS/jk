[project]
name        = "jk-formatter"
description = "jk-formatter: Spotless / OpenRewrite format plugin worker."

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"
assembly = true

[dependencies]
jk-plugin-sdk.workspace = true
spotless-lib      = { group = "com.diffplug.spotless", name = "spotless-lib", version = "4.6.2" }
openrewrite-java  = { group = "org.openrewrite", name = "rewrite-java", version = "8.56.1" }
openrewrite-java21 = { group = "org.openrewrite", name = "rewrite-java-21", version = "8.56.1" }
slf4j-api               = "2.0.16"
slf4j-nop         = { group = "org.slf4j", name = "slf4j-nop", version = "2.0.16" }

[test-dependencies]
assertj-core            = "3.27.7"
junit-jupiter           = "6.1.0"
junit-platform-launcher = "6.1.0"
