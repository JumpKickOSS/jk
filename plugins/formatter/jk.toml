[project]
group       = "cc.jumpkick"
name        = "jk-formatter"
version     = "0.10.1"
description = "jk-formatter: Spotless / OpenRewrite format plugin worker."
jdk         = 25
java        = 25

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"
assembly = true

[dependencies]
jk-plugin-sdk     = { group = "cc.jumpkick", name = "jk-plugin-sdk", version = "0.10.1" }
spotless-lib      = { group = "com.diffplug.spotless", name = "spotless-lib", version = "4.6.2" }
openrewrite-java  = { group = "org.openrewrite", name = "rewrite-java", version = "8.56.1" }
openrewrite-java21 = { group = "org.openrewrite", name = "rewrite-java-21", version = "8.56.1" }
slf4j-api         = { group = "org.slf4j", name = "slf4j-api", version = "2.0.16" }
slf4j-nop         = { group = "org.slf4j", name = "slf4j-nop", version = "2.0.16" }

[test-dependencies]
assertj-core            = { group = "org.assertj",        name = "assertj-core",            version = "3.27.7" }
junit-jupiter           = { group = "org.junit.jupiter",  name = "junit-jupiter",           version = "6.1.0" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version = "6.1.0" }
