[project]
name        = "jk-formatter"
description = "jk-formatter: Spotless / OpenRewrite format plugin worker."

[application]
main     = "cc.jumpkick.plugin.process.PluginMain"
assembly = true

[dependencies]
jk-plugin-sdk.workspace = true
spotless-lib      = { group = "com.diffplug.spotless", name = "spotless-lib", version = "latest" }
openrewrite-java  = { group = "org.openrewrite", name = "rewrite-java", version = "latest" }
openrewrite-java21 = { group = "org.openrewrite", name = "rewrite-java-21", version = "latest" }
slf4j-api               = "latest"
slf4j-nop         = { group = "org.slf4j", name = "slf4j-nop", version = "latest" }

[test-dependencies]
assertj-core            = "latest"
junit-jupiter           = "latest"
junit-platform-launcher = "latest"
