# Self-host guard (JK-1443/JK-1812): short names resolve from the bundled catalog only,
# immune to ~/.jk/libs.toml and the downloaded registry mirror. Not a redundant default —
# the product default is "layered".
catalog = "bundled"

[project]
name = "jk-formatter"
description = "JumpKick's source code formatter plugin"

[application]
main = "cc.jumpkick.plugin.process.PluginMain"

[dependencies]
jk-plugin-sdk.workspace = true
spotless-lib = "latest"
openrewrite-java = "latest"
openrewrite-java21 = "latest"
slf4j-api = "latest"
slf4j-nop = "latest"

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"
