# Gradle vs JumpKick wall-clock comparison of this tree, on a schedule.
# Manual re-run: Actions → "Dogfood wall measurement" → Run workflow.
#
# A ratchet with a wide band, not a benchmark. A hosted runner's wall time moves with the runner
# it lands on, so the band starts at 15 % and is tuned from the noise the series records; within
# it nothing happens, above it a jk row fails this run and names the commit range since its line
# was banked, below it by 5 % the line is rewritten (scripts/wall-band.py, wall-baseline.toml).
#
# The jk side is a raw build (`[guards] on-build = false`, the Gradle-comparable number) and, on
# the same rows, the dogfooded build with jk's house-rule guards on, labelled opt-in — so the
# guards' cost is a series of its own instead of a drift in the comparison.
name: Dogfood wall measurement

on:
  schedule:
    # 07:40 UTC on Mondays — after the nightly, on a day nobody is waiting for it.
    - cron: "40 7 * * 1"
  workflow_dispatch:

concurrency:
  group: wall-measure
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  wall:
    name: Rebuild / no-op / touched
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      JK_AOT_TRAIN: 'off'
      OUT_DIR: ${{ github.workspace }}/build/dogfood-wall
      # One timed run per side. A hosted runner is too noisy for a median to mean anything, and
      # the rebuild row builds a native image on both sides.
      RUNS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap jk from Gradle artifacts
        run: |
          set -euo pipefail
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      # continue-on-error, deliberately: the measurement is a record, and a slow or flaky runner
      # must not read as a product regression until a baseline says what normal is.
      - name: Measure rebuild, no-op and touched
        continue-on-error: true
        run: ./scripts/dogfood-wall-measure.sh rebuild noop touched

      - name: Summarize
        if: always()
        run: cat "$OUT_DIR/row.md" >> "$GITHUB_STEP_SUMMARY" || true

      # The ratchet. Fails only when a jk row regressed past its band; a banked improvement or a
      # newly seeded row is a rewritten wall-baseline.toml this run cannot commit — the diff is the
      # summary and the artifact, for a contributor to bank.
      - name: Wall ratchet
        run: python3 scripts/wall-band.py "$OUT_DIR/row.jsonl" wall-baseline.toml --commit "${GITHUB_SHA::9}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a rewritten baseline
        if: always()
        run: |
          if ! git diff --quiet -- wall-baseline.toml; then
            echo "## wall-baseline.toml rewritten — commit this" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff -- wall-baseline.toml >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dogfood-wall
          path: |
            build/dogfood-wall/row.md
            build/dogfood-wall/row.jsonl
            build/dogfood-wall/*.log
            wall-baseline.toml
          if-no-files-found: error
          retention-days: 90
