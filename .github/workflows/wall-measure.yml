# JumpKick's wall clock on this tree, on a schedule.
# Manual re-run: Actions → "Dogfood wall measurement" → Run workflow.
#
# A ratchet with a wide band, not a benchmark. A hosted runner's wall time moves with the runner
# it lands on, so the band starts at 15 % and is tuned from the noise the series records; within
# it nothing happens, above it a row fails this run and names the commit range since its line
# was banked, below it by 5 % the line is rewritten (scripts/wall-band.py, wall-baseline.toml).
#
# Two series per row: a raw build (`[guards] on-build = false`, the published number) and the
# dogfooded build with jk's house-rule guards on, labelled opt-in — so the guards' cost is a
# series of its own instead of a drift in the product number.
name: Dogfood wall measurement

on:
  schedule:
    # 07:40 UTC on Mondays — after the nightly, on a day nobody is waiting for it.
    - cron: "40 7 * * 1"
  workflow_dispatch:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

concurrency:
  group: wall-measure
  cancel-in-progress: true

# Every run: step is bash with pipefail, so the ratchet's `… | tee` exits with the ratchet's status.
defaults:
  run:
    shell: bash

env:
  TERM: xterm-256color

jobs:
  wall:
    name: Rebuild / no-op / touched
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      JK_WORKER_AOT: 'off'
      OUT_DIR: ${{ github.workspace }}/target/dogfood-wall
      # One timed run per row. A hosted runner is too noisy for a median to mean anything, and
      # the rebuild row builds a native image.
      RUNS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      # The measured jk is this commit's own: the hosted release .jk/ci-bootstrap-version pins
      # builds the checkout, then `jk install` hands the home to the checkout's client, engine and
      # workers — the same two steps as ci.yml's self-host job.
      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      # continue-on-error, deliberately: the measurement is a record, and a slow or flaky runner
      # must not read as a product regression until a baseline says what normal is.
      - name: Measure rebuild, no-op and touched
        continue-on-error: true
        run: ./scripts/dogfood-wall-measure.sh rebuild noop touched

      - name: Summarize
        if: always()
        run: cat "$OUT_DIR/row.md" >> "$GITHUB_STEP_SUMMARY" || true

      # The ratchet. Fails only when a jk row regressed past its band; a banked improvement or a
      # newly seeded row is a rewritten wall-baseline.toml this run cannot commit — the diff is the
      # summary and the artifact, for a contributor to bank.
      - name: Wall ratchet
        run: python3 scripts/wall-band.py "$OUT_DIR/row.jsonl" wall-baseline.toml --commit "${GITHUB_SHA::9}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Report a rewritten baseline
        if: always()
        run: |
          if ! git diff --quiet -- wall-baseline.toml; then
            {
              echo "## wall-baseline.toml rewritten — commit this"
              echo '```diff'
              git diff -- wall-baseline.toml
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dogfood-wall
          path: |
            target/dogfood-wall/row.md
            target/dogfood-wall/row.jsonl
            target/dogfood-wall/*.log
            wall-baseline.toml
          if-no-files-found: error
          retention-days: 90
