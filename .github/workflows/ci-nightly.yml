# Integration / e2e on Linux. Unit tests stay on every push/PR in ci.yml.
# Manual re-run: Actions → "CI (nightly)" → Run workflow.
name: CI (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  integration:
    name: Gradle integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Integration test
        run: ./gradlew integrationTest --no-daemon

  # @Tag("slow") lives here as of JK-1023. Framework/language e2e — Android, Grails, Scala, KSP,
  # Protobuf, Groovy, Minified — measured at 426s of integrationTest's 1419s for 28 tests, 15s
  # each. What it asserts moves when a plugin or a toolchain moves, not when the change under
  # review does, so paying it on every merge bought coverage the change could not affect.
  slow:
    name: Gradle slow e2e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Slow e2e test
        run: ./gradlew slowTest --no-daemon

  # @Tag("network") lives here and nowhere else (JK-2447). It is off `checkAll` on purpose:
  # Sonatype enforces a per-IP quota on Maven Central and this repo has a documented history of
  # 429s from it (JK-1277), so a PR gate that needs the network fails for reasons the change did
  # not cause. Nightly, a 429 costs a re-run instead of a blocked merge.
  network:
    name: Gradle network test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Network test
        run: ./gradlew networkTest --no-daemon

  lombok-scope-guard:
    name: Lombok scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lombok stays compile-time only
        run: ./scripts/check-lombok-diet.sh

  engine-heap-guard:
    name: Engine heap guard (committed-after-idle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          echo "$PWD/clients/cli/build/install/jk/bin" >> "$GITHUB_PATH"

      - name: Build synthetic monorepo and gate committed-after-idle
        run: |
          JK_BIN=jk MODULES=60 GATE_COMMITTED_MIB=64 GATE_USED_MIB=24 \
            ./scripts/heap-monorepo-measure.sh
