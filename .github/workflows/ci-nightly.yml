# Integration / e2e on Linux. Unit tests stay on every push/PR in ci.yml.
# Manual re-run: Actions → "CI (nightly)" → Run workflow.
name: CI (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  # The integration tier under both builds, on one commit, compared: every class and every test
  # case Gradle's integrationTest ran, jk's integration profile ran too, with the same verdict.
  # This is cut-over gate two (docs/contributors/self-host.md) measured nightly rather than
  # asserted; a difference fails the job and the report names it.
  integration:
    name: Integration tier (Gradle and jk, compared)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      JK_AOT_TRAIN: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap jk from Gradle artifacts
        run: |
          set -euo pipefail
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      # A red class is a verdict the comparison reads, not a reason to stop before jk's half runs.
      - name: Gradle integration tier
        run: ./gradlew integrationTest --continue --no-daemon

      - name: jk integration profile
        run: scripts/measure-tier-parity.sh run-jk

      - name: Compare the two runs
        run: scripts/measure-tier-parity.sh compare

      - name: Publish the comparison
        if: always()
        run: |
          if [ -f target/tier-parity/report.txt ]; then
            { echo '## Integration tier parity'; echo '```'; cat target/tier-parity/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier-parity
          path: target/tier-parity/
          if-no-files-found: warn
          retention-days: 14

  # @Tag("slow") lives here. Framework/language e2e — Android, Grails, Scala, KSP,
  # Protobuf, Groovy, Minified — measured at 426s of integrationTest's 1419s for 28 tests, 15s
  # each. What it asserts moves when a plugin or a toolchain moves, not when the change under
  # review does, so paying it on every merge bought coverage the change could not affect.
  slow:
    name: Gradle slow e2e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Slow e2e test
        run: ./gradlew slowTest --no-daemon

  # @Tag("network") lives here and nowhere else. It is off `checkAll` on purpose:
  # Sonatype enforces a per-IP quota on Maven Central and this repo has a documented history of
  # 429s from it, so a PR gate that needs the network fails for reasons the change did
  # not cause. Nightly, a 429 costs a re-run instead of a blocked merge.
  network:
    name: Gradle network test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Network test
        run: ./gradlew networkTest --no-daemon

  # Microbenchmarks print medians and assert nothing about deltas, so they stay off the merge
  # gate. They still have to run somewhere or they rot.
  bench:
    name: Microbenchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Microbenchmarks
        run: ./gradlew benchTest --no-daemon

  # Unit-test coverage inventory. Not a gate: no percentage, and the JaCoCo agent stays off
  # unless -Pjk.coverage so checkFast does not pay for it.
  coverage:
    name: Coverage inventory and ratchet
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      JK_AOT_TRAIN: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Aggregate JaCoCo report
        run: ./gradlew coverageReport -Pjk.coverage --no-daemon

      # The per-module ratchet (G91) runs on the jk side: every module's unit tier under the JaCoCo
      # agent, then the house-rule gate reads each module's reports/jacoco.xml against its baselined
      # entry. A module more than half a point below its entry fails the job; one above it would
      # tighten the baseline, which a CI run reports instead of writing — run `jk test --coverage`
      # and `jk guard` locally and commit jk-guards-baseline.toml.
      - name: Bootstrap jk from Gradle artifacts
        run: |
          set -euo pipefail
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: Unit tier under the JaCoCo agent
        run: jk test --coverage

      - name: Coverage ratchet
        run: jk guard

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-per-module
          path: target/**/reports/jacoco.xml
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage
          path: build/reports/jacoco/
          if-no-files-found: error
          retention-days: 14

  lombok-scope-guard:
    name: Lombok scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lombok stays compile-time only
        run: ./scripts/check-lombok-diet.sh

  engine-heap-guard:
    name: Engine heap guard (committed-after-idle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          # The smoke script takes the client from JK_BIN, so the MSYS-vs-Windows spelling of a
          # PATH entry cannot decide whether `jk` resolves. PATH still gets the bin dir, in the
          # spelling the host's PATH actually uses.
          echo "JK_BIN=$CLIENT_BIN" >> "$GITHUB_ENV"
          BIN_DIR="$PWD/clients/cli/build/install/jk/bin"
          if command -v cygpath >/dev/null 2>&1; then BIN_DIR="$(cygpath -w "$BIN_DIR")"; fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Run the house-rule lanes; every guard fixture must bite
        run: |
          "$JK_BIN" guard --no-ansi

      - name: Build synthetic monorepo and gate committed-after-idle
        run: |
          JK_BIN=jk MODULES=60 GATE_COMMITTED_MIB=64 GATE_USED_MIB=24 \
            ./scripts/heap-monorepo-measure.sh

  # The five samples under docs/user/examples are what new projects get copied from, and
  # nothing built them for a long time — which is how the .jk-build/ rot in line-count-build
  # survived unnoticed in a directory the user docs link to.
  #
  # This is nightly and not ci.yml for the reason stated on the `network` job above: resolving
  # commons-codec, commons-text and JUnit from Central puts this job behind Sonatype's per-IP
  # quota, and a 429 on the PR gate blocks a merge for a reason the change did not cause.
  # Nightly, the same 429 costs a re-run.
  #
  # `git diff --exit-code` on the lockfiles is the real assertion here, not a tidiness check:
  # jk.toml declares only exact pins, so a build that rewrites a committed jk-lock.toml means
  # either a pin drifted or the lock writer put something non-deterministic in the file. That
  # is lockfile-as-law, enforced on the samples that are supposed to demonstrate it — with one
  # pre-1.0 exception: a first-party plugin pinned at the product's own, still-moving version
  # (cc.jumpkick:jk-minified 0.12.0) is republished with every side-load, so its sha256 can never
  # match a committed lock. Each sample is re-locked against the jk this job just built, and the
  # diff may contain checksum lines and nothing else.
  examples:
    name: Doc examples build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          # The smoke script takes the client from JK_BIN, so the MSYS-vs-Windows spelling of a
          # PATH entry cannot decide whether `jk` resolves. PATH still gets the bin dir, in the
          # spelling the host's PATH actually uses.
          echo "JK_BIN=$CLIENT_BIN" >> "$GITHUB_ENV"
          BIN_DIR="$PWD/clients/cli/build/install/jk/bin"
          if command -v cygpath >/dev/null 2>&1; then BIN_DIR="$(cygpath -w "$BIN_DIR")"; fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Build and test every sample
        run: |
          set -euo pipefail
          failed=0
          for manifest in docs/user/examples/*/jk.toml; do
            sample="$(dirname "$manifest")"
            echo "::group::$sample"
            if ! ( cd "$sample" && jk lock --no-ansi && jk build --no-ansi && jk test --no-ansi ); then
              echo "::error file=$manifest::sample failed: $sample"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # The one sample with a `[dev.sidecars]` table is also run the way its README says to run
      # it: `jk dev`, Vite beside the JVM, the API fetched through Vite's proxy, Ctrl-C. The
      # runner's Node is the one the sample's package-lock.json was cut for.
      - name: Run the vite-sidecar sample under jk dev
        run: |
          (cd docs/user/examples/vite-sidecar/web && npm ci --no-audit --no-fund)
          scripts/example-dev-smoke.sh docs/user/examples/vite-sidecar http://localhost:5173 /api/hello

      - name: A sample relock may move first-party plugin checksums and nothing else
        run: |
          set -euo pipefail
          git diff --stat -- 'docs/user/examples/**/jk-lock.toml'
          drift="$(git diff -U0 -- 'docs/user/examples/**/jk-lock.toml' | grep -E '^[+-][^+-]' | grep -vE '^[+-]checksum = "sha256:' || true)"
          if [ -n "$drift" ]; then
            echo "::error::a sample lock changed beyond first-party plugin checksums:"
            printf '%s\n' "$drift"
            exit 1
          fi

  # Thin-client product smoke on the OSes the PR gate does not run. Native images stay on
  # release.yml. Network is required (first lock/build of a fresh project).
  os-smoke:
    name: Product smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        shell: bash
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          # The smoke script takes the client from JK_BIN, so the MSYS-vs-Windows spelling of a
          # PATH entry cannot decide whether `jk` resolves. PATH still gets the bin dir, in the
          # spelling the host's PATH actually uses.
          echo "JK_BIN=$CLIENT_BIN" >> "$GITHUB_ENV"
          BIN_DIR="$PWD/clients/cli/build/install/jk/bin"
          if command -v cygpath >/dev/null 2>&1; then BIN_DIR="$(cygpath -w "$BIN_DIR")"; fi
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Product smoke
        shell: bash
        run: ./scripts/ci-product-smoke.sh
