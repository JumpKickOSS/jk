# The slow, network and bench tiers, the coverage ratchet, the doc examples and the product smoke
# with network, nightly. The fast tier, the curated lane and the whole integration tier run in
# ci.yml, on every pull request and merge-queue group.
# Manual re-run: Actions → "CI (nightly)" → Run workflow.
#
# Every job bootstraps the way ci.yml's self-host job does: the hosted release
# .jk/ci/ci-bootstrap-version pins installs the checkout (building it), which hands the isolated JK_HOME
# to the checkout's own client, engine and workers, so each tier is run by the commit's jk.
#
# Every job starts at once, on every OS.
name: CI (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  # @Tag("slow") lives here: framework and language e2e — Android, Grails, Scala, KSP, Protobuf,
  # Groovy, Minified. What it asserts moves when a plugin or a toolchain moves, not when the change
  # under review does, so paying it on every merge bought coverage the change could not affect.
  slow:
    name: Slow suite (framework and language e2e)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Slow suite
        run: jk test -s slow --continue --no-ansi

  # @Tag("network") lives here and nowhere else. It is off the branch gate on purpose: Sonatype
  # enforces a per-IP quota on Maven Central, so a gate that needs the network fails for reasons
  # the change did not cause. Nightly, a 429 costs a re-run instead of a blocked merge.
  network:
    name: Network suite
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Network suite
        run: jk test -s network --continue --no-ansi

  # Microbenchmarks print medians and assert nothing about deltas, so they stay off the merge
  # gate. They still have to run somewhere or they rot. The jar-size bench packages its fixtures
  # with the installed jk, Maven and the fixtures' own Gradle wrappers — those are the products it
  # compares against, provisioned by the fixtures themselves.
  bench:
    name: Bench suite (microbenchmarks)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Bench suite
        run: jk test -s bench --continue --no-ansi

  # jk audits itself at every severity, nightly, and reports. The branch gate fails a pull request
  # at HIGH (ci.yml's self-host job); a LOW or MEDIUM advisory arrives here as an annotation and a
  # summary table to read, not as a red merge. continue-on-error is deliberate: the job's verdict
  # is about the run, the annotations and the artifact carry the findings.
  audit:
    name: Audit the locked graph (every severity)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Audit the locked graph at LOW
        continue-on-error: true
        run: |
          set -euo pipefail
          jk audit --severity LOW --no-ansi -O jsonl | tee target/jk-audit.jsonl

      - name: Attribute audit findings
        if: always()
        run: scripts/ci-audit-annotate.sh target/jk-audit.jsonl LOW

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jk-audit-nightly
          path: target/jk-audit.jsonl
          if-no-files-found: warn
          retention-days: 30

  # The per-module coverage ratchet (G91): every module's unit tier under the JaCoCo agent, then
  # the house-rule gate reads each module's reports/jacoco.xml against its baselined entry. A module
  # more than half a point below its entry fails the job; one above it would tighten the baseline,
  # which a CI run reports instead of writing — run `jk test --coverage` and `jk guard` locally and
  # commit jk-guards-baseline.toml. Never a percentage target, never on the branch gate.
  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Unit tier under the JaCoCo agent
        run: jk test --coverage --no-ansi

      - name: Coverage ratchet
        run: jk guard --no-ansi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-per-module
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: warn
          retention-days: 14

  lombok-scope-guard:
    name: Lombok scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lombok stays compile-time only
        run: ./scripts/check-lombok-diet.sh

  # `jk new` renders from the published catalog first, so a template changed here and not mirrored
  # there ships the old one. The check names each drifted file.
  templates-drift:
    name: Published templates match templates/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JumpKickOSS/jk-templates
          path: jk-templates

      - name: jk-templates mirrors templates/
        run: ./scripts/templates-sync.sh --check jk-templates

  engine-heap-guard:
    name: Engine heap guard (committed-after-idle)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Run the house-rule lanes; every guard fixture must bite
        run: jk guard --no-ansi

      - name: Build synthetic monorepo and gate committed-after-idle
        run: |
          JK_BIN=jk MODULES=60 GATE_COMMITTED_MIB=64 GATE_USED_MIB=24 \
            ./scripts/heap-monorepo-measure.sh

  # Every nightly scenario of JumpKickOSS/jk-examples, checked from a clean checkout with the jk this
  # job built, as each scenario's scenario.toml lists its commands; the node scenarios provision
  # their own pinned Node.js, so the runner's Node plays no part. The scenarios marked `dev = true`
  # then run under `jk dev` until their front doors answer.
  #
  # This is nightly and not ci.yml for the reason stated on the `network` job above: resolving from
  # Central puts this job behind Sonatype's per-IP quota, and a 429 on the PR gate blocks a merge for
  # a reason the change did not cause. Nightly, the same 429 costs a re-run.
  #
  # The diff of the committed lockfiles after the job is the real assertion here, not a tidiness
  # check: a scenario's jk.toml declares exact pins, so a build that rewrites a committed
  # jk-lock.toml means either a pin drifted or the lock writer put something non-deterministic in
  # the file. The check tolerates checksum lines and the writer lines `jk lock` restamps with the
  # build that ran it, and every other changed jk-lock.toml line fails the lane. A scenario's
  # package-lock.json is held to the stricter rule — no change at all — since `npm ci` refuses a
  # lock out of step with its package.json. Both rules live in scripts/examples-lock-drift.sh,
  # which has a fixture test.
  examples:
    name: jk-examples scenarios
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JumpKickOSS/jk-examples
          path: jk-examples

      # Every scenario whose scenario.toml says it runs nightly, relocked and then checked with the
      # commands its manifest lists; the runner has Docker, so `needs = ["docker"]` scenarios run too.
      - name: Check every nightly jk-examples scenario from a clean checkout
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r scenario; do
            dir="jk-examples/$scenario"
            echo "::group::$scenario"
            if ! ( cd "$dir" && jk lock --no-ansi ) || ! python3 jk-examples/scripts/scenarios.py check "$scenario"; then
              echo "::error file=$dir/scenario.toml::scenario failed: $scenario"
              failed=1
            fi
            echo "::endgroup::"
          done < <(python3 jk-examples/scripts/scenarios.py list --cadence nightly --have docker)
          python3 jk-examples/scripts/scenarios.py lint || failed=1
          exit "$failed"

      - name: Run every jk-examples dev scenario under jk dev
        run: scripts/example-dev-smoke.sh --examples jk-examples

      - name: A relock may move first-party plugin checksums and nothing else; an npm lock may not move
        run: scripts/examples-lock-drift.sh jk-examples

  # ---- Windows -----------------------------------------------------------------------------------

  # The Node.js toolchain on Windows with the suites that fetch real generators from npm, which the
  # ci.yml job of the same name leaves out.
  node-windows-network:
    name: Node.js toolchain with network (Windows)
    # windows-2022 for the reason the product smoke gives.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The home sits outside the checkout: on Windows a read of the engine's byte-range-locked
      # files under the home fails.
      - name: Home outside the checkout
        shell: bash
        run: echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        env:
          JK_CLIENT: native
        run: bash scripts/ci-bootstrap.sh

      # The suites run under the checkout's jk: the pinned release cannot read the tree's guard rules.
      - name: The checkout's own jk takes over
        shell: bash
        run: bash scripts/ci-takeover.sh --install-only

      - name: Node.js toolchain suites
        shell: bash
        run: bash scripts/ci-node-windows.sh --network

  # ---- macOS -------------------------------------------------------------------------------------

  # The native client's watch on macOS. ci.yml's macOS job runs the product smoke and the fast tier
  # on every pull request; this adds the slow watch class, which needs that install.
  os-smoke-macos:
    name: Native watch (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/product-smoke
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The native client's watch, which binds FSEvents only on macOS: a save starts a pass of the
      # native client the takeover linked. The Linux slow job runs the same class.
      - name: Native watch latency
        run: >-
          jk test -s slow --no-ansi -m e2e/cli
          --class cc.jumpkick.command.pipeline.NativeWatchLatencyE2eTest

  # The JVM client on a runner that brings a plain JDK and no GraalVM — the shape of every platform
  # with no hosted native client, and the one place nothing else exercises bin/jk-jvm. The
  # checkout's build still links jk's native client, so it provisions the GraalVM that step needs
  # itself (--yes answers the installer's offer; nothing here reaches for setup-graalvm). What the
  # job then proves is the launcher jk install writes beside that client: jk-jvm answers --version
  # on the runner's JDK and builds a fresh sample through the engine the same install put in place
  # (scripts/ci-product-smoke.sh, with the JVM client as the jk under test).
  jvm-client:
    name: JVM client smoke (plain JDK, no GraalVM)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only --yes

      - name: The JVM client answers and builds a sample through the installed engine
        run: |
          set -euo pipefail
          test -x "$JK_HOME/bin/jk-jvm"
          jk-jvm --version
          JK_BIN=jk-jvm scripts/ci-product-smoke.sh
