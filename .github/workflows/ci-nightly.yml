# Integration / e2e on Linux. Unit tests stay on every push/PR in ci.yml.
# Manual re-run: Actions → "CI (nightly)" → Run workflow.
name: CI (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  integration:
    name: Gradle integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Integration test
        run: ./gradlew integrationTest --no-daemon
