# The slow tiers, the coverage ratchet, the doc examples and the product smoke, on Linux and macOS.
# Unit tests and the curated integration lane stay on every push/PR in ci.yml.
# Manual re-run: Actions → "CI (nightly)" → Run workflow.
#
# Every job bootstraps the way ci.yml's self-host job does: the hosted release
# .jk/ci-bootstrap-version pins builds the checkout, then `jk install` hands the isolated JK_HOME
# to the checkout's own client, engine and workers, so each tier is run by the commit's jk.
name: CI (nightly)

on:
  schedule:
    # 06:15 UTC daily
    - cron: "15 6 * * *"
  workflow_dispatch:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

concurrency:
  group: ci-nightly
  cancel-in-progress: true

env:
  TERM: xterm-256color

jobs:
  # The whole integration profile. The branch gate runs the curated subset (curated-integration.txt);
  # this is the complete tier, and the curated lane is never a replacement for it.
  integration:
    name: Integration profile
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      # A red class is a verdict about its module; --continue reports every module's.
      - name: Integration profile
        run: jk test --profile integration --continue --no-ansi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-results
          path: target/**/reports/test-results/
          if-no-files-found: warn
          retention-days: 14

  # @Tag("slow") lives here: framework and language e2e — Android, Grails, Scala, KSP, Protobuf,
  # Groovy, Minified. What it asserts moves when a plugin or a toolchain moves, not when the change
  # under review does, so paying it on every merge bought coverage the change could not affect.
  slow:
    name: Slow profile (framework and language e2e)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Slow profile
        run: jk test --profile slow --continue --no-ansi

  # @Tag("network") lives here and nowhere else. It is off the branch gate on purpose: Sonatype
  # enforces a per-IP quota on Maven Central, so a gate that needs the network fails for reasons
  # the change did not cause. Nightly, a 429 costs a re-run instead of a blocked merge.
  network:
    name: Network profile
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Network profile
        run: jk test --profile network --continue --no-ansi

  # Microbenchmarks print medians and assert nothing about deltas, so they stay off the merge
  # gate. They still have to run somewhere or they rot. The jar-size bench packages its fixtures
  # with the installed jk, Maven and the fixtures' own Gradle wrappers — those are the products it
  # compares against, provisioned by the fixtures themselves.
  bench:
    name: Bench profile (microbenchmarks)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Bench profile
        run: jk test --profile bench --continue --no-ansi

  # jk audits itself at every severity, nightly, and reports. The branch gate fails a pull request
  # at HIGH (ci.yml's self-host job); a LOW or MEDIUM advisory arrives here as an annotation and a
  # summary table to read, not as a red merge. continue-on-error is deliberate: the job's verdict
  # is about the run, the annotations and the artifact carry the findings.
  audit:
    name: Audit the locked graph (every severity)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Audit the locked graph at LOW
        continue-on-error: true
        run: |
          set -euo pipefail
          jk audit --severity LOW --no-ansi --output json | tee target/jk-audit.jsonl

      - name: Attribute audit findings
        if: always()
        run: scripts/ci-audit-annotate.sh target/jk-audit.jsonl LOW

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jk-audit-nightly
          path: target/jk-audit.jsonl
          if-no-files-found: warn
          retention-days: 30

  # The per-module coverage ratchet (G91): every module's unit tier under the JaCoCo agent, then
  # the house-rule gate reads each module's reports/jacoco.xml against its baselined entry. A module
  # more than half a point below its entry fails the job; one above it would tighten the baseline,
  # which a CI run reports instead of writing — run `jk test --coverage` and `jk guard` locally and
  # commit jk-guards-baseline.toml. Never a percentage target, never on the branch gate.
  coverage:
    name: Coverage ratchet
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Unit tier under the JaCoCo agent
        run: jk test --coverage --no-ansi

      - name: Coverage ratchet
        run: jk guard --no-ansi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: jacoco-per-module
          path: target/**/reports/jacoco.xml
          if-no-files-found: warn
          retention-days: 14

  lombok-scope-guard:
    name: Lombok scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lombok stays compile-time only
        run: ./scripts/check-lombok-diet.sh

  engine-heap-guard:
    name: Engine heap guard (committed-after-idle)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Run the house-rule lanes; every guard fixture must bite
        run: jk guard --no-ansi

      - name: Build synthetic monorepo and gate committed-after-idle
        run: |
          JK_BIN=jk MODULES=60 GATE_COMMITTED_MIB=64 GATE_USED_MIB=24 \
            ./scripts/heap-monorepo-measure.sh

  # The five samples under docs/user/examples are what new projects get copied from, and
  # nothing built them for a long time — which is how the .jk-build/ rot in line-count-build
  # survived unnoticed in a directory the user docs link to.
  #
  # This is nightly and not ci.yml for the reason stated on the `network` job above: resolving
  # commons-codec, commons-text and JUnit from Central puts this job behind Sonatype's per-IP
  # quota, and a 429 on the PR gate blocks a merge for a reason the change did not cause.
  # Nightly, the same 429 costs a re-run.
  #
  # The diff of the committed lockfiles after the job is the real assertion here, not a tidiness
  # check: jk.toml declares only exact pins, so a build that rewrites a committed jk-lock.toml
  # means either a pin drifted or the lock writer put something non-deterministic in the file.
  # That is lockfile-as-law, enforced on the samples that are supposed to demonstrate it. A
  # first-party plugin at jk's own pre-release version (cc.jumpkick:jk-minified) is pinned by
  # version alone, so re-locking each sample against the jk this job just built rewrites nothing;
  # the check tolerates checksum lines only — a third-party plugin republish is reported as such —
  # and every other changed jk-lock.toml line fails the lane. A sample's web/package-lock.json is
  # held to the stricter rule — no change at all — since `npm ci` refuses a lock out of step with
  # its package.json. Both rules live in scripts/examples-lock-drift.sh, which has a fixture test.
  examples:
    name: Doc examples build and test
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Build and test every sample
        run: |
          set -euo pipefail
          failed=0
          for manifest in docs/user/examples/*/jk.toml; do
            sample="$(dirname "$manifest")"
            echo "::group::$sample"
            if ! ( cd "$sample" && jk lock --no-ansi && jk build --no-ansi && jk test --no-ansi ); then
              echo "::error file=$manifest::sample failed: $sample"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      # The one sample with a `[dev.sidecars]` table is also run the way its README says to run
      # it: `jk dev`, Vite beside the JVM, the API fetched through Vite's proxy, Ctrl-C. The
      # runner's Node is the one the sample's package-lock.json was cut for.
      - name: Run the vite-sidecar sample under jk dev
        run: |
          (cd docs/user/examples/vite-sidecar/web && npm ci --no-audit --no-fund)
          scripts/example-dev-smoke.sh docs/user/examples/vite-sidecar http://localhost:5173 /api/hello

      - name: A sample relock may move first-party plugin checksums and nothing else; an npm lock may not move
        run: scripts/examples-lock-drift.sh

  # Product smoke on the OSes the PR gate does not run. Bootstraps the hosted client the way a user
  # installs it (the JVM client on macOS, jk.exe on Windows), hands the home to the checkout's own
  # jk, and drives a fresh project end to end. Network is required (first lock/build of a fresh
  # project).
  os-smoke:
    name: Product smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 while the hosted bootstrap predates the engine passing the developer
        # prompt's INCLUDE and LIB through: native-image locates Visual Studio 2022 on its own.
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The home sits outside the checkout: the guard lanes of `jk build` read the whole workspace,
      # and on Windows a read of the engine's byte-range-locked files under the home fails.
      - name: Home outside the checkout
        shell: bash
        run: echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The pin serves no macOS native client, so that row asks the installer for the JVM client.
      - name: Bootstrap jk from the hosted release
        if: runner.os != 'Windows'
        shell: bash
        env:
          JK_CLIENT: ${{ runner.os == 'macOS' && 'jvm' || 'native' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      # No developer-prompt step: native-image sets up Visual Studio 2022 itself when cl.exe is not
      # already on PATH, and a prompt that puts it there hands the engine a PATH without the INCLUDE
      # the hosted bootstrap's engine does not pass through.
      - name: Bootstrap jk from the hosted release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JK_VERSION = (Get-Content .jk/ci-bootstrap-version -Raw).Trim()
          Invoke-RestMethod https://jumpkick.build/install.ps1 | Invoke-Expression
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:JK_HOME 'bin')

      # On Windows, setup-graalvm exports the Visual Studio environment and puts cl.exe on PATH;
      # the hosted bootstrap's engine keeps PATH and drops INCLUDE and LIB, a state native-image
      # neither compiles in nor sets up itself. The installer started an engine under that
      # environment, so it is stopped and respawned with those gone, and native-image locates
      # Visual Studio 2022 on its own. Retire this once the pin's engine inherits INCLUDE, LIB
      # and LIBPATH.
      - name: The checkout's own jk takes over
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset INCLUDE LIB LIBPATH EXTERNAL_INCLUDE
            PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -i 'Microsoft Visual Studio\|Windows Kits' | paste -sd:)"
            export PATH
            jk engine stop --now --no-ansi
          fi
          jk build --skip-tests --no-ansi
          jk install --skip-tests --no-ansi

      - name: Product smoke
        shell: bash
        run: JK_BIN=jk ./scripts/ci-product-smoke.sh

  # The JVM client on a runner that brings a plain JDK and no GraalVM — the shape of every platform
  # with no hosted native client, and the one place nothing else exercises bin/jk-jvm. The
  # checkout's build still links jk's native client, so it provisions the GraalVM that step needs
  # itself (--yes answers the installer's offer; nothing here reaches for setup-graalvm). What the
  # job then proves is the launcher jk install writes beside that client: jk-jvm answers --version
  # on the runner's JDK and builds a fresh sample through the engine the same install put in place
  # (scripts/ci-product-smoke.sh, with the JVM client as the jk under test).
  jvm-client:
    name: JVM client smoke (plain JDK, no GraalVM)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk build --skip-tests --yes --no-ansi
          jk install --skip-tests --yes --no-ansi

      - name: The JVM client answers and builds a sample through the installed engine
        run: |
          set -euo pipefail
          test -x "$JK_HOME/bin/jk-jvm"
          jk-jvm --version
          JK_BIN=jk-jvm scripts/ci-product-smoke.sh
