# CD: build, sign and publish a release that CI has already passed. It re-runs no test.
#
# Trigger: the CI workflow (ci.yml) finishing green on a release tag vX.Y.Z, whether the tag push
# started it or a dispatch on the tag did (the Cut release workflow dispatches it, since a push made
# with GITHUB_TOKEN starts no workflow). A red CI run starts nothing. The tag is a request; the root
# jk.toml version at the tagged commit is the answer, and a request that differs from it fails before
# anything is built (scripts/release-version.sh). The chain:
#
#   gate    — the CI run was green and its ref is a tag on the commit it tested.
#   build   — the native client and engine of every platform, built by jk (tests skipped: CI ran them).
#   merge   — one version tree from the platforms, the SBOM and the notes. No secrets.
#   publish — signs the tree, uploads it to GCS, redeploys the installers, releases the plugin SDK to
#             Central, and creates the GitHub Release with the tree, the SBOM and the notes. The
#             only job that names the `release` environment, so the only one that holds the secrets,
#             and it waits there for a reviewer's approval.
#
# A workflow_dispatch is the dry run: it builds and merges the tree of the ref it is started on
# (unsigned) and stops with it as a workflow artifact; it never publishes, so the only way to a
# published release is a green CI run.
#
# Secrets, all environment secrets of the `release` environment (scripts/release-environment.sh
# creates it and loads them):
#   JK_RELEASE_RSA_SIGNING_KEY — base64 PKCS#8 DER RSA-3072 private key; signs the combined SHA256SUMS
#   JK_RELEASE_GCS_BUCKET      — GCS bucket name (no gs://), e.g. jumpkick
#   JK_RELEASE_GCS_SA_JSON     — GCP service-account JSON (storage.objectAdmin on the bucket,
#                                firebasehosting.admin on the hosting project)
#   JK_CENTRAL_GPG_KEY         — armored release GPG secret key; signs the plugin SDK's Central
#                                bundles (public key on keyserver.ubuntu.com)
#   JK_CENTRAL_GPG_PASSPHRASE  — its passphrase
#   JK_REPO_CENTRAL_USERNAME   — Central Portal user token name
#   JK_REPO_CENTRAL_PASSWORD   — Central Portal user token password
#   GITHUB_TOKEN (automatic)   — read-only everywhere but the publish job, which writes the
#                                GitHub Release (contents) and its provenance attestations
#                                (id-token, attestations)
#
# Hosting: objects in GCS behind the Firebase CDN at https://jumpkick.build. Path:
#   gs://$JK_RELEASE_GCS_BUCKET/releases/<ver>/… and …/releases/latest/LATEST (one signed object)
#
# The GitHub Release the run creates for the tag receives the same version tree (clients, engine jar,
# SHA256SUMS and its signature), the CycloneDX SBOM jk wrote of its engine (`jk publish --sbom
# --dry-run`, the document the engine jar embeds), notes from scripts/release-notes.sh (the
# version's highlights in docs/contributors/releases.md, then the commits since the previous tag)
# and a build-provenance attestation per artifact — attached last, once the bucket, the pointer
# and the installers are live, so the release never announces bytes an installer cannot fetch.
#
# The plugin SDK (cc.jumpkick:jk-host, cc.jumpkick:jk-plugin-sdk) ships at the release version on
# both channels: the run fails unless its POMs answer on https://jumpkick.build/repo/ and, once
# Central has synced, on https://repo1.maven.org/ (scripts/publish-central.sh).

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

# One release at a time, and a started release is never cancelled half-published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TERM: xterm-256color
  # The tag a CI run was on; empty on a dispatch, where scripts/release-version.sh answers with the
  # declared version.
  RELEASE_TAG: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
  # The commit that was tested, and so the commit that is built.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # CI's verdict, read and not repeated. A workflow_run fires for every run of CI, red ones and
  # dispatches on branches included: only a green run on a tag that names the tested commit goes on.
  gate:
    name: CI passed on a release tag
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != workflow_run ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"   # a dispatch is the dry run
            exit 0
          fi
          if [[ "$CONCLUSION" != success ]]; then
            echo "CI finished $CONCLUSION: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
            echo "CI ran on '$RELEASE_TAG', not a release tag: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$RELEASE_TAG" --jq .sha 2>/dev/null || true)"
          if [[ "$tagged" != "$RELEASE_SHA" ]]; then
            echo "::error::$RELEASE_TAG is at '${tagged:-nothing}', not $RELEASE_SHA, the commit CI tested"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.arch_label }}
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # One row per platform jumpkick.build serves a native client for at the release
        # .jk/ci-bootstrap-version pins. jk is installed the way a user installs it, the same
        # bootstrap as ci.yml's self-host job, and builds this commit's dist.
        # macOS on Intel has no client.
        include:
          - os: ubuntu-latest
            arch_label: linux-x86_64
          # The arm runner of a public repository.
          - os: ubuntu-24.04-arm
            arch_label: linux-aarch64
          - os: macos-14
            arch_label: macos-aarch64
          # Visual Studio 2022: the one native-image locates on its own, which the hosted
          # bootstrap's engine leaves it to do (the Dist step below). Once the pin's engine
          # inherits INCLUDE and LIB, any Windows image serves.
          - os: windows-2022
            arch_label: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}

      # The home sits outside the checkout: the guard lanes of `jk build` read the whole workspace,
      # and on Windows a read of the engine's byte-range-locked files under the home fails.
      - name: Home outside the checkout
        shell: bash
        run: echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(scripts/release-version.sh "${RELEASE_TAG#v}")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building release $VER (${{ matrix.arch_label }})"

      # The shipped artifacts are what jk builds of itself. The jk that builds them is the one
      # scripts/ci-bootstrap.sh installs: the hosted release .jk/ci-bootstrap-version pins, or the
      # bridge commit .jk/ci-bootstrap-reader names, built by it. JK_VERSION in this job's
      # environment is the release being cut; the script hands the pin's version to the installer alone.
      # Every row bootstraps a native client, so a platform the pin stops serving fails here.
      - name: Bootstrap jk from the hosted release
        shell: bash
        env:
          JK_CLIENT: native
        run: bash scripts/ci-bootstrap.sh

      # On Windows, setup-graalvm exports the Visual Studio environment and puts cl.exe on PATH.
      # The hosted bootstrap's engine keeps PATH and drops INCLUDE and LIB, and a cl.exe it can
      # reach without headers is the one state native-image neither compiles in nor sets up
      # itself. The installer started an engine under that environment, so it is stopped and
      # respawned by the first jk command with those gone: native-image then locates Visual
      # Studio 2022 on its own. Retire this once the pin's engine inherits INCLUDE, LIB and LIBPATH.
      - name: Dist (native client + engine), built by jk
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            unset INCLUDE LIB LIBPATH EXTERNAL_INCLUDE
            PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -v -i 'Microsoft Visual Studio\|Windows Kits' | paste -sd:)"
            export PATH
            jk engine stop --now --no-ansi
          fi
          # Every lane packages with the same jk, the tree's own: the bootstrap installs the tree,
          # the tree's client takes the home over and shelves this commit's plugins, and that jk
          # builds the dist. The engine jar embeds an SBOM naming its packager, and the three
          # lanes' jars must be byte-identical for the flatten.
          bash scripts/ci-takeover.sh --install-only
          packager="$(jk --version --no-ansi | head -1)"
          if [[ "$packager" != *" $JK_VERSION"* ]]; then
            echo "::error::the dist must be built by jk $JK_VERSION, the tree's own; jk on PATH is: $packager"
            exit 1
          fi
          jk build --skip-tests --no-ansi
          ls -la target/dist target/dist/lib

      # The bill of materials of the engine, written by the jk that built it: `jk publish --sbom
      # --dry-run` leaves the CycloneDX document in the module's own target/ without an upload,
      # and it is the one the engine
      # jar embeds under META-INF/sbom/ (one writer, derived from jk-lock.toml;
      # docs/user/packaging.md). Staged beside the version tree, never in it, so the signed
      # SHA256SUMS the installers verify stays byte for byte what the publish job signs.
      - name: Write the SBOM of the engine
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          (cd server/engine && jk publish --sbom --dry-run --no-ansi)
          mkdir -p out/sbom
          sbom="out/sbom/jk-${JK_VERSION}.cdx.json"
          cp "server/engine/target/sbom/jk-engine-${JK_VERSION}.cdx.json" "$sbom"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length) > 0 and (.metadata.component.name == "jk-engine")' "$sbom" >/dev/null
          echo "SBOM: $(jq '.components | length' "$sbom") components, CycloneDX $(jq -r .specVersion "$sbom")"

      - name: Upload the SBOM (artifact)
        if: matrix.arch_label == 'linux-x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.JK_VERSION }}
          path: out/sbom
          if-no-files-found: error

      - name: Stage the first-party Maven repository
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          JK_MAVEN_STAGE_ONLY=1 JK_MAVEN_STAGE_DIR=target/release/repo scripts/publish-maven-repo.sh
          find target/release/repo -name '*.jar' | sed 's|target/release/repo/||' | sort

      - name: Upload the Maven repository (artifact)
        if: matrix.arch_label == 'linux-x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-repo-${{ env.JK_VERSION }}
          path: target/release/repo
          if-no-files-found: error

      # Unsigned: the per-platform SHA256SUMS is discarded when the trees are merged, and the
      # signing key stays with the one job whose signature ships.
      - name: Assemble release dir
        shell: bash
        env:
          DIST_DIR: target/dist
        run: |
          set -euo pipefail
          chmod +x scripts/assemble-release-dir.sh
          OUT="target/release/${JK_VERSION}-${{ matrix.arch_label }}"
          scripts/assemble-release-dir.sh "$OUT"
          ls -la "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.JK_VERSION }}-${{ matrix.arch_label }}
          path: target/release/${{ env.JK_VERSION }}-${{ matrix.arch_label }}/
          if-no-files-found: error

  # One version tree from the platforms. Nothing here signs or publishes, so it holds no secret and
  # a dry run ends here with the unsigned tree as a workflow artifact.
  merge:
    name: Merge
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The whole history and every tag: the notes list the commits since the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(scripts/release-version.sh "${RELEASE_TAG#v}")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"

      # A precondition, before anything is downloaded: the version's highlights entry in
      # docs/contributors/releases.md, then the commits since the previous tag. A version with no
      # entry is refused here, with nothing published yet. The notes travel with the tree.
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          scripts/release-notes.sh "$JK_VERSION" > out/RELEASE_NOTES.md
          cat out/RELEASE_NOTES.md

      - name: Download platform artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: staging
          pattern: release-*
          merge-multiple: false

      # One tree from the matrix: each platform's client, and the platform-neutral jars from
      # linux-x86_64 alone. The refusals (a missing platform, an engine jar whose bytes differ, two
      # trees carrying one name) live in the script, which scripts/test-flatten-release.sh
      # exercises in the gate.
      - name: Flatten into version directory
        shell: bash
        env:
          JK_RELEASE_PLATFORMS: linux-x86_64 linux-aarch64 macos-aarch64 windows-x86_64
        run: scripts/flatten-release.sh staging "out/${JK_VERSION}" "$JK_VERSION"

      # The SBOM the linux-x86_64 build job wrote of the engine (`jk publish --sbom --dry-run`),
      # beside the tree, not in it: the signed SHA256SUMS the installers verify stays byte for
      # byte what the publish job signs.
      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out/sbom
          pattern: sbom-*
          merge-multiple: true

      - name: The SBOM is here
        shell: bash
        run: |
          set -euo pipefail
          sbom="out/sbom/jk-${JK_VERSION}.cdx.json"
          [[ -f "$sbom" ]] || { echo "$sbom missing — the linux-x86_64 build did not write it" >&2; exit 1; }
          echo "SBOM: $(jq '.components | length' "$sbom") components, CycloneDX $(jq -r .specVersion "$sbom")"

      - name: Upload merged release tree (artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-release-${{ env.JK_VERSION }}
          path: out/
          if-no-files-found: error

  # Everything that signs or publishes, and the only job with the secrets: they belong to the
  # `release` environment, whose required reviewer approves the run before this job starts. Only a
  # green CI run on a tag gets here; a dry run has no job here.
  publish:
    name: Sign + publish
    needs: merge
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://jumpkick.build
    # The one job that writes: the GitHub Release (contents) and the provenance attestations
    # (id-token for the OIDC identity, attestations for the store). GCS and Firebase are reached
    # with the service-account secret, never with this token.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # A tree signed with any other key than the one the installers trust is refused, never published.
      JK_RELEASE_REQUIRE_TRUSTED_KEY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(scripts/release-version.sh "${RELEASE_TAG#v}")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Download the merged release tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          name: merged-release-${{ env.JK_VERSION }}

      - name: Download the Maven repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: target/release/repo
          pattern: maven-repo-*
          merge-multiple: true

      - name: Sign the combined SHA256SUMS
        shell: bash
        env:
          JK_RELEASE_RSA_SIGNING_KEY: ${{ secrets.JK_RELEASE_RSA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${JK_RELEASE_RSA_SIGNING_KEY:-}" ]]; then
            echo "::error::JK_RELEASE_RSA_SIGNING_KEY is not set in the release environment — scripts/release-environment.sh loads it"
            exit 1
          fi
          chmod +x scripts/sign-release.sh
          scripts/sign-release.sh "out/${JK_VERSION}/SHA256SUMS"
          ls -la "out/${JK_VERSION}/SHA256SUMS"*

      # jk runs firebase-tools below (`jk node exec`) and builds the two SDK modules the Central
      # bundles come from. The pinned release builds them: they are platform-neutral jars, and the
      # next step refuses a build whose jars differ from the staged repository's.
      - name: Bootstrap jk from the hosted release
        shell: bash
        run: |
          set -euo pipefail
          echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"
          JK_HOME="$RUNNER_TEMP/jk-home" bash scripts/ci-bootstrap.sh

      # The plugin SDK's Central bundles, signed with the release GPG key. Built here, from the
      # same commit, because the key lives only in this job's environment.
      - name: Sign the plugin SDK's Central bundles
        shell: bash
        env:
          JK_CENTRAL_GPG_KEY: ${{ secrets.JK_CENTRAL_GPG_KEY }}
          JK_GPG_PASSPHRASE: ${{ secrets.JK_CENTRAL_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "${JK_CENTRAL_GPG_KEY:-}" ]] || { echo "::error::JK_CENTRAL_GPG_KEY is not set in the release environment — Central refuses unsigned bundles"; exit 1; }
          jk build --skip-tests --no-ansi -m shared/host -m shared/plugin-sdk
          # The jar Central gets is the jar jumpkick.build serves, byte for byte.
          for module in host:jk-host plugin-sdk:jk-plugin-sdk; do
            dir="${module%%:*}"; art="${module##*:}"
            cmp "shared/${dir}/target/${art}-${JK_VERSION}.jar"               "target/release/repo/cc/jumpkick/${art}/${JK_VERSION}/${art}-${JK_VERSION}.jar"
          done
          key="$RUNNER_TEMP/central-gpg.asc"
          (umask 077 && printf '%s\n' "$JK_CENTRAL_GPG_KEY" > "$key")
          JK_CENTRAL_GPG_KEY_FILE="$key" scripts/publish-central.sh bundle target/release/central
          rm -f "$key"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.JK_RELEASE_GCS_SA_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Preconditions first, then the version tree and the Maven repository, and the latest pointer
      # as the very last object: an installer that reads it finds everything it names already there.
      # The pointer is one signed object (scripts/sign-latest-pointer.sh), so its publish is one copy.
      - name: Upload to GCS
        env:
          BUCKET: ${{ secrets.JK_RELEASE_GCS_BUCKET }}
          JK_RELEASE_RSA_SIGNING_KEY: ${{ secrets.JK_RELEASE_RSA_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          VER="$JK_VERSION"
          if [[ -z "${BUCKET:-}" ]]; then
            echo "JK_RELEASE_GCS_BUCKET empty"
            exit 1
          fi
          if [[ ! -d target/release/repo/cc ]]; then
            echo "no staged Maven repository (the linux-x86_64 build did not stage it)" >&2
            exit 1
          fi
          [[ -f "out/${VER}/SHA256SUMS.sig" ]] || { echo "out/${VER}/SHA256SUMS.sig missing — not publishing an unsigned tree" >&2; exit 1; }
          gsutil -m rsync -r -d "out/${VER}/" "gs://${BUCKET}/releases/${VER}/"
          # The plugin jars the engine fetches from jumpkick.build/repo/: additive, so earlier versions stay.
          gsutil -m rsync -r "target/release/repo/" "gs://${BUCKET}/repo/"
          echo "  gs://${BUCKET}/repo/cc/jumpkick/ ($(find target/release/repo -name '*.jar' | wc -l) jars)"
          scripts/sign-latest-pointer.sh "$VER" out/latest
          gsutil -h "Cache-Control:no-cache,max-age=0" cp "out/latest/LATEST" \
            "gs://${BUCKET}/releases/latest/LATEST"
          # VERSION is an unsigned convenience. Nothing verifies it, and nothing orders it
          # against LATEST. The detached signature from earlier releases is no longer read.
          gsutil -h "Cache-Control:no-cache,max-age=0" cp "out/latest/VERSION" \
            "gs://${BUCKET}/releases/latest/VERSION"
          gsutil rm "gs://${BUCKET}/releases/latest/LATEST.sig" || true
          echo "Published:"
          echo "  gs://${BUCKET}/releases/${VER}/"
          echo "  gs://${BUCKET}/releases/latest/LATEST"
          echo "  https://jumpkick.build/repo/cc/jumpkick/jk-formatter/${VER}/jk-formatter-${VER}.jar"
          gsutil ls -l "gs://${BUCKET}/releases/${VER}/"
          gsutil cat "gs://${BUCKET}/releases/latest/LATEST"

      # A plugin pins jk-plugin-sdk at the release it targets, so the release is not out until the
      # SDK and its one dependency answer at that version where jk resolves cc.jumpkick from.
      - name: The plugin SDK answers on jumpkick.build
        shell: bash
        run: |
          set -euo pipefail
          for art in jk-host jk-plugin-sdk; do
            url="https://jumpkick.build/repo/cc/jumpkick/${art}/${JK_VERSION}/${art}-${JK_VERSION}.pom"
            code="$(curl -sSL -o /dev/null -w '%{http_code}' "$url")"
            [[ "$code" == 200 ]] || { echo "::error::$url answered HTTP $code"; exit 1; }
            echo "$url"
          done

      # After jumpkick.build holds the same bytes. Released, not parked for a click: a re-run skips
      # a version the Portal already lists as published.
      - name: Publish the plugin SDK to Maven Central
        shell: bash
        env:
          JK_REPO_CENTRAL_USERNAME: ${{ secrets.JK_REPO_CENTRAL_USERNAME }}
          JK_REPO_CENTRAL_PASSWORD: ${{ secrets.JK_REPO_CENTRAL_PASSWORD }}
        run: scripts/publish-central.sh upload target/release/central

      # The installers under hosting/public carry this release's floor and signing key; they go
      # live after the pointer, so a freshly served install.sh never refuses the pointer it reads.
      # firebase-tools reads the service-account file the auth step exported.
      - name: Deploy the installers to jumpkick.build
        shell: bash
        run: jk node exec --node "$(tr -d '[:space:]' < .nvmrc)" -- npx --yes firebase-tools@15.30.2 deploy --only hosting --non-interactive

      # One build-provenance attestation per artifact — the clients, the engine jar and the SBOM —
      # signed with this run's OIDC identity and stored with the repository, verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/${{ env.JK_VERSION }}/jk-*
            out/sbom/jk-${{ env.JK_VERSION }}.cdx.json

      # Last: the GitHub Release for the tag is created (or, on a re-run, updated) with the tree,
      # the SBOM and the notes, and becomes latest. A re-run replaces the assets, as the rsync
      # above replaced the tree.
      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/publish-github-release.sh "$JK_VERSION" out/RELEASE_NOTES.md \
            out/"${JK_VERSION}"/* out/sbom/jk-"${JK_VERSION}".cdx.json

      # Very last, since Central syncs to repo1 minutes to an hour after it publishes: the run is
      # green only once a Maven or Gradle build can resolve the SDK at this version.
      - name: The plugin SDK resolves from repo1
        shell: bash
        run: scripts/publish-central.sh await "$JK_VERSION"
