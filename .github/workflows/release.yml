# The release build for the jumpkick.build layout, run by publishing a GitHub Release.
#
# Trigger: a GitHub Release published for tag vX.Y.Z (X.Y.Z must equal JkVersion without the v).
# The tag is a request; JkVersion.java is the answer, and a request that differs from it fails
# before anything is built (scripts/release-version.sh). Cutting a release: push the tag, then
# publish a release for it on GitHub (`gh release create vX.Y.Z --generate-notes`); this workflow
# builds every platform, signs the tree, uploads it to GCS, redeploys the installers and attaches
# the artifacts, the SBOM and the notes to that release. A workflow_dispatch is the dry run: it
# builds, flattens and signs, and stops with the tree as a workflow artifact; nothing is published.
#
# Secrets:
#   JK_RELEASE_RSA_SIGNING_KEY — base64 PKCS#8 DER RSA-3072 private key; only the publish job
#                                sees it, since only the combined SHA256SUMS is signed
#   JK_RELEASE_GCS_BUCKET      — GCS bucket name (no gs://), e.g. jumpkick
#   JK_RELEASE_GCS_SA_JSON     — GCP service-account JSON (storage.objectAdmin on the bucket,
#                                firebasehosting.admin on the hosting project)
#   GITHUB_TOKEN (automatic)   — read-only everywhere but the publish job, which writes the
#                                GitHub Release (contents) and its provenance attestations
#                                (id-token, attestations)
#
# Hosting: objects in GCS behind the Firebase CDN at https://jumpkick.build. Path:
#   gs://$JK_RELEASE_GCS_BUCKET/releases/<ver>/… and …/releases/latest/{LATEST,LATEST.sig,VERSION}
#
# The GitHub Release that triggered the run receives the same version tree (clients, engine jar,
# SHA256SUMS and its signature), the CycloneDX SBOM jk wrote of its engine (`jk publish --sbom
# --dry-run`, the document the engine jar embeds), notes from scripts/release-notes.sh (the
# version's highlights in docs/contributors/releases.md, then the commits since the previous tag)
# and a build-provenance attestation per artifact — attached last, once the bucket, the pointer
# and the installers are live, so the release never announces bytes an installer cannot fetch.

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

env:
  TERM: xterm-256color
  # Empty on a dispatch: scripts/release-version.sh then answers with the declared version.
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: ${{ matrix.arch_label }}
    strategy:
      fail-fast: false
      matrix:
        # One row per platform jumpkick.build serves a client for at the release
        # .jk/ci-bootstrap-version pins — a native client for linux-x86_64 and windows-x86_64, the
        # JVM client everywhere else the installer runs. jk is installed the way a user installs
        # it, the same bootstrap as ci.yml's self-host job, and builds this commit's dist.
        # linux-aarch64 and macos-x86_64 have no runner here and no client in the tree; the
        # platform list the publish job flattens (JK_RELEASE_PLATFORMS below) names exactly the
        # rows of this matrix.
        include:
          - os: ubuntu-latest
            arch_label: linux-x86_64
          - os: macos-14
            arch_label: macos-aarch64
          # Visual Studio 2022: native-image locates that one on its own, and the hosted jk that
          # bootstraps this row predates the engine passing the developer prompt's INCLUDE and
          # LIB through. Once the pin is a release that does, any Windows image serves.
          - os: windows-2022
            arch_label: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      JK_AOT_TRAIN: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The home sits outside the checkout: the guard lanes of `jk build` read the whole workspace,
      # and on Windows a read of the engine's byte-range-locked files under the home fails.
      - name: Home outside the checkout
        shell: bash
        run: echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"

      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(scripts/release-version.sh "${RELEASE_TAG#v}")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building release $VER (${{ matrix.arch_label }})"

      # The shipped artifacts are what jk builds of itself. The jk that builds them is the hosted
      # release .jk/ci-bootstrap-version pins, installed as a user would. JK_VERSION in this job's
      # environment is the release being cut, so the bootstrap version rides the installer's own
      # environment and nothing else.
      # The pin serves no macOS native client, so that row asks the installer for the JVM client.
      - name: Bootstrap jk from the hosted release
        if: runner.os != 'Windows'
        shell: bash
        env:
          JK_CLIENT: ${{ runner.os == 'macOS' && 'jvm' || 'native' }}
        run: |
          set -euo pipefail
          bootstrap="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          echo "bootstrapping jk $bootstrap ($JK_CLIENT client) from https://jumpkick.build"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$bootstrap" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      # native-image compiles C on Windows with MSVC and needs the Visual Studio environment
      # (INCLUDE, LIB, PATH) the developer prompt sets; the engine that runs native-image inherits
      # it from the first jk invocation, so it is set before jk is installed.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'

      - name: Bootstrap jk from the hosted release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:JK_VERSION = (Get-Content .jk/ci-bootstrap-version -Raw).Trim()
          Write-Host "bootstrapping jk $env:JK_VERSION from https://jumpkick.build"
          Invoke-RestMethod https://jumpkick.build/install.ps1 | Invoke-Expression
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:JK_HOME 'bin')

      - name: Dist (native client + engine), built by jk
        shell: bash
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi
          ls -la target/dist target/dist/lib

      # The first-party plugins (formatter, compilers, test runner, guard packs, …) the release
      # ships to jumpkick.build/repo/ are the ones this commit builds, put on this runner's shelf
      # by `jk install` (a hosted bootstrap shelves nothing of this commit's) and laid out as the
      # Maven repository serves them. Staged here and uploaded by `publish`, which runs on a
      # runner with no store.
      - name: Shelve this commit's first-party plugins
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: jk install --skip-tests --no-ansi

      # The bill of materials of the engine, written by the jk that built it: `jk publish --sbom
      # --dry-run` leaves the CycloneDX document in the module's build output (a workspace
      # member's sits under the root's target/) without an upload, and it is the one the engine
      # jar embeds under META-INF/sbom/ (one writer, derived from jk-lock.toml;
      # docs/user/packaging.md). Staged beside the version tree, never in it, so the signed
      # SHA256SUMS the installers verify stays byte for byte what the publish job signs.
      - name: Write the SBOM of the engine
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          (cd server/engine && jk publish --sbom --dry-run --no-ansi)
          mkdir -p out/sbom
          sbom="out/sbom/jk-${JK_VERSION}.cdx.json"
          cp "target/server/engine/sbom/jk-engine-${JK_VERSION}.cdx.json" "$sbom"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.6" and (.components | length) > 0 and (.metadata.component.name == "jk-engine")' "$sbom" >/dev/null
          echo "SBOM: $(jq '.components | length' "$sbom") components, CycloneDX $(jq -r .specVersion "$sbom")"

      - name: Upload the SBOM (artifact)
        if: matrix.arch_label == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ env.JK_VERSION }}
          path: out/sbom
          if-no-files-found: error

      - name: Stage the first-party Maven repository
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          JK_MAVEN_STAGE_ONLY=1 JK_MAVEN_STAGE_DIR=target/release/repo scripts/publish-maven-repo.sh
          find target/release/repo -name '*.jar' | sed 's|target/release/repo/||' | sort

      - name: Upload the Maven repository (artifact)
        if: matrix.arch_label == 'linux-x86_64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-repo-${{ env.JK_VERSION }}
          path: target/release/repo
          if-no-files-found: error

      # Unsigned: the per-platform SHA256SUMS is discarded when the trees are merged, and the
      # signing key stays with the one job whose signature ships.
      - name: Assemble release dir
        shell: bash
        env:
          DIST_DIR: target/dist
        run: |
          set -euo pipefail
          chmod +x scripts/assemble-release-dir.sh
          OUT="target/release/${JK_VERSION}-${{ matrix.arch_label }}"
          scripts/assemble-release-dir.sh "$OUT"
          ls -la "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.JK_VERSION }}-${{ matrix.arch_label }}
          path: target/release/${{ env.JK_VERSION }}-${{ matrix.arch_label }}/
          if-no-files-found: error

  publish:
    name: Merge + publish
    needs: build
    runs-on: ubuntu-latest
    # Runs once the matrix has finished, whatever its outcome, so a missing platform is reported
    # here by name instead of the job being skipped; the flatten step refuses a partial tree.
    if: ${{ always() && !cancelled() }}
    # The one job that writes: the GitHub Release (contents) and the provenance attestations
    # (id-token for the OIDC identity, attestations for the store). GCS and Firebase are reached
    # with the service-account secret, never with this token.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # The platforms the flatten requires: every row of the build matrix, and nothing the matrix
      # cannot build. A tree short of one of these is refused, never published.
      JK_RELEASE_PLATFORMS: linux-x86_64 macos-aarch64 windows-x86_64
    steps:
      # The whole history and every tag: the notes list the commits since the previous release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VER="$(scripts/release-version.sh "${RELEASE_TAG#v}")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"

      # A precondition, before anything is downloaded: the version's highlights entry in
      # docs/contributors/releases.md, then the commits since the previous tag. A version with no
      # entry is refused here, with nothing published yet.
      - name: Release notes
        shell: bash
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$JK_VERSION" > "$RUNNER_TEMP/RELEASE_NOTES.md"
          cat "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging
          pattern: release-*
          merge-multiple: false

      - name: Download the Maven repository
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: target/release/repo
          pattern: maven-repo-*
          merge-multiple: true

      # One tree from the matrix: each platform's client, and the platform-neutral jars from
      # linux-x86_64 alone. The refusals (a missing platform, an engine jar whose bytes differ, two
      # trees carrying one name) live in the script, which scripts/test-flatten-release.sh
      # exercises in the gate.
      - name: Flatten into version directory
        shell: bash
        run: scripts/flatten-release.sh staging "out/${JK_VERSION}" "$JK_VERSION"

      - name: Re-sign combined SHA256SUMS
        shell: bash
        env:
          JK_RELEASE_RSA_SIGNING_KEY: ${{ secrets.JK_RELEASE_RSA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${JK_RELEASE_RSA_SIGNING_KEY:-}" ]]; then
            echo "JK_RELEASE_RSA_SIGNING_KEY missing — combined sums unsigned"
            exit 1
          fi
          chmod +x scripts/sign-release.sh
          scripts/sign-release.sh "out/${JK_VERSION}/SHA256SUMS"
          ls -la "out/${JK_VERSION}/SHA256SUMS"*

      # The SBOM the linux-x86_64 build job wrote of the engine (`jk publish --sbom --dry-run`),
      # beside the tree, not in it: the signed SHA256SUMS the installers verify stays byte for
      # byte what this job signs.
      - name: Download the SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out/sbom
          pattern: sbom-*
          merge-multiple: true

      - name: The SBOM is here
        shell: bash
        run: |
          set -euo pipefail
          sbom="out/sbom/jk-${JK_VERSION}.cdx.json"
          [[ -f "$sbom" ]] || { echo "$sbom missing — the linux-x86_64 build did not write it" >&2; exit 1; }
          echo "SBOM: $(jq '.components | length' "$sbom") components, CycloneDX $(jq -r .specVersion "$sbom")"

      - name: Upload merged release tree (artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ env.JK_VERSION }}-merged
          path: out/

      # Everything below publishes. A dispatch is the dry run and ends here, with the signed tree
      # in the artifact above.
      - name: Authenticate to Google Cloud
        if: github.event_name == 'release'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.JK_RELEASE_GCS_SA_JSON }}

      - name: Set up Cloud SDK
        if: github.event_name == 'release'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Preconditions first, then the version tree and the Maven repository, and the latest pointer
      # as the very last objects: an installer that reads it finds everything it names already there.
      # The pointer is signed data (scripts/sign-latest-pointer.sh); its signature goes up before
      # the pointer, so a client reading mid-publish gets a refusal, never an unverified version.
      - name: Upload to GCS
        if: github.event_name == 'release'
        env:
          BUCKET: ${{ secrets.JK_RELEASE_GCS_BUCKET }}
          JK_RELEASE_RSA_SIGNING_KEY: ${{ secrets.JK_RELEASE_RSA_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          VER="$JK_VERSION"
          if [[ -z "${BUCKET:-}" ]]; then
            echo "JK_RELEASE_GCS_BUCKET empty"
            exit 1
          fi
          if [[ ! -d target/release/repo/cc ]]; then
            echo "no staged Maven repository (the linux-x86_64 build did not stage it)" >&2
            exit 1
          fi
          [[ -f "out/${VER}/SHA256SUMS.sig" ]] || { echo "out/${VER}/SHA256SUMS.sig missing — not publishing an unsigned tree" >&2; exit 1; }
          gsutil -m rsync -r -d "out/${VER}/" "gs://${BUCKET}/releases/${VER}/"
          # The plugin jars the engine fetches from jumpkick.build/repo/: additive, so earlier versions stay.
          gsutil -m rsync -r "target/release/repo/" "gs://${BUCKET}/repo/"
          echo "  gs://${BUCKET}/repo/cc/jumpkick/ ($(find target/release/repo -name '*.jar' | wc -l) jars)"
          scripts/sign-latest-pointer.sh "$VER" out/latest
          for object in LATEST.sig LATEST VERSION; do
            gsutil -h "Cache-Control:no-cache,max-age=0" cp "out/latest/$object" \
              "gs://${BUCKET}/releases/latest/$object"
          done
          echo "Published:"
          echo "  gs://${BUCKET}/releases/${VER}/"
          echo "  gs://${BUCKET}/releases/latest/{LATEST,LATEST.sig,VERSION}"
          echo "  https://jumpkick.build/repo/cc/jumpkick/jk-formatter/${VER}/jk-formatter-${VER}.jar"
          gsutil ls -l "gs://${BUCKET}/releases/${VER}/"
          gsutil cat "gs://${BUCKET}/releases/latest/LATEST"

      # The installers under hosting/public carry this release's floor and signing key; they go
      # live after the pointer, so a freshly served install.sh never refuses the pointer it reads.
      # firebase-tools reads the service-account file the auth step exported.
      - name: Deploy the installers to jumpkick.build
        if: github.event_name == 'release'
        shell: bash
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting --non-interactive

      # One build-provenance attestation per artifact — the clients, the engine jar and the SBOM —
      # signed with this run's OIDC identity and stored with the repository, verifiable with
      # `gh attestation verify <file> --repo <owner>/<repo>`.
      - name: Attest build provenance
        if: github.event_name == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/${{ env.JK_VERSION }}/jk-*
            out/sbom/jk-${{ env.JK_VERSION }}.cdx.json

      # Last: the release that triggered the run receives the tree, the SBOM and the notes, and
      # becomes latest. A re-run replaces the assets, as the rsync above replaced the tree.
      - name: Attach the tree to the GitHub Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/publish-github-release.sh "$JK_VERSION" "$RUNNER_TEMP/RELEASE_NOTES.md" \
            out/"${JK_VERSION}"/* out/sbom/jk-"${JK_VERSION}".cdx.json
