# Tag-triggered release build + sign for the jumpkick.build layout.
#
# Trigger: push tag v0.13.3 (or any vX.Y.Z matching JkVersion without the v). The tag or the
# dispatch input is a request; JkVersion.java is the answer, and a request that differs from it
# fails before anything is built (scripts/release-version.sh).
#
# Secrets:
#   JK_RELEASE_RSA_SIGNING_KEY — base64 PKCS#8 DER RSA-3072 private key; only the publish job
#                                sees it, since only the combined SHA256SUMS is signed
#   JK_RELEASE_GCS_BUCKET      — GCS bucket name (no gs://), e.g. jumpkick
#   JK_RELEASE_GCS_SA_JSON     — GCP service-account JSON (storage.objectAdmin on the bucket)
#
# Hosting: objects in GCS; public CDN will be Firebase later. Path:
#   gs://$JK_RELEASE_GCS_BUCKET/releases/<ver>/… and …/releases/latest/VERSION
# Public HTTPS (until Firebase): https://storage.googleapis.com/$BUCKET/releases/…

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no v prefix), e.g. 0.13.3'
        required: true
        default: '0.13.3'

env:
  TERM: xterm-256color

jobs:
  build:
    name: ${{ matrix.arch_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch_label: linux-x86_64
          - os: ubuntu-24.04-arm
            arch_label: linux-aarch64
          - os: macos-15-intel
            arch_label: macos-x86_64
          - os: macos-14
            arch_label: macos-aarch64
          - os: windows-latest
            arch_label: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      JK_AOT_TRAIN: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # The dispatch input reaches the shell as a variable, never as text spliced into the script.
      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            REQUESTED_VERSION="${GITHUB_REF_NAME#v}"
          fi
          VER="$(scripts/release-version.sh "$REQUESTED_VERSION")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Building release $VER (${{ matrix.arch_label }})"

      # The shipped artifacts are what jk builds of itself. Until a release built this way is
      # hosted, the jk that builds them is bootstrapped from this commit's Gradle artifacts; once
      # one is, this step becomes `curl install.sh | JK_VERSION=<pinned> bash`.
      - name: Bootstrap jk from Gradle artifacts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      # The first-party plugins (formatter, compilers, test runner, guard packs, …) that `installLocal`
      # just put in this runner's store, laid out as the Maven repository jumpkick.build/repo/ serves.
      # Staged here and uploaded by `publish`, which runs on a runner with no store.
      - name: Stage the first-party Maven repository
        if: matrix.arch_label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          JK_MAVEN_STAGE_ONLY=1 JK_MAVEN_STAGE_DIR=out/repo scripts/publish-maven-repo.sh
          find out/repo -name '*.jar' | sed 's|out/repo/||' | sort

      - name: Upload the Maven repository (artifact)
        if: matrix.arch_label == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: maven-repo-${{ env.JK_VERSION }}
          path: out/repo
          if-no-files-found: error

      - name: Dist (native client + engine), built by jk
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          jk build --skip-tests
          ls -la target/dist target/dist/lib

      # Windows still ships from Gradle: the self-host lane is not green there yet.
      - name: Dist (native client + engine), built by Gradle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean dist --no-daemon
          ls -la build/dist build/dist/lib

      # Unsigned: the per-platform SHA256SUMS is discarded when the trees are merged, and the
      # signing key stays with the one job whose signature ships.
      - name: Assemble release dir
        shell: bash
        env:
          DIST_DIR: ${{ runner.os == 'Windows' && 'build/dist' || 'target/dist' }}
        run: |
          set -euo pipefail
          chmod +x scripts/assemble-release-dir.sh
          OUT="build/release/${JK_VERSION}-${{ matrix.arch_label }}"
          scripts/assemble-release-dir.sh "$OUT"
          ls -la "$OUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.JK_VERSION }}-${{ matrix.arch_label }}
          path: build/release/${{ env.JK_VERSION }}-${{ matrix.arch_label }}/
          if-no-files-found: error

  publish:
    name: Merge + publish to GCS
    needs: build
    runs-on: ubuntu-latest
    # Runs once the matrix has finished, whatever its outcome, so a missing platform is reported
    # here by name instead of the job being skipped; the flatten step refuses a partial tree.
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      # The dispatch input reaches the shell as a variable, never as text spliced into the script.
      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            REQUESTED_VERSION="${GITHUB_REF_NAME#v}"
          fi
          VER="$(scripts/release-version.sh "$REQUESTED_VERSION")"
          echo "JK_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: staging
          pattern: release-*
          merge-multiple: false

      - name: Download the Maven repository
        uses: actions/download-artifact@v4
        with:
          path: out/repo
          pattern: maven-repo-*
          merge-multiple: true

      # One tree from five: each platform's client, and the engine jar from linux-x86_64 alone —
      # every platform builds the same jar, and one whose bytes differ is a build to explain, not
      # a copy to overwrite. A platform whose artifact is missing fails the release here.
      - name: Flatten into version directory
        shell: bash
        run: |
          set -euo pipefail
          VER="$JK_VERSION"
          ENGINE="jk-engine-${VER}.jar"
          mkdir -p "out/${VER}"
          canonical="staging/release-${VER}-linux-x86_64/${ENGINE}"
          if [[ ! -f "$canonical" ]]; then
            echo "missing $canonical — the linux-x86_64 build did not produce the engine jar" >&2
            exit 1
          fi
          canonical_sha="$(sha256sum "$canonical" | awk '{print $1}')"
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              SHA256SUMS|SHA256SUMS.sig) continue ;;
              "$ENGINE")
                sha="$(sha256sum "$f" | awk '{print $1}')"
                if [[ "$sha" != "$canonical_sha" ]]; then
                  echo "$f differs from $canonical ($sha vs $canonical_sha) — the platforms built different engines" >&2
                  exit 1
                fi
                [[ "$f" == "$canonical" ]] || continue
                ;;
            esac
            if [[ -e "out/${VER}/$base" ]]; then
              echo "two platform trees carry $base — the flatten would pick one by listing order" >&2
              exit 1
            fi
            cp -f "$f" "out/${VER}/$base"
          done < <(find staging -type f -print0)
          missing=0
          for client in linux-x86_64 linux-aarch64 macos-x86_64 macos-aarch64 windows-x86_64; do
            if [[ ! -f "out/${VER}/jk-${client}-${VER}.xz" ]]; then
              echo "missing client jk-${client}-${VER}.xz — the ${client} build did not finish" >&2
              missing=$((missing + 1))
            fi
          done
          [[ -f "out/${VER}/jk-windows-x86_64-${VER}.zip" ]] || { echo "missing jk-windows-x86_64-${VER}.zip" >&2; missing=$((missing + 1)); }
          if [[ "$missing" -gt 0 ]]; then
            echo "$missing artifact(s) missing: a partial matrix is not a release; re-run the failed builds and this job" >&2
            exit 1
          fi
          (
            cd "out/${VER}"
            sha256sum * >SHA256SUMS
          )
          echo "=== out/${VER} ==="
          ls -la "out/${VER}"

      - name: Re-sign combined SHA256SUMS
        shell: bash
        env:
          JK_RELEASE_RSA_SIGNING_KEY: ${{ secrets.JK_RELEASE_RSA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${JK_RELEASE_RSA_SIGNING_KEY:-}" ]]; then
            echo "JK_RELEASE_RSA_SIGNING_KEY missing — combined sums unsigned"
            exit 1
          fi
          chmod +x scripts/sign-release.sh
          scripts/sign-release.sh "out/${JK_VERSION}/SHA256SUMS"
          ls -la "out/${JK_VERSION}/SHA256SUMS"*

      - name: Upload merged release tree (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.JK_VERSION }}-merged
          path: out/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.JK_RELEASE_GCS_SA_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Preconditions first, then the version tree and the Maven repository, and the latest pointer
      # as the very last object: an installer that reads it finds everything it names already there.
      - name: Upload to GCS
        env:
          BUCKET: ${{ secrets.JK_RELEASE_GCS_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          VER="$JK_VERSION"
          if [[ -z "${BUCKET:-}" ]]; then
            echo "JK_RELEASE_GCS_BUCKET empty"
            exit 1
          fi
          if [[ ! -d out/repo/cc ]]; then
            echo "no staged Maven repository (the linux-x86_64 build did not stage it)" >&2
            exit 1
          fi
          [[ -f "out/${VER}/SHA256SUMS.sig" ]] || { echo "out/${VER}/SHA256SUMS.sig missing — not publishing an unsigned tree" >&2; exit 1; }
          gsutil -m rsync -r -d "out/${VER}/" "gs://${BUCKET}/releases/${VER}/"
          # The plugin jars the engine fetches from jumpkick.build/repo/: additive, so earlier versions stay.
          gsutil -m rsync -r "out/repo/" "gs://${BUCKET}/repo/"
          echo "  gs://${BUCKET}/repo/cc/jumpkick/ ($(find out/repo -name '*.jar' | wc -l) jars)"
          mkdir -p out/latest
          printf '%s\n' "$VER" > out/latest/VERSION
          gsutil -h "Cache-Control:no-cache,max-age=0" cp out/latest/VERSION \
            "gs://${BUCKET}/releases/latest/VERSION"
          echo "Published:"
          echo "  gs://${BUCKET}/releases/${VER}/"
          echo "  gs://${BUCKET}/releases/latest/VERSION"
          echo "  https://storage.googleapis.com/${BUCKET}/releases/latest/VERSION"
          echo "  https://jumpkick.build/repo/cc/jumpkick/jk-formatter/${VER}/jk-formatter-${VER}.jar"
          gsutil ls -l "gs://${BUCKET}/releases/${VER}/"
          gsutil cat "gs://${BUCKET}/releases/latest/VERSION"
