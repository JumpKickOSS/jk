# JK-1073 — Windows + macOS CI lanes (nightly only; Linux stays on push in ci.yml).
# Bryan: per-OS runners are expensive (macOS ~10×, Windows ~2× vs Linux) → schedule,
# not every push. Manual re-run: Actions → "CI (OS nightly)" → Run workflow.
name: CI (OS nightly)

on:
  schedule:
    # 06:15 UTC daily (after typical US-evening pushes land).
    - cron: "15 6 * * *"
  workflow_dispatch:

env:
  TERM: xterm-256color

jobs:
  windows-test:
    name: Windows test (core/wire/engine/cli)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # Real os.name — no forced Windows property. Covers JK-1011 TCP+token transport
      # on hardware (loopback) rather than under a simulated OS.
      - name: Module tests
        shell: bash
        run: ./gradlew :core:test :wire:test :engine:test :cli:test --no-daemon

      - name: Local install.ps1 (stub binary path)
        shell: pwsh
        run: |
          # Local-dist path: script must accept a path and not crash when the
          # binary is missing only after documenting usage. Build thin client bits.
          ./gradlew :cli:installDist :engine:shadowJar --no-daemon
          $client = Get-ChildItem -Path "clients/cli/build/install/jk/bin" -Filter "jk*" | Select-Object -First 1
          if (-not $client) { throw "thin client installDist produced no jk binary" }
          pwsh -File scripts/install.ps1 -LocalPath $client.FullName -SkipEngineWarm

  macos-test:
    name: macOS test (core/wire/engine/cli)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Module tests
        run: ./gradlew :core:test :wire:test :engine:test :cli:test --no-daemon

      - name: Thin-client smoke (no Graal)
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          export PATH="$PWD/clients/cli/build/install/jk/bin:$PATH"
          jk --version
          rm -rf /tmp/jk-os-smoke && mkdir -p /tmp/jk-os-smoke && cd /tmp/jk-os-smoke
          jk init
          jk build --skip-tests
