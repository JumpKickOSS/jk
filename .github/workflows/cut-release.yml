# Cuts a release with `jk release`, the same verb a developer runs by hand: it builds and tests the
# version jk.toml declares, installs it, tags the commit (the tag template is `[release] tag`) and
# moves jk.toml, the lock and the workspace members to the next version in a commit of its own, then
# pushes the branch and the tag. The tests run once, in CI, on the tag: this job skips them. A green
# CI run on the tag starts the Release workflow (build every platform, then, after the `release`
# environment's reviewer approves, sign and publish to jumpkick.build); a red one ends the release.
#
# Run it from the Actions tab on the branch to release; `next` picks the version segment that moves
# AFTER the release (patch by default). A dirty tree, an existing tag, a -SNAPSHOT version or a
# version the publish repository already holds is refused before anything is built.
#
# main moves only through the merge queue, so the job pushes with the write deploy key the
# `cut-release` environment holds (JK_RELEASE_PUSH_KEY), the one actor main's ruleset lets push. A
# push made with that key starts workflows, so the tag push itself starts CI on the tag.

name: Cut release

on:
  workflow_dispatch:
    inputs:
      next:
        description: 'The version segment that moves after the release'
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: cut-release
  cancel-in-progress: false

env:
  TERM: xterm-256color

jobs:
  release:
    name: Tag the declared version and start the next
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: cut-release
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.JK_RELEASE_PUSH_KEY }}

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      # The tag and the bump commit are made by whoever started the run.
      - name: Commit identity
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

      - name: jk release
        env:
          NEXT: ${{ inputs.next }}
        run: jk release "--${NEXT}" --skip-tests --push --no-ansi
