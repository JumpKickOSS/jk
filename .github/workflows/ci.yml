name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners set TERM=dumb, which turns off ANSI rendering and fails TUI tests
  # that assert escape sequences. Match a real terminal.
  TERM: xterm-256color

jobs:
  # Guard: commit messages must not carry agent/tool attribution trailers.
  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages
        run: bash scripts/check-no-agent-attribution.sh

  # Fast unit tier only — excludes @Tag(integration|slow|bench). Target <5 min.
  test:
    name: Gradle unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Unit test
        run: ./gradlew test --no-daemon
