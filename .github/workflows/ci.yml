name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners set TERM=dumb, which turns off ANSI rendering and fails TUI tests
  # that assert escape sequences. Match a real terminal.
  TERM: xterm-256color

jobs:
  # Guard: commit messages must not carry agent/tool attribution trailers.
  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages
        run: bash scripts/check-no-agent-attribution.sh

  # Unit tier plus every network-free structural guard. Target <5 min.
  test:
    name: Fast branch gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # The dashboard's JS suites run under `node --test` and are part of the unit tier.
      # WebClientJsTest fails the build when node is missing. The version is `.nvmrc`.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Unit tests and structural guards
        run: ./gradlew checkFast --no-daemon

      - name: Shell installer verification fixtures
        run: bash scripts/test-installer-verification.sh

  # The boundary lane. `checkFast` is network-free and fast but runs no integration class, so a
  # wire, spawn, worker, workspace, install or lock regression can merge with a deterministic
  # integration test sitting in the nightly tier that would have caught it. Membership is
  # curated-integration.txt; guard G63 (checkCuratedIntegration) owns the registry's integrity and
  # the existence of this job. The full tier stays nightly and complete.
  #
  # Its own job, alongside `test` rather than after it: a curated failure and a unit failure are
  # different reports and a contributor should get both from one push.
  curated-integration:
    name: Curated integration lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Budget: 8 minutes wall clock for this step. Over it, drop or split an entry — raising the
      # number turns the lane back into the full tier the branch gate cannot afford.
      - name: Curated integration tests
        timeout-minutes: 8
        run: ./gradlew curatedIntegrationTest --no-daemon

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: curated-integration-results
          path: '**/build/test-results/curatedIntegrationTest/'
          if-no-files-found: warn
          retention-days: 7

  # JumpKick building JumpKick. Gradle is the bootstrap oracle and stays the merge authority;
  # this job is the product proving that the checked-out jk.toml / jk-lock.toml graph builds,
  # passes its own house-rule gate, and runs its fast test tier through jk itself.
  #
  # Everything the job installs lands in a scratch JK_HOME inside the workspace, never the
  # runner's default ~/.jk. A self-host lane that can read a home some other job populated is a
  # lane that can pass on state the pull request did not produce.
  #
  # Unlike `test`, this job needs the network: a self-host build resolves the workspace's
  # dependencies. Authority and cutover criteria: docs/contributors/self-host.md.
  self-host:
    name: Self-host (jk builds jk)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
      # Nothing here is long-lived enough to amortise training a cache it then throws away.
      JK_AOT_TRAIN: 'off'
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # Only artifacts this workflow produced: the native client and engine jar from Gradle,
      # plus the plugin workers installLocal side-loads into the isolated home.
      - name: Bootstrap jk from Gradle artifacts
        run: |
          set -euo pipefail
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: Engine smoke
        run: jk engine status

      - name: Self-host build and house-rule gate
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi 2>&1 | tee "$RUNNER_TEMP/self-host-build.log"

      # The gate reports every broken rule in one message, under a banner per guard. Lift those
      # banners into annotations so a parity failure is attributed to the guard that owns it
      # instead of being one more line of build output.
      - name: Attribute house-rule gate failures
        if: failure()
        run: |
          log="$RUNNER_TEMP/self-host-build.log"
          [ -f "$log" ] || exit 0
          found=0
          while read -r guard; do
            [ -z "$guard" ] && continue
            found=1
            echo "::error title=$guard::the self-host house-rule gate failed this guard; its full message is in the build step's log"
          done <<EOF
          $(grep -F '────────' "$log" | tr -d '─' | sed 's/^ *//; s/ *$//')
          EOF
          if [ "$found" = 0 ]; then
            echo "::notice::the self-host build failed before or outside the house-rule gate"
          fi

      - name: Self-host fast test tier
        run: jk test --no-ansi

      # Lockfile is law: jk.toml pins exactly, so a build that rewrites the committed lock means
      # a pin drifted or the lock writer put something non-deterministic in the file.
      - name: The build must not rewrite the committed lock
        run: git diff --exit-code -- jk-lock.toml

  installer-windows:
    name: PowerShell 5.1 installer verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run network-free verification fixtures
        shell: powershell
        run: .\scripts\test-installer-verification.ps1
