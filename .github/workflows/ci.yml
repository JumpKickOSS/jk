name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Runners set TERM=dumb, which turns off ANSI rendering and fails TUI tests
  # that assert escape sequences. Match a real terminal.
  TERM: xterm-256color

jobs:
  # Guard: commit messages must not carry agent/tool attribution trailers.
  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan commit messages
        run: bash scripts/check-no-agent-attribution.sh

  # Fast unit tier only — excludes @Tag(integration|slow|bench). Target <5 min.
  test:
    name: Gradle unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Unit test
        run: ./gradlew test --no-daemon

  # Integration/e2e: always on main push; on PR when CLI/engine/plugins/wire change.
  integration:
    name: Gradle integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            heavy:
              - 'clients/cli/**'
              - 'server/engine/**'
              - 'server/resolver/**'
              - 'server/io/**'
              - 'plugins/**'
              - 'shared/wire/**'
              - 'buildSrc/**'
              - 'gradle/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - '.github/workflows/ci.yml'

      - uses: actions/setup-java@v4
        if: github.event_name == 'push' || steps.filter.outputs.heavy == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Integration test
        if: github.event_name == 'push' || steps.filter.outputs.heavy == 'true'
        run: ./gradlew integrationTest --no-daemon

  # ticket-1007/1018: dogfood workspace lock + build with a freshly built jk.
  self-host:
    name: Self-host workspace (jk, native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native client needs GraalVM; engine jar is a normal HotSpot fat jar.
      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1.6.3
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Bootstrap dist + workers
        run: |
          ./gradlew dist installLocal --no-daemon
          ./install.sh build/dist/jk
          echo "$HOME/.jk/versions/0.12.0/bin" >> "$GITHUB_PATH"

      - name: jk lock + build + install-local + library tests
        env:
          # Nested engines / short-lived workers: no AOT train-on-miss (still use caches if present).
          JK_AOT_TRAIN: off
        run: |
          jk --version
          jk lock
          jk build --skip-tests
          # Side-load pure-jk assembly workers (also covered by installLocal above).
          jk plugin install-local
          # Full pure-jk suite including clients/cli (nested engines use isolated JK_STATE_DIR).
          # C2: cross-module parallel is the product default; -j0 -w0 explicit for clarity.
          # Hermetic modules pin [test] workers=1 (e.g. clients/cli).
          jk test -j0 -w0 --modules 'shared/*,server/io,server/resolver,server/toolchain,server/engine,clients/cli,plugins/*'
          # Ship layout: native job has Graal — stage native CLI when present; dry-run plan first.
          jk release --skip-tests --dry-run
          jk release --skip-tests

  # ticket-1020: thin client + engine jar (no monolyth, no Graal).
  self-host-jvm:
    name: Self-host workspace (jk, thin client + engine jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          echo "$PWD/clients/cli/build/install/jk/bin" >> "$GITHUB_PATH"

      # Dogfooded format gate (JK-1664). Lives here rather than in its own job so it reuses
      # this job's bootstrap instead of paying a second one — and runs before the heavy steps
      # so drift fails in seconds.
      - name: Format check
        run: |
          jk lock
          jk format --check || {
            echo "::error::Source is unformatted. Run 'jk format' and commit the result."
            exit 1
          }

      - name: jk lock + build + install-local + library tests
        env:
          JK_AOT_TRAIN: off
        run: |
          jk --version
          jk build --skip-tests
          jk plugin install-local
          # Same pure-jk suite as native job (C2 default parallel tests); release stages bootstrap client.
          jk test -j0 -w0 --modules 'shared/*,server/io,server/resolver,server/toolchain,server/engine,clients/cli,plugins/*'
          jk release --skip-tests --skip-native --dry-run
          jk release --skip-tests --skip-native

  # ticket-1038: multi-module sample with reinstalled thin client (no Graal required).
  showcase:
    name: Showcase monorepo (jk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Bootstrap thin client + engine jar + workers
        run: |
          ./gradlew :cli:installDist :engine:shadowJar installLocal --no-daemon
          CLIENT_BIN="$PWD/clients/cli/build/install/jk/bin/jk"
          ENGINE_JAR=$(ls "$PWD/server/engine/build/libs/jk-engine-"*.jar | head -1)
          "$CLIENT_BIN" self materialize "$CLIENT_BIN" "$ENGINE_JAR"
          echo "$PWD/clients/cli/build/install/jk/bin" >> "$GITHUB_PATH"

      - name: Showcase lock + build + test
        working-directory: docs/features/examples/workspace-showcase
        run: |
          jk --version
          jk lock
          jk build
          # Workspace root test does not cascade; select modules that carry tests.
          jk test --modules app
          jk build --modules app
