name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runners set TERM=dumb, which turns off ANSI rendering and fails TUI tests
  # that assert escape sequences. Match a real terminal.
  TERM: xterm-256color

jobs:
  # Guard: commit messages must not carry agent/tool attribution trailers.
  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan commit messages
        run: bash scripts/check-no-agent-attribution.sh

  # The shell fixtures behind the installers, the wrapper, the Maven-repository publisher, the
  # release scripts and the curated lane's runner: network-free, and they need bash, openssl and xz
  # rather than a JDK, so they are a merge requirement of their own instead of sharing a verdict
  # with the self-host job.
  fixtures:
    name: Shell fixtures (installer, wrapper, publish, release, curated lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell installer verification fixtures
        run: bash scripts/test-installer-verification.sh

      - name: Wrapper bootstrap fixtures
        run: bash scripts/test-wrapper-bootstrap.sh

      - name: Maven-repository publish fixtures
        run: bash scripts/test-publish-maven-repo.sh

      - name: Release-version fixtures
        run: bash scripts/test-release-version.sh

      - name: Release-flatten fixtures
        run: bash scripts/test-flatten-release.sh

      - name: GitHub Release attach fixtures
        run: bash scripts/test-publish-github-release.sh

      - name: Example lock-drift fixtures
        run: bash scripts/test-examples-lock-drift.sh

      - name: Curated integration lane fixtures
        run: bash scripts/test-curated-integration.sh

      - name: Shelf descriptor check fixtures
        run: bash scripts/test-check-shelf-descriptors.sh

  # The workflow files themselves. actionlint (syntax, expressions, shellcheck of every run:
  # script), then the two rules scripts/check-workflows.sh owns: every action pinned to a commit
  # sha with its tag in a comment, every workflow's token read-only unless a job says otherwise.
  # A floating tag on a uses: line is a name someone else can move under the job that holds the
  # signing key; this is the job that refuses one on a pull request. actionlint arrives as a
  # release archive checked against a checksum written here, never a `go install` of a branch.
  workflows:
    name: Workflow lint (actionlint, pins, permissions)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint, pinned by version and checksum
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pins, permissions and actionlint
        run: scripts/check-workflows.sh

  # JumpKick building JumpKick: the merge authority. A released jk, installed the way a user
  # installs it, builds the checked-out jk.toml / jk-lock.toml graph; then the checkout's own
  # client, engine and workers take the home over (`jk install`), so the house-rule gate, the
  # fast test tier, the curated integration lane and the audit of the lock are run by the commit's
  # jk, not by the release that bootstrapped it. No step here runs a second build system: the `ci-cadence` guard fails the
  # build on a `gradlew` in this job.
  #
  # The bootstrap release is the one line in .jk/ci-bootstrap-version, read here and by
  # release.yml, and bumped after a release ships (docs/contributors/self-host.md, "The bootstrap
  # pin").
  #
  # Everything the job installs lands in a scratch JK_HOME inside the workspace, never the
  # runner's default ~/.jk. A self-host lane that can read a home some other job populated is a
  # lane that can pass on state the pull request did not produce.
  #
  # This job needs the network: the installer, and a self-host build resolves the workspace's
  # dependencies. Authority: docs/contributors/self-host.md.
  self-host:
    name: Self-host (jk builds jk)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/.ci-jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jk's native step links the client against the GraalVM the request's GRAALVM_HOME names
      # before it looks for an installed one; the action provides it so the lane does not download
      # a Graal of its own.
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1.6.6
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The dashboard's JS suites run under `node --test` inside `jk test`. The version is `.nvmrc`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # The installer's own knobs: JK_VERSION names the release, JK_HOME the home it lands in. The
      # version is read from the pin, never spelled here, so a release bumps one file.
      - name: Bootstrap jk from the hosted release
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .jk/ci-bootstrap-version)"
          echo "bootstrapping jk $version from https://jumpkick.build"
          curl -fsSL https://jumpkick.build/install.sh | JK_VERSION="$version" bash
          echo "$JK_HOME/bin" >> "$GITHUB_PATH"

      - name: Engine smoke
        run: |
          jk --version
          jk engine status

      # The release builds the checkout: the graph, its lock and every module through the pinned
      # jk. The native client and the engine jar land under target/dist.
      - name: Self-host build
        run: |
          set -euo pipefail
          jk build --skip-tests --no-ansi 2>&1 | tee "$RUNNER_TEMP/self-host-build.log"

      # The checkout's jk takes the home over: its client under $JK_HOME/bin, its engine under
      # $JK_HOME/lib/jk-engine, its workers on the shelf. The two comparisons are the proof that
      # from here on the commit is judged by its own jk, byte for byte.
      - name: The checkout's own jk takes over
        run: |
          set -euo pipefail
          jk install --skip-tests --no-ansi
          cmp target/dist/jk "$JK_HOME/bin/jk"
          engine_sha="$(sha256sum target/dist/lib/jk-engine-*.jar | cut -c1-64)"
          grep -q "engine-sha256 = \"$engine_sha\"" "$JK_HOME/lib/jk-engine/jk-engine.toml"
          # The pass above ran on the release's engine, which packaged the shelf. The checkout's
          # engine now packages and shelves its own workers — a client with the second install
          # pass does this by itself; the release's client stops after the first — and the shelf
          # is proven: every first-party worker jar describes itself.
          jk install --skip-tests --no-ansi
          bash scripts/check-shelf-descriptors.sh "$JK_HOME"
          jk engine status

      # Every lane, the tree lane included: text, metric, parity and generated rules run on
      # `jk guard` and `--guard`, not on an inner `jk build`, so this step is the house-rule gate.
      - name: House-rule gate (every lane)
        run: jk guard --no-ansi

      # The machine view of the house-rule lanes, for anyone reading the run after the fact; the
      # human view is the step's log. Uploaded whether or not the gate went red.
      - name: Upload the house-rule SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jk-guards-sarif
          path: target/jk-guards.sarif
          if-no-files-found: ignore

      # One annotation per broken rule, from the machine view the lanes write after each run: a
      # failure is attributed to the rule that owns it instead of being one more line of output.
      - name: Attribute house-rule failures
        if: failure()
        run: |
          report=target/jk-guards.jsonl
          if [ ! -f "$report" ]; then
            echo "::notice::the self-host build failed before the house-rule lanes wrote a report"
            exit 0
          fi
          codes=$(jq -r 'select(.baseline == "new") | .code' "$report" | sort -u)
          if [ -z "$codes" ]; then
            echo "::notice::the self-host build failed outside the house rules (no new violation in $report)"
            exit 0
          fi
          for code in $codes; do
            n=$(jq -r --arg c "$code" 'select(.code == $c and .baseline == "new") | .file' "$report" | wc -l)
            echo "::error title=$code::$n new house-rule violation(s); jk guard explain $code prints the rule, the jk-guards-sarif artifact has every site"
          done

      - name: Self-host fast test tier
        run: jk test --no-ansi

      # The boundary lane: the integration classes curated-integration.txt names, module by module,
      # under the same engine, workers and home the fast tier just ran with. The full integration
      # profile is nightly; this subset is the only integration coverage a pull request gets, so
      # guard G63 owns the registry's integrity and this step's existence.
      #
      # Budget: 8 minutes wall clock. Over it, drop or split an entry — raising the number turns the
      # lane back into the full profile the branch gate cannot afford. The elapsed seconds land in
      # the run summary so the budget is checked against a measurement.
      - name: Curated integration lane
        timeout-minutes: 8
        run: |
          set -euo pipefail
          start=$SECONDS
          scripts/curated-integration.sh
          echo "curated integration lane: $((SECONDS - start))s of an 8 minute budget" \
            >> "$GITHUB_STEP_SUMMARY"

      # Lockfile is law: jk.toml pins exactly, so a build that rewrites the committed lock means
      # a pin drifted or the lock writer put something non-deterministic in the file.
      - name: The build must not rewrite the committed lock
        run: git diff --exit-code -- jk-lock.toml

      # jk audits itself: every row of the committed lock against OSV, by the checkout's own jk
      # and its own audit worker. HIGH and CRITICAL fail the job, and so does an advisory OSV left
      # unlabelled; the machine view is the artifact and the step below attributes a red run to
      # its advisories. A finding is fixed by bumping the pin in the same pull request or accepted
      # with a reason under [audit] ignore in jk.toml — never silenced. The nightly run reports at
      # LOW. This step needs the network for the same reason the resolver does.
      - name: Audit the locked graph
        id: audit
        run: |
          set -euo pipefail
          jk audit --severity HIGH --no-ansi --output json | tee target/jk-audit.jsonl

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jk-audit
          path: target/jk-audit.jsonl
          if-no-files-found: ignore

      - name: Attribute audit findings
        if: failure() && steps.audit.outcome == 'failure'
        run: scripts/ci-audit-annotate.sh target/jk-audit.jsonl HIGH

  installer-windows:
    name: PowerShell 5.1 installer verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run network-free verification fixtures
        shell: powershell
        run: .\scripts\test-installer-verification.ps1
