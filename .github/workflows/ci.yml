# CI: every pull request, every merge-queue group and every release tag. A pull request runs every
# job but the whole integration tier; the merge queue runs all of it on the commit that becomes main,
# so main only moves to a commit that passed. A release tag runs it all again before the release
# workflow (CD) starts, which re-runs none of it. A workflow_dispatch re-runs the gate on any ref;
# on a release tag, a green dispatch releases it like the tag push would.
#
# Every job starts at once, on every OS: nothing waits for another job. The `ci` job is the one
# check the main branch's ruleset requires; it fails unless every other job passed or was skipped
# by its own condition. Steps shared by several OSes are written once, in a composite action under
# .github/actions/.

name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      integration:
        description: Run the whole integration tier (always in the merge queue, on a tag and on main)
        type: boolean
        default: false

# Every job runs the GITHUB_TOKEN read-only. A job that has to write says so itself, under its own
# `permissions:`, naming the one scope it needs.
permissions:
  contents: read

# A new push to a pull request cancels its previous run; each merge-queue group has a ref of its own.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Runners set TERM=dumb, which turns off ANSI rendering and fails TUI tests
  # that assert escape sequences. Match a real terminal.
  TERM: xterm-256color

jobs:
  # The tag names the version jk.toml declares. `jk release` tags the commit that declares it, so a
  # tag that disagrees was made by hand on the wrong commit; nothing is built for it.
  tag:
    name: Release tag matches jk.toml
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the declared version
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-version.sh "${TAG#v}"

  # Guard: commit messages must not carry agent/tool attribution trailers.
  authorship:
    name: Commit authorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The commits the run brings: a pull request's or a merge-queue group's since its base, or a
      # release's since the previous release tag. History is fixed once pushed, and a trailer that
      # landed before this check existed would fail every run forever. Any other run scans the
      # commit it was started on.
      - name: Scan commit messages
        env:
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -n "$PR_BASE" ]]; then
            range="$PR_BASE..$PR_HEAD"
          elif [[ -n "$GROUP_BASE" ]]; then
            range="$GROUP_BASE..$HEAD_SHA"
          elif [[ "$REF_TYPE" == tag ]] \
            && previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$HEAD_SHA^" 2>/dev/null)"; then
            range="$previous..$HEAD_SHA"
          else
            range="$HEAD_SHA^!"
          fi
          echo "scanning $range"
          bash scripts/check-no-agent-attribution.sh "$range"

  # The shell fixtures behind the installers, the wrapper, the Maven-repository publisher, the
  # release scripts and the curated lane's runner: network-free, and they need bash, openssl and xz
  # rather than a JDK, so they are a merge requirement of their own instead of sharing a verdict
  # with the self-host job. Steps in .github/actions/shell-fixtures; the macOS job below runs them
  # on BSD userland, LibreSSL and stock macOS's missing xz, which install.sh and the jk wrapper
  # meet there.
  fixtures:
    name: Shell fixtures (installer, wrapper, publish, release, curated lane)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/shell-fixtures

  # The workflow files themselves. actionlint (syntax, expressions, shellcheck of every run:
  # script), then the two rules scripts/check-workflows.sh owns: every action pinned to a commit
  # sha with its tag in a comment, every workflow's token read-only unless a job says otherwise.
  # A floating tag on a uses: line is a name someone else can move under the job that holds the
  # signing key; this is the job that refuses one on a pull request. actionlint arrives as a
  # release archive checked against a checksum written here, never a `go install` of a branch.
  workflows:
    name: Workflow lint (actionlint, pins, permissions)
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install actionlint, pinned by version and checksum
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" actionlint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pins, permissions and actionlint
        run: scripts/check-workflows.sh

  # JumpKick building JumpKick: the merge authority. A released jk, installed the way a user
  # installs it, builds the checked-out jk.toml / jk-lock.toml graph; then the checkout's own
  # client, engine and workers take the home over (`jk install`), so the house-rule gate, the
  # fast test tier, the curated integration lane and the audit of the lock are run by the commit's
  # jk, not by the release that bootstrapped it. No step here runs a second build system: the `ci-cadence` guard fails the
  # build on a `gradlew` in this job.
  #
  # scripts/ci-bootstrap.sh installs the bootstrap: the release .jk/ci/ci-bootstrap-version names, or
  # the bridge commit .jk/ci/ci-bootstrap-reader names built by it, for every workflow alike
  # (docs/contributors/self-host.md, "The bootstrap pin" and "The bootstrap chain").
  #
  # Everything the job installs lands in a scratch JK_HOME inside the workspace, never the
  # runner's default ~/.jk. A self-host lane that can read a home some other job populated is a
  # lane that can pass on state the pull request did not produce.
  #
  # This job needs the network: the installer, and a self-host build resolves the workspace's
  # dependencies. Authority: docs/contributors/self-host.md.
  self-host:
    name: Self-host (jk builds jk)
    runs-on: ubuntu-latest
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # jk's native step links the client against the GraalVM the request's GRAALVM_HOME names
      # before it looks for an installed one; the action provides it so the lane does not download
      # a Graal of its own.
      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The installer's own knobs: JK_VERSION names the release, JK_HOME the home it lands in. The
      # version is read from the pin, never spelled here, so a release bumps one file.
      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: Engine smoke
        run: |
          jk --version
          jk engine status

      # The release installs the checkout, which builds it first: the graph, its lock and every
      # module through the pinned jk, with the native client and the engine jar under target/dist.
      # Then the checkout's jk takes the home over: its client under $JK_HOME/bin, its engine under
      # $JK_HOME/lib/jk-engine, its workers on the shelf. The two comparisons are the proof that
      # from here on the commit is judged by its own jk, byte for byte.
      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh

      # Every lane, the tree lane included: text, metric, parity and generated rules run on
      # `jk guard` and `--guard`, not on an inner `jk build`, so this step is the house-rule gate.
      - name: House-rule gate (every lane)
        run: jk guard --no-ansi

      # The machine view of the house-rule lanes, for anyone reading the run after the fact; the
      # human view is the step's log. Uploaded whether or not the gate went red.
      - name: Upload the house-rule SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jk-guards-sarif
          path: target/jk-guards.sarif
          if-no-files-found: ignore

      # One annotation per broken rule, from the machine view the lanes write after each run: a
      # failure is attributed to the rule that owns it instead of being one more line of output.
      - name: Attribute house-rule failures
        if: failure()
        run: |
          report=target/jk-guards.jsonl
          if [ ! -f "$report" ]; then
            echo "::notice::the self-host build failed before the house-rule lanes wrote a report"
            exit 0
          fi
          codes=$(jq -r 'select(.baseline == "new") | .code' "$report" | sort -u)
          if [ -z "$codes" ]; then
            echo "::notice::the self-host build failed outside the house rules (no new violation in $report)"
            exit 0
          fi
          for code in $codes; do
            n=$(jq -r --arg c "$code" 'select(.code == $c and .baseline == "new") | .file' "$report" | wc -l)
            echo "::error title=$code::$n new house-rule violation(s); jk guard explain $code prints the rule, the jk-guards-sarif artifact has every site"
          done

      - name: Self-host fast test tier
        run: jk test --no-ansi

      # The tests that scan the doc tree, which the fast tier no longer runs: they hold the docs to
      # the code, so a change to either can break them.
      - name: Docs test suite
        run: jk test -s docs --no-ansi

      # The tests that scan every module's production sources, kept out of each module's fast tier
      # so an edit re-runs only them.
      - name: Tree test suite
        run: jk test -s tree --no-ansi

      # The boundary lane: the integration classes curated-integration.txt names, in one jk test over
      # their modules, under the same engine, workers and home the fast tier just ran with. The full
      # integration suite runs in the merge queue; this subset is the integration coverage a pull
      # request gets, so guard G63 owns the registry's integrity and this step's existence.
      #
      # Budget: 8 minutes wall clock. Over it, drop or split an entry — raising the number turns the
      # lane back into the full suite the branch gate cannot afford. The elapsed seconds land in
      # the run summary so the budget is checked against a measurement.
      - name: Curated integration lane
        timeout-minutes: 8
        run: |
          set -euo pipefail
          start=$SECONDS
          scripts/curated-integration.sh
          echo "curated integration lane: $((SECONDS - start))s of an 8 minute budget" \
            >> "$GITHUB_STEP_SUMMARY"

      # The release tier: tests a release must pass that the fast tier leaves out, such as the
      # dashboard's new-project wizard driven through Playwright's Chromium. They may fetch (the
      # browser, the dashboard's CDN, Maven Central), which this job can.
      - name: Release test tier
        run: jk test -s release --no-ansi

      # Lockfile is law: jk.toml pins exactly, so a build that rewrites the committed lock means
      # a pin drifted or the lock writer put something non-deterministic in the file.
      - name: The build must not rewrite the committed lock
        run: git diff --exit-code -- jk-lock.toml

      # A CI runner and a build container have no desktop session: a login there must keep its
      # secret in the owner-only file without a word about a keychain, and a lock must authenticate
      # with it. The check installs target/dist/jk into a throwaway home and runs it in an image
      # with no D-Bus; the runner's docker is required, so a missing runtime fails instead of
      # skipping.
      - name: Headless login and lock in a container
        timeout-minutes: 10
        env:
          JK_HEADLESS_REQUIRE_RUNTIME: '1'
        run: bash scripts/test-headless-keychain.sh target/dist/jk

      # jk audits itself: every row of the committed lock against OSV, by the checkout's own jk
      # and its own audit worker. HIGH and CRITICAL fail the job, and so does an advisory OSV left
      # unlabelled; the machine view is the artifact and the step below attributes a red run to
      # its advisories. A finding is fixed by bumping the pin in the same pull request or accepted
      # with a reason under [audit] ignore in jk.toml — never silenced. The nightly run reports at
      # LOW. This step needs the network for the same reason the resolver does.
      - name: Audit the locked graph
        id: audit
        run: |
          set -euo pipefail
          jk audit --severity HIGH --no-ansi -O jsonl | tee target/jk-audit.jsonl

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jk-audit
          path: target/jk-audit.jsonl
          if-no-files-found: ignore

      - name: Attribute audit findings
        if: failure() && steps.audit.outcome == 'failure'
        run: scripts/ci-audit-annotate.sh target/jk-audit.jsonl HIGH

  # The whole integration tier: the curated lane is the subset a pull request runs, and the merge
  # queue runs all of it, so main only moves to a commit that passed it. On a release tag and on
  # main it always runs too. A red class is a verdict about its module; --continue reports every
  # module's. The release workflow starts only on a green CI run, so a red tier here stops the
  # release.
  integration:
    name: Integration suite
    if: >-
      ${{ github.event_name == 'merge_group' || github.ref_type == 'tag'
      || github.ref == 'refs/heads/main' || inputs.integration }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JK_HOME: ${{ github.workspace }}/../jk-home
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        run: bash scripts/ci-bootstrap.sh

      - name: The checkout's own jk takes over
        run: bash scripts/ci-takeover.sh --install-only

      - name: Integration suite
        run: jk test -s integration --continue --no-ansi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  # The VS Code extension (clients/vscode), on the three desktop OSes, a job each (steps in
  # .github/actions/vscode-extension). It is not a jk module: jk's own build never needs Node.js.
  # Unit tests run under Node's runner; the integration suite starts VS Code (downloaded by
  # @vscode/test-electron) against a stub engine and a fake jk, so it needs no engine and no jk
  # install. Locally: the same npm commands, with VSCODE_EXECUTABLE naming an installed VS Code
  # (clients/vscode/README.md).
  vscode-extension-linux:
    name: VS Code extension (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/vscode-extension
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Windows -----------------------------------------------------------------------------------

  vscode-extension-windows:
    name: VS Code extension (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/vscode-extension
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  installer-windows:
    name: PowerShell 5.1 installer verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run network-free verification fixtures
        shell: powershell
        run: .\scripts\test-installer-verification.ps1

  # jk builds jk on Windows: the hosted client installs the checkout, the checkout's jk takes the
  # home over and drives a fresh project (.github/actions/product-smoke), then every module's fast
  # tier and each test class that names an OS run under it (scripts/ci-platform-tests.sh).
  # windows-2022 for the reason the product smoke gives: the checkout's install links a native
  # client, and native-image locates Visual Studio 2022 on its own.
  platform-windows:
    name: Build and test (Windows)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/product-smoke
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast tier and OS-conditioned classes
        shell: bash
        run: bash scripts/ci-platform-tests.sh

  # The Node.js toolchain on Windows: provisioning from the win-x64 zip, `jk node`, and the node
  # build e2e, under the checkout's own jk. The runner image's Node.js serves the suites that run
  # on the host's. windows-2022 for the reason the product smoke gives: the checkout's install links
  # a native client.
  node-windows:
    name: Node.js toolchain (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The home sits outside the checkout: on Windows a read of the engine's byte-range-locked
      # files under the home fails.
      - name: Home outside the checkout
        shell: bash
        run: echo "JK_HOME=$RUNNER_TEMP/jk-home" >> "$GITHUB_ENV"

      - uses: graalvm/setup-graalvm@d6eca2595046623d69d636041513c80abf745406 # v1.6.9
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bootstrap jk from the hosted release
        shell: bash
        env:
          JK_CLIENT: native
        run: bash scripts/ci-bootstrap.sh

      # The suites run under the checkout's jk: under the pinned release they ran on its engine, so
      # an engine-side fix the tree carries never reached them (workflow-suites-under-checkout-jk).
      - name: The checkout's own jk takes over
        shell: bash
        run: bash scripts/ci-takeover.sh --install-only

      - name: Node.js toolchain suites
        shell: bash
        run: bash scripts/ci-node-windows.sh

  # ---- macOS -------------------------------------------------------------------------------------

  fixtures-macos:
    name: Shell fixtures (installer, wrapper, publish, release, curated lane) on macOS
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/shell-fixtures

  vscode-extension-macos:
    name: VS Code extension (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/vscode-extension
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  platform-macos:
    name: Build and test (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/product-smoke
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fast tier and OS-conditioned classes
        run: bash scripts/ci-platform-tests.sh

  # ---- The required check ------------------------------------------------------------------------

  # The one check the main branch's ruleset requires, so a job added here gates merges without a
  # settings change: green when every job passed or was skipped by its own condition, red when any
  # failed or was cancelled. The Windows and macOS build-and-test jobs run on every pull request but
  # are not in it until their fast tiers pass on hosted runners.
  # TODO(JK-HYBD5): add platform-windows and platform-macos to needs once they pass.
  ci:
    name: CI
    if: ${{ always() }}
    needs:
      - tag
      - authorship
      - fixtures
      - workflows
      - self-host
      - integration
      - vscode-extension-linux
      - vscode-extension-windows
      - installer-windows
      - node-windows
      - fixtures-macos
      - vscode-extension-macos
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
