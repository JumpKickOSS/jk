# House rules, from the starter pack this template ships with: a command line program is held to
# the `library` pack's rules (explicit locales and charsets, @NullMarked packages, released and
# converged dependencies, a file-size ratchet). `jk lock` pins it, `jk guard explain` lists its
# rules. Add your own [guards.<id>] tables below; exempt a site with `allow` and a reason.
[guards]
extends = ["cc.jumpkick.guards:library:$jk_version$"]

# A ban of the project's own, proven against guard-fixtures/<id>.
[guards.no-soft-reference]
kind       = "forbid"
signatures = ["java.lang.ref.SoftReference"]
instead    = "a bounded cache with an explicit eviction policy"
why        = "a SoftReference is cleared at the collector's discretion, so the hit rate follows heap pressure rather than the program"
fixture    = "guard-fixtures/no-soft-reference"
