group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$

[application]
main = "$package$.Application"

[spring-boot]
version = "4.1.1"

# `git.properties` and Boot's `META-INF/build-info.properties` in the jar: the commit, branch and
# version the build came from.
[build-info]

[dependencies]
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
mcp-server = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.1"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test --profile integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
