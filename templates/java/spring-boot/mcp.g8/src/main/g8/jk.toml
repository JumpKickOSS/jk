group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$

[application]
main = "$package$.Application"

[spring-boot]
version = "4.1.1"

# `git.properties` and Boot's `META-INF/build-info.properties` in the jar: the commit, branch and
# version the build came from.
[build-info]

[dependencies]
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
mcp-server = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc:2.0.1"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Null checking: every package is @NullMarked (package-info.java), and NullAway checks it at
# compile time. The table brings JSpecify, Error Prone and NullAway at versions jk tests together.
[nullness]

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
