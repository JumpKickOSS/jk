group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$

[application]
main = "$package$.Application"

[spring-boot]
version = "latest"

[dependencies]
starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc" }
starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
h2 = { group = "com.h2database", name = "h2" }

[dev-dependencies]
devtools = { group = "org.springframework.boot", name = "spring-boot-devtools" }

[test-dependencies]
starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test --profile integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
