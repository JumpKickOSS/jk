group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
kotlin = "2.4.21"

[application]
main = "$package$.ApplicationKt"

[spring-boot]
version = "4.1.1"

# `git.properties` and Boot's `META-INF/build-info.properties` in the jar, so `/actuator/info`
# reports the commit and version the build came from.
[build-info]

[dependencies]
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
starter-validation = "org.springframework.boot:spring-boot-starter-validation"
starter-actuator = "org.springframework.boot:spring-boot-starter-actuator"
starter-data-jpa = "org.springframework.boot:spring-boot-starter-data-jpa"
h2 = "com.h2database:h2"
kotlin-reflect = "2.4.21"
jackson-kotlin = "com.fasterxml.jackson.module:jackson-module-kotlin"

[dev-dependencies]
devtools = "org.springframework.boot:spring-boot-devtools"

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"

# `jk image`: the default base, a JRE of this project's `java`, and a JEP 514 AOT cache trained
# with the image's own JVM.
[image]
name      = "$name$"
aot-cache = true

# Tests see every variable of your shell. Uncommented, this keeps them to these names: results
# stay cached across unrelated variable changes and can be shared, but tests see no other variable.
# [env]
# scope = ["SPRING_*", "<YOURAPP>_*"]

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
