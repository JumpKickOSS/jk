name = "app"
description = "The service: a REST API under /api, and the SPA bundle served from classpath:static"

[application]
main = "$package$.ApplicationKt"

[spring-boot]
version = "4.1.1"

# `git.properties` and Boot's `META-INF/build-info.properties` in the jar: the commit, branch and
# version the build came from.
[build-info]

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# `jk dev` here runs the Vite dev server beside the JVM: its /api proxy points at :8080, and the
# front door is the URL printed once both are up. `jk dev --no-sidecars` runs the app alone.
[dev.sidecars]
web = { command = "npm run dev", cwd = "../web", ready = "http://localhost:5173", front-door = true }

[dependencies]
starter-webmvc = "org.springframework.boot:spring-boot-starter-webmvc"
kotlin-reflect = "org.jetbrains.kotlin:kotlin-reflect"
# the SPA bundle: a resource jar with static/ at its root
web = { workspace = true }

[test-dependencies]
starter-test = "org.springframework.boot:spring-boot-starter-test"
