group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
kotlin = "2.4.20"

[application]
main = "$package$.MainKt"

[dependencies]
ktor-server-core = "3.5.2"
ktor-server-netty = "3.5.2"
ktor-server-content-negotiation = "3.5.2"
ktor-serialization-jackson = "3.5.2"
koin-ktor = "4.2.2"
exposed-core = "1.5.0"
exposed-jdbc = "1.5.0"
h2 = "2.5.250"
logback-classic = "1.6.3"

[test-dependencies]
ktor-server-test-host = "3.5.2"
junit-jupiter = "6.1.3"

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test --profile integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
