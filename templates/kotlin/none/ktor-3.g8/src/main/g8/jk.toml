group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
kotlin = "latest"

[application]
main = "$package$.MainKt"

# "latest" floats to the current stable; first `jk lock` pins exact versions.
[dependencies]
ktor-server-core = "latest"
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version = "latest" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation", version = "latest" }
ktor-serialization-jackson = { group = "io.ktor", name = "ktor-serialization-jackson", version = "latest" }
koin-ktor = { group = "io.insert-koin", name = "koin-ktor", version = "latest" }
exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version = "latest" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version = "latest" }
h2 = { group = "com.h2database", name = "h2", version = "latest" }
logback-classic = "latest"

[test-dependencies]
ktor-server-test-host = { group = "io.ktor", name = "ktor-server-test-host", version = "latest" }
junit-jupiter = "latest"

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test --profile integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
