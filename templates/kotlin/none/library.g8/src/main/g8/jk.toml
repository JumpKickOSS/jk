group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
kotlin = "2.4.20"

[test-dependencies]
junit-jupiter = "6.1.3"

# `git.properties` in the jar: the commit, branch and dirty flag the library was built from.
[build-info]

# The javadoc jar beside the sources jar is Dokka's javadoc-format output; the release is a pin
# `jk update` moves.
[dokka]
version = "2.2.0"

# Test tiers: `jk test` is the fast tier; each profile owns one cost tag, so every tagged
# test runs in exactly one tier (`jk test --profile integration`).
[test]
exclude-tags = ["integration", "network", "slow", "bench"]

[profiles.integration]
include-tags = ["integration"]
exclude-tags = []

[profiles.network]
include-tags = ["network"]
exclude-tags = ["integration"]

[profiles.slow]
include-tags = ["slow"]
exclude-tags = ["integration", "network"]

[profiles.bench]
include-tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

[format]
style = "standard"
