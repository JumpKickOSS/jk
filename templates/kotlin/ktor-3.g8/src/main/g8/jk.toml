group = "$organization$"
name = "$name$"
version = "0.1.0"
java = $java$
kotlin = "2.4.21"

[application]
main = "$package$.MainKt"

[dependencies]
ktor-server-core = "3.6.0"
ktor-server-netty = "3.6.0"
ktor-server-content-negotiation = "3.6.0"
ktor-serialization-jackson = "3.6.0"
koin-ktor = "4.2.2"
exposed-core = "1.6.0"
exposed-jdbc = "1.6.0"
h2 = "2.5.252"
logback-classic = "1.6.5"

[test-dependencies]
ktor-server-test-host = "3.6.0"
junit-jupiter = "6.1.3"

# `jk image`: a JRE base and a JEP 514 AOT cache trained with the image's own JVM.
[image]
name      = "$name$"
base      = "docker.io/bellsoft/liberica-runtime-container:jre-25-slim-glibc"
aot-cache = true

# Test tiers: `jk test` runs what no suite claims; `@Tag("integration")` tests are the built-in
# integration suite's (`jk test -s integration`, or `jk test -g` for both), and each suite below
# claims one more cost tag, so every tagged test runs in exactly one tier.
[test.suites.network]
tags = ["network"]
exclude-tags = ["integration"]

[test.suites.slow]
tags = ["slow"]
exclude-tags = ["integration", "network"]

[test.suites.bench]
tags = ["bench"]
exclude-tags = ["integration", "network", "slow"]

# `jk guard` formats the sources that changed before it checks; under CI it fails naming each one
# that is not formatted.
[format]
style   = "standard"
enforce = true
