group   = "com.example"
name    = "vite-sidecar"
version = "0.0.1"
java    = 25

[application]
main = "demo.Api"

# The front end is a node build beside the JVM sources. jk provisions the Node.js below, installs
# web/ from its package-lock.json and runs its build, so the bundle rides in the jar under static/.
# Under `jk dev` it also runs web/'s `dev` script beside the JVM — no sidecar to write.
[node]
version = 24
dir     = "web"

# Under `jk dev` — and only there — the JVM counts as ready once /api/hello answers.
[dev]
ready = "http://localhost:8080/api/hello"

[test-dependencies]
junit-jupiter = "6.1.3"
