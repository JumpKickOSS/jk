group   = "com.example"
name    = "workspace-showcase"
version = "0.0.1"
java    = 25

[workspace]
modules = ["lib", "app"]

# One test-framework version for the whole workspace. Modules opt in with
# `junit-jupiter.workspace = true`. The `=` is an exact pin: a bare "6.1.3"
# would mean `^6.1.3` and could float to another 6.x at lock time.
[workspace.dependencies]
junit-jupiter = "=6.1.3"
