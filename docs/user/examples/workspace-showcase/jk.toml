group   = "com.example"
name    = "workspace-showcase"
version = "0.0.1"
java    = 25

[workspace]
modules = ["lib", "app"]

# One test-framework version for the whole workspace. Modules opt in with
# `junit-jupiter.workspace = true`. A bare version is an exact pin; `jk update`
# is what moves it.
[workspace.dependencies]
junit-jupiter = "6.1.3"
