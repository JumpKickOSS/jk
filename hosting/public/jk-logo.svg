<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- SPDX-License-Identifier: Apache-2.0 — the jk mark. Letterforms are outlined from
       JetBrains Mono Bold (SIL OFL 1.1, (c) The JetBrains Mono Project Authors) so no font
       needs to load. Palette matches the engine dashboard / Jk Dark TUI (style.css): near-black
       surface, neon cyan accent glow, bright text — not a CRT green-screen. -->
  <defs>
    <linearGradient id="jk-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161d25"/>
      <stop offset="100%" stop-color="#090c11"/>
    </linearGradient>
    <clipPath id="jk-clip"><rect width="64" height="64" rx="14"/></clipPath>
    <g id="jk-glyphs" transform="translate(10.363 42.515) scale(0.03470 -0.03470)">
      <path d="M81 -180V-67H226Q274 -67 302.0 -38.5Q330 -10 330 39V437H76V550H455V36Q455 -64 395.0 -122.0Q335 -180 233 -180ZM386 642Q348 642 326.0 661.5Q304 681 304 714Q304 747 326.0 766.5Q348 786 386 786Q424 786 446.0 766.5Q468 747 468 714Q468 681 446.0 661.5Q424 642 386 642Z"/>
      <path d="M682 0V730H807V334H895L1026 550H1165L1002 284L1171 0H1029L895 228H807V0Z"/>
    </g>
    <filter id="glow-halo" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glow-wide" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
    <filter id="glow-tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- panel: s1 to bg -->
  <rect width="64" height="64" rx="14" fill="url(#jk-panel)"/>
  <!-- thin border: bd -->
  <rect width="64" height="64" rx="14" fill="none" stroke="#2a3742" stroke-width="1.25"/>
  <g clip-path="url(#jk-clip)">
    <!-- cyan neon glow: cn #00f0ff -->
    <use href="#jk-glyphs" fill="#00f0ff" filter="url(#glow-halo)" opacity="0.45"/>
    <use href="#jk-glyphs" fill="#00d4e0" filter="url(#glow-wide)" opacity="0.75"/>
    <use href="#jk-glyphs" fill="#00f0ff" filter="url(#glow-tight)" opacity="0.9"/>
    <!-- letterforms: bright -->
    <use href="#jk-glyphs" fill="#eceff1"/>
  </g>
</svg>
