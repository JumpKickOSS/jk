# Build performance defaults (suite split still owns test wall time).
org.gradle.parallel=true
org.gradle.caching=true
# buildSrc Kotlin DSL needs more than the 512m default. Prefer in-process kotlinc so a
# stale kotlin-daemon RMI port cannot hang the build under WSL2 mirrored networking
# (settings.gradle.kts also sweeps dead ~/.local/share/kotlin/daemon/*.run entries).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dkotlin.compiler.execution.strategy=in-process
