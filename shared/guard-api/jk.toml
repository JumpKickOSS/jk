name = "jk-guards-junit"
description = "Guard-test library: @Guard/@GuardSuite and the injected Facts, Model, Text, Output and Violations views"
# Guard tests run inside a project's forked JUnit launcher on the project's JDK; stay on release 17
# like jk-plugin-sdk.
java = 17

[dependencies]
jk-host.workspace = true
junit-jupiter-api = { group = "org.junit.jupiter", version = "latest" }

# ArchUnit is the user's: provided here so JkArchUnit compiles, never on jk-guards-junit's runtime classpath.
[provided-dependencies]
archunit = { group = "com.tngtech.archunit", version = "latest" }

[test-dependencies]
archunit = { group = "com.tngtech.archunit", version = "latest" }
assertj-core = "latest"
junit-jupiter = "latest"
junit-platform-launcher = "latest"
