[project]
name = "jk-core"
description = "Core library: config, lockfile, layout, and policy"

[dependencies]
jk-model.workspace = true
tomlj = "latest"
maven-artifact = "latest"

[test-dependencies]
assertj-core = "latest"
junit-jupiter = "latest"

# Bake built-in plugin manifests (and optional scaffolds) into the jar.
[build]
extra-resources = [
  { from = "../../plugins/*/jk-plugin.toml", into = "cc/jumpkick/plugin/manifest", rename = "{1}.jk-plugin.toml" },
  { from = "../../plugins/*/scaffold/**", into = "cc/jumpkick/plugin/manifest", optional = true },
]
