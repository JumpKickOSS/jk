name = "jk-core"
description = "Core library: config, lockfile, layout, and policy"

[dependencies]
jk-model.workspace = true
jk-host.workspace = true
tomlj = "latest"

[provided-dependencies]
lombok = "latest"

[processor-dependencies]
lombok = "latest"

[test-dependencies]
# `kind = "tests"` reaches jk-host's test classes — where its `[test] extra-src`
# fixtures compile. Direct edge only, and never in a main jar.
jk-host = { workspace = true, kind = "tests" }
assertj-core = "latest"
junit-jupiter = "latest"
