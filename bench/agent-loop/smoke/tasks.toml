# Tier-0 smoke tasks over smoke/fixture: one caller question and one rename, each a few turns
# for an agent that uses jk's graph. A decoy `Journal.post` makes a text search over-answer.

[tasks.smoke-callers]
kind = "question"
repo = "smoke"
prompt = "Which methods call `Ledger.post(Entry)`? Count calls from Ledger's own methods too."
answer = ["Billing.charge", "Refunds.refund", "Ledger.transfer"]

[tasks.smoke-rename]
kind = "change"
repo = "smoke"
prompt = "Rename the method `Ledger.post(Entry)` to `record`, keeping its behaviour, and update every caller. `Journal.post` is a different method and stays as it is."
test = ["jk", "-u", "-x", "-a", "build", "-S"]

# Tier 0 for the renames beyond a method (tier 2's rename traps, small): a field as a bean property with
# a template that must follow and a SQL column that must not, and a class named in a services file.
[tasks.smoke-rename-field]
opt-in = true
kind = "change"
repo = "smoke"
prompt = "Rename the field `Account.owner` to `holder`, with its getter and setter, and every use of them, including the template that shows it. The database column stays `owner`."
# The baseline must pass before the agent; smoke-check.sh arrives with the hidden files.
test = ["sh", "-c", "jk -u -x -a build -S && { test ! -f smoke-check.sh || sh smoke-check.sh; }"]

[tasks.smoke-rename-class]
opt-in = true
kind = "change"
repo = "smoke"
prompt = "Rename the class `Journal` to `Diary`, its file and every use of it, so ServiceLoader still finds it."
test = ["sh", "-c", "jk -u -x -a build -S && { test ! -f smoke-check.sh || sh smoke-check.sh; }"]
