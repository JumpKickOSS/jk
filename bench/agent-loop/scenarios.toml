[repos.junit-starter-gradle]
source = "https://github.com/junit-team/junit-examples"
commit = "bb7eb03dc51dc8ea9ddebe8022e4362d0d427174"
subdir = "junit-jupiter-starter-gradle"
tool = "gradle"
build = "build.gradle"
tools = ["jk", "gradle"]

[repos.junit-starter-gradle.failures.compile-error]
file = "src/main/java/com/example/project/Calculator.java"
find = "return a + b;"

[repos.junit-starter-gradle.failures.failing-assertion]
file = "src/test/java/com/example/project/CalculatorTests.java"
find = 'assertEquals(2, calculator.add(1, 1), "1 + 1 should equal 2");'
replace = 'assertEquals(3, calculator.add(1, 1), "1 + 1 should equal 2");'
tests = ["com.example.project.CalculatorTests"]

[repos.junit-starter-gradle.failures.missing-dependency]
artifact = "junit-jupiter"
files = ["src/test/**"]

[repos.junit-starter-gradle.failures.version-conflict]
coordinate = "org.junit.jupiter:junit-jupiter-api:5.0.0"
# Both tools take the pin over the platform's constraint, so the conflict surfaces when the
# JUnit engine fails to start; the results must say so, since no test can be named.
kind = "resolve"
pattern = "(?i)failed to discover tests|cannot create launcher|discovery exited|junit-jupiter-api|cannot resolve|version constraint"
