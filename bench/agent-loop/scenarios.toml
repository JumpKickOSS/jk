[repos.junit-starter-gradle.failures.version-conflict]
coordinate = "org.junit.jupiter:junit-jupiter-api:5.0.0"
# Both tools take the pin over the platform's constraint, so the conflict surfaces when the
# JUnit engine fails to start; the results must say so, since no test can be named.
kind = "resolve"
pattern = "(?i)failed to discover tests|cannot create launcher|discovery exited|junit-jupiter-api|cannot resolve|version constraint"

# ---------------------------------------------------------------- beyond the Gradle guides
# Maven-first (jk imports the pom), multi-module, and Kotlin repos. Probed 2026-09-29: green under
# their own tool (pinned Maven/Gradle) and under jk after `jk import`, no hand edits.

[repos.gs-multi-module]
source = "https://github.com/spring-guides/gs-multi-module"
commit = "d88a2b721bda3798a6a934987157498e66da06c5"
subdir = "complete"
tool = "mvn"
build = "pom.xml"
tools = ["jk", "mvn", "gradle"]
modules = 2

[repos.gs-multi-module.failures.compile-error]
file = "library/src/main/java/com/example/multimodule/service/MyService.java"
find = "return this.serviceProperties.getMessage();"

[repos.gs-multi-module.failures.failing-assertion]
file = "library/src/test/java/com/example/multimodule/service/MyServiceTest.java"
find = "assertThat(myService.message()).isNotNull();"
replace = 'assertThat(myService.message()).isEqualTo("Hello, World");'
tests = ["com.example.multimodule.service.MyServiceTest"]

# The library's only main dependency: the application's starters are not on its classpath.
[repos.gs-multi-module.failures.missing-dependency]
artifact = "spring-boot"
jk = "library/jk.toml"
pom = "library/pom.xml"
gradle = "library/build.gradle"
files = ["library/src/main/**"]

# Not on Maven: without `clean` it keeps the deleted file in target/classes and stays green.
[repos.gs-multi-module.failures.missing-resource]
file = "application/src/main/resources/application.properties"
tools = ["jk", "gradle"]
tests = ["com.example.multimodule.application.DemoApplicationTest"]

[repos.gs-multi-module.failures.version-conflict]
coordinate = "org.springframework:spring-core:6.0.0"
jk = "application/jk.toml"
pom = "application/pom.xml"
gradle = "application/build.gradle"
# Imported from Maven, jk keeps nearest-wins pins (`pins = "nearest"`), so the old spring-core
# wins on every tool and the Boot context fails at test time. MyServiceTest fails only under jk,
# whose library test classpath sees the application's pin.
kind = "test"
tests = ["com.example.multimodule.application.DemoApplicationTest", "com.example.multimodule.service.MyServiceTest"]

