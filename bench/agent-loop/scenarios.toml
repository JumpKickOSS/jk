# The agent-loop corpus: public repositories pinned by commit, each green at baseline under
# every tool it lists, and the failures that can be injected into each. `scenario --list`
# prints the matrix; `scenario --verify` proves it. README.md explains the selection.
#
# Repo fields: source, commit, subdir (project root inside the clone), tool (the build the
# repo ships and `jk import` reads), build (that file), tools (which of jk/mvn/gradle have a
# green baseline — mvn only where the repo also ships a pom.xml), modules, language.
#
# Failure tables, one per class the repo supports:
#   compile-error        file + find (a statement ending in `;`, the `;` is removed) → that file:line
#   failing-assertion    file + find/replace in a test + tests (classes expected to fail)
#   missing-dependency   artifact removed from the tool's build file → compile errors in `files`
#   missing-resource     file deleted → `tests` fail
#   version-conflict     coordinate pinned exactly (Gradle: strictly) → `kind` per tool
# A failure may carry `tools = [...]` to restrict itself to a subset of the repo's tools.

