# Change tasks for bench/agent-loop/change-tasks: what developers do all day (add, rename,
# implement, fix from a symptom) on repositories big enough for navigation to cost something.
# `repo` names a graph-retrieval corpus repository; `tools` the build tools the task runs under.
# `inject` plants a defect before the baseline commit (`from` must occur exactly once), and
# `baseline = "red"` says the tests fail before the agent starts. tasks/<task>/<tool>/ (or
# tasks/<task>/all/) is copied over the sandbox after the agent stops, `restore` directories are put
# back from the corpus as shipped, and the tool's full test run then decides.

[tasks.petclinic-owner-email]
repo   = "spring-petclinic"
kind   = "add-field"
tools  = ["jk", "mvn"]
prompt = """
Owners need an optional email address. Add an `email` property to `Owner` (getter `getEmail()`,
setter `setEmail(String)`), stored in a new `email` column of the owners table in every database's
schema, validated as an email address when present, editable in the owner form, and shown on the
owner details page.
"""

[tasks.petclinic-rename-addvisit]
repo   = "spring-petclinic"
kind   = "rename"
tools  = ["jk", "mvn"]
prompt = """
Rename `Owner.addVisit` to `recordVisit`, keeping its parameters and behaviour, and update every
caller, tests included.
"""

[tasks.commons-lang-rename-indexof]
repo   = "commons-lang"
kind   = "rename"
tools  = ["jk", "mvn"]
prompt = """
Rename both `CharSequenceUtils.indexOf` overloads (the `CharSequence` search and the `int` character
search) to `find`, keeping their parameters and behaviour, and update every caller, tests included.
Other classes' `indexOf` methods stay as they are.
"""

[tasks.commons-lang-tostringstyle-name]
repo   = "commons-lang"
kind   = "implement"
tools  = ["jk", "mvn"]
prompt = """
Add `public String getName()` to `ToStringStyle`. Each built-in style returns the name of the
`ToStringStyle` constant that holds it (`ToStringStyle.DEFAULT_STYLE.getName()` is
"DEFAULT_STYLE", and so on for every constant). Every other `ToStringStyle` subclass in the library
returns its own simple class name (`new StandardToStringStyle().getName()` is
"StandardToStringStyle").
"""

[tasks.commons-lang-ignorecase-symptom]
repo     = "commons-lang"
kind     = "symptom"
tools    = ["jk", "mvn"]
baseline = "red"
restore  = ["src/test"]
inject   = [
  { file = "src/main/java/org/apache/commons/lang3/CharSequenceUtils.java", from = "((String) cs).regionMatches(ignoreCase, thisStart, (String) substring, start, length)", to = "((String) cs).regionMatches(false, thisStart, (String) substring, start, length)" },
]
prompt = """
`StringUtils.endsWithIgnoreCase("ABCDEF", "def")` returns false, and so does
`StringUtils.containsIgnoreCase("ABC", "b")`; both should be true. Find the cause and fix it. Do
not change the tests.
"""

# Navigation-heavy: the callers reach the method through variables (`intRange.contains(15)`), so a
# qualified search misses them, and the bare name collides with every other `contains` in the library.
[tasks.commons-lang-rename-range-contains]
repo   = "commons-lang"
kind   = "rename-colliding"
tools  = ["jk", "mvn"]
prompt = """
Rename the instance method `Range.contains(T)` to `includes`, keeping its behaviour, and update every
caller, tests included. `Range.containsRange` and every other class's `contains` stay as they are.
"""

# Navigation-heavy, unfamiliar code: jk's own 680k-line tree, which no model was trained on. Two real
# callers of an instance method; `.between(` matches about a hundred lines (ChronoUnit, Duration, ...).
[tasks.jk-rename-codegraph-between]
repo   = "jk"
kind   = "rename-colliding"
tools  = ["jk"]
test   = ["jk", "-u", "-x", "-a", "test", "-m", "shared/code-graph"]
prompt = """
Rename the instance method `CodeGraph.between(String, String)` to `edgesBetween`, keeping its behaviour,
and update every caller. Methods named `between` on other types stay as they are.
"""

# Navigation questions: the agent writes ANSWER.txt and nothing else, graded against the compiler's
# facts (bench/graph-retrieval/Truth.java, main classes, lambdas count as their enclosing method).
# Picked where a name search is weak: a method name many types declare, a chain of calls several
# hops deep, a type hierarchy more than one level deep. No build or test run decides these.

[tasks.cl-callers-csu-indexof]
repo   = "commons-lang"
kind   = "question"
tools  = ["jk"]
prompt = """
Which methods call `org.apache.commons.lang3.CharSequenceUtils.indexOf` (either overload) directly?
"""
answer = ["CsStrings.contains", "CsStrings.indexOf", "StringUtils.contains", "StringUtils.countMatches",
          "StringUtils.indexOf", "StringUtils.indexOfAny", "StringUtils.ordinalIndexOf"]

[tasks.cl-impact-ispackage]
repo   = "commons-lang"
kind   = "question"
tools  = ["jk"]
prompt = """
We are changing `org.apache.commons.lang3.reflect.MemberUtils.isPackage`. List every method that can
reach it through a chain of direct calls: its callers, their callers, and so on.
"""
answer = ["ConstructorUtils.getMatchingAccessibleConstructor", "ConstructorUtils.invokeConstructor",
          "EventBindingInvocationHandler.invoke", "EventUtils.addEventListener", "EventUtils.bindEventsToMethod",
          "FieldUtils.getField", "FieldUtils.readDeclaredField", "FieldUtils.readDeclaredStaticField",
          "FieldUtils.readField", "FieldUtils.readStaticField", "FieldUtils.setAccessible",
          "FieldUtils.writeDeclaredField", "FieldUtils.writeDeclaredStaticField", "FieldUtils.writeField",
          "FieldUtils.writeStaticField", "MemberUtils.setAccessibleWorkaround", "MethodUtils.getInvokeMethod",
          "MethodUtils.getMatchingAccessibleMethod", "MethodUtils.getOverrideHierarchy", "MethodUtils.invokeMethod",
          "MethodUtils.invokeStaticMethod"]

