Code that only needs an owner's contact details should not depend on `Owner`. Create an interface
`OwnerContact` in the owner package declaring exactly `getAddress()`, `getCity()` and
`getTelephone()`, make `Owner` implement it, and change each method parameter in the owner package
that is used only through those three methods to take `OwnerContact` instead. Keep every caller
working and every test passing.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "OwnerContactTests", "-S", "OwnerControllerTests", "-S", "ClinicServiceTests"]

# An instance move: a method planted in Pet that reads the pet's name and its type goes to PetType,
# taking the Pet. Callers outside Pet cannot see its private field type, so each reaches the type
