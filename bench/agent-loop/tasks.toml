# The push slice: paired tasks for the stale-anchor push in a build's verdict (docs/user/graph.md,
# "After a hand edit"). A TRAP asks for one side of an anchor by hand, and the hidden check fails unless the
# other side changes too, where no test of the agent's own run looks; a DECOY edits a file full of anchors and
# the right change touches nothing else. jk's default build pushes (anchor-tail silent: the places, prose silent):
# compare arm jk unset with AGENT_LOOP_ANCHOR_TAIL=off or jk-before on 0.52.0 (no push), and the prose
# variants with AGENT_LOOP_ANCHOR_TAIL=count and =kinds. Builds before the push became the default pushed
# nothing unless AGENT_LOOP_ANCHOR_TAIL=silent.
# A push that adds reads, turns or tokens on the decoys for an agent is off for that agent; reads of pushed
# files that lead to no edit are the noise metric. Every test class but the Docker ones runs, as above.

# TRAP. Only H2's schema is named; MySQL's (db/mysql/schema.sql:34) and Postgres' (db/postgres/schema.sql:32)
# still say telephone, and so do Postgres' seed INSERTs (db/postgres/data.sql:25-34); the agent's own tests run
# on H2 alone. Once the entity maps the new column (its tests fail until it does), the verdict lists them.
# docs/CHANGELOG.md names the old column as history and must stay: the variants count it (1 markdown), and a
# count that talks an agent into rewriting it fails the task. Matters: the push (jk vs jk-before) and
# count/kinds against silent.
[tasks.petclinic-push-column-h2]
repo   = "spring-petclinic"
kind   = "rename-column"
tools  = ["jk"]
prompt = """
We develop on H2: in `src/main/resources/db/h2/schema.sql`, rename the owners table's `telephone` column
to `phone`. The Java property stays `telephone`. The application must keep running on every database it
supports.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "PhoneColumnEverySchemaAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# TRAP. The key is renamed in application.properties only; VisitLimits' maxPerDay (bound by relaxed name)
# and the two variables that set it (docker-compose.yml, the load-test workflow) still say max-per-day. No
# test of the agent's reads the configured value, so its run passes with the default; the verdict lists
# VisitLimits.java and both variables. Matters: the push. No prose names the key, so the variants are equal.
[tasks.petclinic-push-config-key]
repo   = "spring-petclinic"
kind   = "rename-property"
tools  = ["jk"]
prompt = """
In `src/main/resources/application.properties`, the visit limit's key `petclinic.visits.max-per-day` is
renamed to `petclinic.visits.daily-limit`. The configured limit must keep taking effect, however the
application is configured.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "VisitLimitKeyAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# TRAP. The pets endpoint's PetView record says birthDate, and scripts/birthday-cards.sh's jq reads
# `.birthDate` on the pipeline that requests the route. Before the json anchor kind this was the control
# (silent in every arm); with it, renaming the record component lists birthday-cards.sh:5. Matters: the
# push (jk vs jk-before).
[tasks.petclinic-push-json-property]
repo   = "spring-petclinic"
kind   = "rename-property"
tools  = ["jk"]
prompt = """
In the owners API (`OwnerApiController`), the pets endpoint's JSON property `birthDate` is renamed to
`born`.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "BornPropertyAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# DECOY for petclinic-push-column-h2: Owner maps the owners table and its columns, and the fix is a method
# body. No name changes, so every arm's verdict is silent; any extra read of a schema is noise.
[tasks.petclinic-push-decoy-getpet]
repo   = "spring-petclinic"
kind   = "fix"
tools  = ["jk"]
prompt = """
A front-desk clerk typed " leo" and `Owner.getPet` found no pet. Make it match a pet's name while
ignoring spaces around either name, as it already ignores case.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "GetPetIgnoresSpacesAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# DECOY for petclinic-push-json-property: the edits are in two controllers that define routes, and change
# only exception text. No name changes; every arm's verdict is silent.
[tasks.petclinic-push-decoy-not-found]
repo   = "spring-petclinic"
kind   = "fix"
tools  = ["jk"]
prompt = """
The "owner not found" errors read differently in each controller, and one stops mid-sentence. Make every
one of them say exactly `Owner <id> not found.` (for example `Owner 42 not found.`).
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "OwnerNotFoundMessageAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# DECOY for petclinic-push-config-key: the same key, compose file and workflow, but only its value
# changes. No name changes; every arm's verdict is silent, and the overrides must stay as they are.
[tasks.petclinic-push-decoy-limit-value]
repo   = "spring-petclinic"
kind   = "config"
tools  = ["jk"]
prompt = """
Raise the clinic's configured daily visit limit in `src/main/resources/application.properties` from 20
to 25.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "VisitLimitValueAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# The polyglot pair: an owner-card endpoint (OwnerCardController and its OwnerCard record) with a TypeScript
# web client (client/src/owner-card.ts: an OwnerCard interface and the line it renders) and a hand-written
# OpenAPI file (docs/openapi.yaml). No test of the agent's own run reads the client or the OpenAPI file.

# TRAP. Renaming the record component (or giving it @JsonProperty("phone")) passes every Java test; the
# verdict then lists client/src/owner-card.ts (the interface member and the rendered line, both tied: the
# interface by the record's name, the read by the request in the same function) and docs/openapi.yaml's
# OwnerCard.telephone. The hidden check reads the card, checks the client's interface and reads against it
# and the OpenAPI schema by text, and runs the client's node test where Node.js 22.6+ is installed.
# Matters: the push (jk vs jk-before).
[tasks.petclinic-push-ts-client]
repo   = "spring-petclinic"
kind   = "rename-property"
tools  = ["jk"]
prompt = """
The owner card endpoint (`GET /api/owners/{ownerId}/card`) is renamed on the server: its JSON property
`telephone` becomes `phone`. Everything that reads the card must keep working.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "OwnerCardPhoneAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]

# DECOY for petclinic-push-ts-client: the same endpoint, client and OpenAPI file, but the fix is the
# handler's body (an unknown owner answers 404, which docs/openapi.yaml already documents). No JSON name
# changes, so every arm's verdict is silent; the client and the OpenAPI file must stay byte for byte.
[tasks.petclinic-push-ts-client-decoy]
repo   = "spring-petclinic"
kind   = "fix"
tools  = ["jk"]
prompt = """
`GET /api/owners/{ownerId}/card` for an owner that does not exist answers 500. Make it answer 404, as
docs/openapi.yaml says it does.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "OwnerCardNotFoundAcceptanceTests", "-S", "ValidatorTests", "-S", "OwnerControllerTests", "-S", "OwnerTests", "-S", "PetControllerTests", "-S", "PetTypeFormatterTests", "-S", "PetValidatorTests", "-S", "VisitControllerTests", "-S", "ClinicServiceTests", "-S", "CrashControllerIntegrationTests", "-S", "CrashControllerTests", "-S", "I18nPropertiesSyncTest", "-S", "WelcomeControllerTests", "-S", "VetControllerTests", "-S", "VetTests", "-S", "PetClinicIntegrationTests", "-S", "PetClinicConcurrencyTests"]
