          "TextField", "TimeZoneNameRule", "TimeZoneNumberRule", "TwelveHourField", "TwentyFourHourField",
          "TwoDigitMonthField", "TwoDigitNumberField", "TwoDigitYearField", "UnpaddedMonthField",
          "UnpaddedNumberField", "WeekYear"]

