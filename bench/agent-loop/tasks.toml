# Tier 2's rename traps, a sliver: run each with --arm jk --arm jk-nograph, never the whole
# tier. The test runs name their classes: petclinic's Postgres and MySQL tests need Docker.
[tasks.petclinic-rename-telephone]
repo   = "spring-petclinic"
kind   = "rename"
tools  = ["jk"]
prompt = """
Rename the `telephone` property of `Owner` to `phone` everywhere it is used (the field, its getter
and setter, the templates and the tests), but keep the existing `telephone` database column: the
data already stored must still load.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "PhoneColumnTests", "-S", "OwnerControllerTests", "-S", "ClinicServiceTests"]

# A pull-up: an instance method planted in Owner moves to Person, its superclass, so Vet has it too.
# Its caller reaches it through an Owner and must keep compiling; the hidden check reads where it is
# declared and calls it on a Vet. Compare the pull_up card listed (jk-graph) with it unlisted (jk) and
# with no graph (jk-nograph).
[tasks.petclinic-pullup-display-name]
repo   = "spring-petclinic"
kind   = "pull-up"
tools  = ["jk", "mvn"]
inject = [
  { file = "src/main/java/org/springframework/samples/petclinic/owner/Owner.java", from = "\tpublic String getAddress() {", to = "\tpublic String getDisplayName() {\n\t\treturn getFirstName() + \" \" + getLastName();\n\t}\n\n\tpublic String getAddress() {" },
]
prompt = """
Vets need the display name owners have. Pull `Owner.getDisplayName()` up into `Person`, its
superclass, so it is declared once there and no longer in `Owner`, keeping its behaviour, and keep
every caller working.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "PersonDisplayNameTests", "-S", "OwnerTests", "-S", "VetTests"]

# A delete: three methods and a type planted in the owner package, each named as maybe dead. A type
# nothing uses is the only caller of one method, so that method is dead once the type goes; another
# is called only by reflection, through a string constant, and must stay. The hidden check reads which
# declarations are left and calls the kept one by name. Compare the delete card listed (jk-graph)
# with it unlisted (jk) and with no graph (jk-nograph).
[tasks.petclinic-delete-dead-code]
repo   = "spring-petclinic"
kind   = "delete"
tools  = ["jk", "mvn"]
inject = [
  { file = "src/main/java/org/springframework/samples/petclinic/owner/Owner.java", from = "\tpublic String getAddress() {", to = "\tpublic String formatLegacyName() {\n\t\treturn getLastName().toUpperCase() + \", \" + getFirstName();\n\t}\n\n\tpublic String describeForAudit() {\n\t\treturn \"owner \" + getId() + \" in \" + getCity();\n\t}\n\n\tpublic boolean hasPets() {\n\t\treturn !this.pets.isEmpty();\n\t}\n\n\tpublic String getAddress() {" },
]
prompt = """
Clean up dead code in the owner package. Each of these may be unused: `Owner.formatLegacyName()`,
`Owner.describeForAudit()`, `Owner.hasPets()` and the class `OwnerLegacyFormat`. Delete each one
that nothing uses once the others you delete are gone, and keep each one that something still uses,
by a call or any other way. Keep every test passing.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "OwnerDeadCodeTests", "-S", "OwnerControllerTests", "-S", "ClinicServiceTests"]

# A move: a static method and the constant it reads, planted in Owner, go to PhoneNumbers in the model
# package. Their callers reach them every way javac binds a static: a qualified call, a method
# reference, static imports and a doc link, in the owner package and in another. The hidden check
# reads where each is declared and calls every caller. Compare the move card listed (jk-graph) with it
# unlisted (jk) and with no graph (jk-nograph).
[tasks.petclinic-move-phone-format]
repo   = "spring-petclinic"
kind   = "move"
tools  = ["jk", "mvn"]
inject = [
  { file = "src/main/java/org/springframework/samples/petclinic/owner/Owner.java", from = "\tpublic String getAddress() {", to = "\tpublic static final int TELEPHONE_DIGITS = 10;\n\n\tpublic static String formatTelephone(String telephone) {\n\t\tif (telephone == null || telephone.length() != TELEPHONE_DIGITS) {\n\t\t\treturn telephone;\n\t\t}\n\t\treturn \"(\" + telephone.substring(0, 3) + \") \" + telephone.substring(3, 6) + \"-\" + telephone.substring(6);\n\t}\n\n\tpublic String getAddress() {" },
]
prompt = """
Telephone formatting belongs with the other phone helpers. Move `Owner.formatTelephone(String)` and
the constant `Owner.TELEPHONE_DIGITS` into `PhoneNumbers` in the model package, so each is declared
there alone, still static and public, with the same behaviour, and keep every caller working and
every test passing.
"""
test   = ["jk", "-u", "-x", "-a", "test", "-S", "PhoneNumbersMoveTests", "-S", "OwnerControllerTests", "-S", "ClinicServiceTests"]

# An extracted interface: OwnerContact, the three contact getters of Owner, which implements it. A
# planted class reads an owner only through those getters and must take the interface; a planted
# decoy also reads the first name and must keep Owner. The hidden check reads the interface's
# methods, what Owner implements and each planted method's parameter. Compare the extract_interface
# card listed (jk-graph) with it unlisted (jk) and with no graph (jk-nograph).
