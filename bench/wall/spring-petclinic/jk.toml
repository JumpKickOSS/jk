group    = "org.springframework.samples"
name     = "spring-petclinic"
version  = "4.0.0-SNAPSHOT"
description = "The Spring PetClinic sample application"
java     = 17

# An application, as the pom.xml's spring-boot-maven-plugin says; without this table jk treats the
# module as a library and writes sources and javadoc jars on every build.
[application]
main = "org.springframework.samples.petclinic.PetClinicApplication"

[platform-dependencies]
spring-boot-starter-parent = { group = "org.springframework.boot", version = "4.1.0" }

[dependencies]
cache-api = { group = "javax.cache", version = "1.1.1" }
"jakarta.xml.bind-api" = { group = "jakarta.xml.bind", version = "4.0.5" }
spring-boot-devtools = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-actuator = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-cache = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-data-jpa = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-thymeleaf = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-validation = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-webmvc = { group = "org.springframework.boot", version = "4.1.0" }

[runtime-dependencies]
bootstrap = { group = "org.webjars.npm", version = "5.3.8" }
caffeine = { group = "com.github.ben-manes.caffeine", version = "3.2.4" }
font-awesome = { group = "org.webjars.npm", version = "4.7.0" }
h2 = { group = "com.h2database", version = "2.4.240" }
mysql-connector-j = { group = "com.mysql", version = "9.7.0" }
postgresql = { group = "org.postgresql", version = "42.7.11" }
webjars-locator-lite = { group = "org.webjars", version = "1.1.3" }

[test-dependencies]
spring-boot-docker-compose = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-actuator-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-cache-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-data-jpa-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-restclient = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-restclient-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-thymeleaf-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-validation-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", version = "4.1.0" }
spring-boot-testcontainers = { group = "org.springframework.boot", version = "4.1.0" }
testcontainers-junit-jupiter = { group = "org.testcontainers", version = "2.0.5" }
testcontainers-mysql = { group = "org.testcontainers", version = "2.0.5" }

[javac]
args = ["-parameters"]
